<!doctype html>
<html><head><meta charset="utf-8">
<!-- Mariam success story · Option C · FULL-BLEED KINETIC: poster-led and punchy. July is grey and typographic (big words,
     the desaturated exercises scrolling behind, a month word that rolls July → October); on «ده شغلها!» a hard cut to her
     poster in full colour (the poster fills the frame over its own blurred light), then the campaign as a flip-book on the
     VO words, the process slams, the reward, the CTA and the end card. -->
<style>
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Bebas;src:url(../../brand-kit/assets/fonts/BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo;background:#0A0A0A;color:#F6F3F2}
.pl{position:absolute;left:86px;right:86px;display:flex;justify-content:center;direction:rtl;gap:0 .24em;font-weight:700;line-height:1.22;white-space:nowrap}
.wm{display:inline-block;position:relative;clip-path:inset(-.22em -.8em -.30em -.8em)}
.wi{display:inline-block;position:relative;z-index:1}
.bk{position:absolute;left:-.1em;right:-.1em;top:.2em;bottom:.06em;background:#C4321F;transform-origin:100% 50%;z-index:0;transform:scaleX(0)}
.st{position:absolute;left:-.05em;right:-.05em;top:54%;height:.1em;background:#C4321F;transform-origin:100% 50%;z-index:2}
.abs{position:absolute}.lat{font-family:Bebas;font-weight:400}
.corner{position:absolute;width:46px;height:46px;border-color:#C4321F;border-style:solid;z-index:50}
.full{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;filter:blur(46px) brightness(.55) saturate(1.2)}
.fg{position:absolute;left:140px;top:296px;width:800px;height:1000px;border-radius:26px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.fg img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;padding:6px 20px;border-radius:999px;background:rgba(10,10,10,.72);color:#F6F3F2;font-size:26px;font-weight:500;white-space:nowrap;direction:rtl}
.shot{position:absolute;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.grid{position:absolute;inset:0;background-size:72px 72px;background-image:linear-gradient(rgba(246,243,242,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(246,243,242,.03) 1px,transparent 1px)}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 50%,transparent 58%,rgba(122,27,18,.28) 100%)}
.shade{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(transparent,rgba(10,10,10,.92) 62%)}
</style></head>
<body><div id="stage"><div class="grid"></div><div class="wash"></div></div>
<script src="../engine/kit.js"></script><script src="story.js"></script><script src="common.js"></script>
<script>
const { K, ease, easeIn, inOut, lin, lerp, clamp, pose, apply, $, settle, icon } = SG;
const { IMG, PH, phrase, img, env } = MO; const END = 24.12;
const ST = document.getElementById('stage'), U = [];
const vis = (el, on) => { el.style.display = on ? '' : 'none'; return on; };
const KEYBK = L => MO.keyBlock(U, L);   // the red block travels with its word: nothing is left behind when the word leaves

// ---------- July → October: on the kit's charcoal (grid + red wash), a big outlined month word rolls to October ----------
const JUL = $('div', 'full', ST);
const MW = $('div', 'abs', JUL, 'left:0;right:0;top:300px;height:250px;overflow:hidden;clip-path:inset(0)');
const MONTHS = ['يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر'].map((m, i) => $('div', 'abs', MW, `left:0;right:0;top:0;text-align:center;font-size:200px;font-weight:700;line-height:250px;color:transparent;-webkit-text-stroke:3px ${i === 3 ? '#FF8A1F' : 'rgba(246,243,242,.55)'}`, m));
const MSTEP = [6.74, 7.04, 7.56];
U.push(t => { if (!vis(JUL, t < 8.0)) return;
  MW.style.opacity = clamp((t - 6.30) / .2) * (1 - easeIn(lin(t, 7.78, 7.92))); const idx = MSTEP.filter(a => t >= a).length;
  MONTHS.forEach((m, i) => { const a = i === 0 ? 6.30 : MSTEP[i - 1], on = i === idx, k = ease(lin(t, a, a + .26));
    m.style.opacity = on ? clamp((t - a) / .12) : 0; m.style.transform = `translateY(${(1 - k) * 60}px)`; }); });

// S1: she introduces herself: her photo, then her words, big and kinetic (white key words on grey)
const PHO = $('div', 'abs', ST, 'left:330px;top:300px;width:420px;height:420px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #0A0A0A,0 0 0 14px #C4321F'); img(PHO, IMG.mar, 'position:absolute;left:-428px;top:-32px;width:1011px;height:674px');   // Mariam's illustration, framed on her face
const NM = $('div', 'chip', ST, 'left:50%;top:740px;background:#C4321F;font-size:30px;font-weight:700', 'مريم');
U.push(t => { if (vis(PHO, t < 3.9)) apply(PHO, pose(t, { at: .0, dy: 20, s0: .9, follow: .015, out: 3.36 })); if (vis(NM, t < 3.9)) apply(NM, pose(t, { at: .25, dy: 12, out: 3.36 }), 'translateX(-50%)'); });
const Q = MO.phraseLine(ST, PH.quote, { y: 1080, size: 104, color: '#9a9ca1', wrap: true, lines: 4, center: true }); Q.ws.forEach(w => { if (w.f === 'k') w.i.style.color = '#F6F3F2'; }); KEYBK(Q);
U.push(t => { const v = t < 3.9; Q.row.style.display = v ? 'flex' : 'none'; if (v) MO.words(Q, t, 3.36); });
// S2: the real first message
const REAL = $('div', 'shot', ST, 'left:110px;width:860px;top:640px;height:483px'); img(REAL, IMG.quote, '', '');
U.push(t => { if (!vis(REAL, t > 3.4 && t < 6.8)) return; apply(REAL, pose(t, { at: 3.74, dy: 60, s0: .9, follow: .015, out: 6.34, exitDy: -60 })); });

// ---------- October: full-colour posters (each over its own blurred light) ----------
const PST = [IMG.p1, IMG.p2, IMG.p3, IMG.p4, IMG.p5, IMG.mar].map(s => { const f = $('div', 'full', ST); img(f, s, '', 'bg'); const g = $('div', 'fg', f); if (s === IMG.mar) g.style.cssText = 'left:110px;top:420px;width:860px;height:573px'; img(g, s, '', ''); $('div', 'shade', f); return { f, g }; });
const TAG = $('div', 'chip', ST, 'left:50%;top:1238px;z-index:5;transform:translateX(-50%)', 'مشروع تدريبي · Rasasi');
// which poster is on screen when: «ده» hard cut, then a flip-book on the VO words, the reward on p4
const CUTS = [[7.92, 0], [8.78, 1], [9.54, 2], [10.20, 3], [10.62, 4], [11.06, 0], [11.68, 1], [12.16, -1], [15.88, 5], [18.38, -1]];   // «دي قصة نجاح»: her own photo
U.push(t => { let cur = -1, at = 0; CUTS.forEach(([a, i]) => { if (t >= a) { cur = i; at = a; } });
  PST.forEach((P, i) => { if (!vis(P.f, i === cur)) return; const k = ease(lin(t, at, at + .4));
    P.g.style.transform = `scale(${lerp(1.045, 1, k)})`; P.f.style.opacity = at === 15.88 ? clamp((t - at) / .2) * (1 - easeIn(lin(t, 18.2, 18.38))) : 1; });
  vis(TAG, cur >= 0 && t < 12.16); });

// ---------- captions over the poster's shade (bottom), kinetic with a red block ----------
const CAP = (k, y, o = {}) => { const L = phrase(U, ST, k, Object.assign({ y, size: 74, color: K.text, center: true }, o)); KEYBK(L); L.row.style.zIndex = 10; return L; };
CAP('first', 1390, { size: 66 }); CAP('after', 860, { size: 120, wrap: true });
CAP('work', 1400, { size: 116 });
CAP('camp', 1355, { out: 12.04, size: 70 }); CAP('msg', 1440, { out: 12.04, size: 60 });
const MAG = CAP('magic', 860, { out: 13.2, size: 150 });
CAP('train', 1400, { out: 15.62, size: 60 });
const STORY = CAP('story', 1400, { size: 74 });
CAP('turn', 1355, { out: 20.94, size: 70 }); CAP('start', 1440, { out: 20.94, size: 70 }); CAP('cmt', 1400, { size: 56 });
(() => { const w = MAG.ws.find(x => x.f === 's'); const s = $('span', 'st', w.m);
  U.push(t => { const k = ease(lin(t, 12.80, 13.05)); s.style.transform = `scaleX(${k})`; w.i.style.color = k > .5 ? '#7d8087' : K.text; }); })();

// ---------- process slams: تمرين (one of her designs) / فيدباك (an instructor's real feedback) / متابعة يومية (the follow-up thread) ----------
const PR = $('div', 'full', ST);
const p1 = $('div', 'shot', PR, 'left:110px;top:470px;width:860px;height:577px'); img(p1, IMG.lip, '', '');
const p2 = $('div', 'shot', PR, 'left:110px;top:470px;width:860px;height:559px;background:#fff'); img(p2, IMG.fbY, 'object-fit:contain', '');
const p3 = $('div', 'shot', PR, 'left:190px;top:440px;width:700px;height:602px;background:#7fb0dc'); img(p3, IMG.fbF, '', '');
U.push(t => { if (!vis(PR, t > 13.2 && t < 15.95)) return; PR.style.opacity = 1 - easeIn(lin(t, 15.7, 15.88));
  const s = [13.34, 13.90, 14.68]; [p1, p2, p3].forEach((e, i) => { const on = t >= s[i] && t < (s[i + 1] ?? 16); vis(e, on); if (on) apply(e, pose(t, { at: s[i], dy: 0, s0: 1.08, dur: .3 })); });
 });

// ---------- reward: a gift lands on the poster's corner, a few confetti ----------
const GIFT = $('div', 'abs', ST, 'left:810px;top:880px;width:190px;height:190px;border-radius:50%;background:#C4321F;display:grid;place-items:center;z-index:6;box-shadow:0 0 0 14px rgba(196,50,31,.25)', icon('gift', 104, '#fff', 1.8));
const CF = [...Array(16)].map((_, i) => $('div', 'abs', ST, `left:0;top:0;width:14px;height:30px;border-radius:4px;z-index:6;background:${['#C4321F', '#FF8A1F', '#F6F3F2'][i % 3]}`));
U.push(t => { if (vis(GIFT, t > 17.6 && t < 18.5)) apply(GIFT, pose(t, { at: 17.78, dy: 0, s0: .4, dur: .5, follow: .03, out: 18.2 }));
  const s = t - 17.85; CF.forEach((c, i) => { if (!vis(c, s > 0 && s < 1.0)) return; const a = (-165 + i * 10) * Math.PI / 180, v = 700 + (i % 4) * 110;
    c.style.opacity = 1 - lin(s, .6, 1); c.style.transform = `translate(${905 + Math.cos(a) * v * s}px,${975 + Math.sin(a) * v * s + 1100 * s * s}px) rotate(${i * 40 + s * 500}deg)`; }); });

// ---------- CTA: a Facebook post (dark mode): the academy's Mastery post, a viewer comments, the academy replies ----------
MO.fbPost(ST, true, U);

// ---------- chrome on top of everything: corners, wordmark, label (hidden on the full-colour flip-book's top-left chip area) ----------
$('div', 'corner', ST, 'left:86px;top:192px;border-width:4px 0 0 4px'); $('div', 'corner', ST, 'right:86px;top:1528px;border-width:0 4px 4px 0');
const lgp = $('div', 'abs', ST, 'left:420px;top:206px;width:240px;height:60px;z-index:50;display:grid;place-items:center'); img(lgp, MO.LOGO, 'position:static;width:220px', '');
const lab = $('div', 'abs lat', ST, 'right:150px;top:1506px;font-size:32px;color:#C4321F;direction:ltr;z-index:50', 'SABER GROUP ACADEMY');
const web = $('div', 'abs', ST, 'left:86px;top:1506px;font-size:30px;font-weight:500;line-height:40px;color:#C7C9CD;direction:ltr;z-index:50', 'sabergroupacademy.com');
U.push(t => { const o = clamp((t - .2) / .4) * (1 - easeIn(lin(t, END - .3, END))); lab.style.opacity = web.style.opacity = o; lgp.style.opacity = o * (1 - env(t, 18.2, 23.9, .3, .3)); });

// ---------- END ----------
(() => { const g = $('div', 'full', ST); g.style.background = '#0A0A0A'; g.style.zIndex = 40;
  $('div', 'abs', g, 'inset:0;background:radial-gradient(ellipse 90% 70% at 50% 50%,transparent 58%,rgba(122,27,18,.3) 100%)');
  const box = $('div', 'abs', g, 'left:190px;top:660px;width:700px;height:101px;overflow:hidden'); const im = img(box, MO.LOGO, 'right:0;top:0;width:700px');
  const L1 = MO.phraseLine(g, PH.fam.w.slice(2), { y: 900, size: 84, color: K.text, center: true }); KEYBK(L1);
  const ht = $('div', 'abs', g, 'left:495px;top:1020px;width:90px;height:90px', `<svg viewBox="0 0 24 24" width="90" height="90"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.9 1.3 5.3 3.2 1.4-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#C4321F"/></svg>`);
  const u = $('div', 'abs', g, 'left:0;right:0;top:1180px;text-align:center;font-size:34px;font-weight:500;color:#C7C9CD;direction:ltr', 'sabergroupacademy.com');
  $('div', 'corner', g, 'left:86px;top:192px;border-width:4px 0 0 4px'); $('div', 'corner', g, 'right:86px;top:1528px;border-width:0 4px 4px 0');
  const ac = $('div', 'abs lat', g, 'right:150px;top:1506px;font-size:32px;color:#C4321F;direction:ltr', 'SABER GROUP ACADEMY');
  U.push(t => { if (!vis(g, t > END - .1)) return; const k = ease(lin(t, END, END + .8));
    box.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; box.style.transform = `scale(${lerp(.94, 1, k)})`; box.style.opacity = clamp((t - END) / .1);
    MO.words(L1, t); apply(ht, pose(t, { at: 26.7, dy: 0, s0: .5, follow: .04 })); apply(u, pose(t, { at: 25.2, dy: 12 })); }); })();

// the «Free access» reward scene runs on real time; everything else on the remapped timeline (frozen at T0 for D)
const U2 = MO.reward(ST, true, [STORY.row, PST[5].f, GIFT, ...CF]);
window.render = t => { const m = MO.map(t); U.forEach(f => f(m)); U2.forEach(f => f(t)); };
window.ready = MO.ready();
</script></body></html>
