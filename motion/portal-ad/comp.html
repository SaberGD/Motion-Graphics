<!doctype html>
<html><head><meta charset="utf-8">

     the REAL portal screens (assets/screens/*.png, the portal's own UI rendered with demo data) inside a phone,

     on one keyword, and the Academy end card. VO: Fatima (ElevenLabs library voice), words in WORDS below. -->
<style>

@font-face{font-family:Bebas;src:url(../../brand-kit/assets/fonts/BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo;background:#0A0A0A;color:#F6F3F2}
.grid{position:absolute;inset:0;background-size:72px 72px;background-image:linear-gradient(rgba(246,243,242,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(246,243,242,.03) 1px,transparent 1px)}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 45%,transparent 55%,rgba(122,27,18,.3) 100%)}
.abs{position:absolute}.lat{font-family:Bebas;font-weight:400}
.corner{position:absolute;width:46px;height:46px;border-color:#C4321F;border-style:solid}
.pl{position:absolute;left:86px;right:86px;display:flex;justify-content:center;direction:rtl;gap:0 .24em;font-weight:700;line-height:1.25;white-space:nowrap}
.wm{display:inline-block;position:relative;clip-path:inset(-.22em -.8em -.30em -.8em)}
.wi{display:inline-block;position:relative}
.phone{position:absolute;left:290px;top:300px;width:500px;height:1082px;border-radius:62px;background:#050505;box-shadow:0 0 0 3px #2a2a2a,0 0 0 12px #111,0 40px 120px rgba(0,0,0,.7),0 0 160px rgba(196,50,31,.18);overflow:hidden}
.notch{position:absolute;left:50%;top:12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#000;box-shadow:0 0 0 3px #111;z-index:5}
.scr{position:absolute;left:0;top:0;width:100%;transform-origin:50% 0}
.scr img{display:block;width:100%}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#141821,#0b0d12);color:#5C5F66;font-size:30px;font-weight:700;text-align:center;padding:40px;direction:rtl}
.chip{position:absolute;padding:12px 28px;border-radius:999px;background:#F6F3F2;color:#151515;font-size:36px;font-weight:700;white-space:nowrap;direction:rtl;box-shadow:0 16px 44px rgba(0,0,0,.45);display:flex;align-items:center;gap:12px}
.chip i{width:14px;height:14px;border-radius:50%;background:#C4321F;display:block}
.ring{position:absolute;border:5px solid #FF8A1F;border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.35),0 0 30px rgba(255,138,31,.6);pointer-events:none}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.18)}
.bubble{position:absolute;height:110px;border-radius:30px;background:#1C1C1C;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:22px;padding:0 30px;direction:rtl}
.bubble .av{width:64px;height:64px;border-radius:50%;background:#2a2a2a;flex:none}
.bubble .ln{height:18px;border-radius:9px;background:#3a3a3a}
.badge{position:absolute;min-width:70px;height:70px;padding:0 16px;border-radius:35px;background:#C4321F;color:#fff;font-family:Bebas;font-size:48px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(196,50,31,.5)}
</style></head>
<body><div id="stage"><div class="grid"></div><div class="wash"></div></div>

  [28.44, '06b_maro_thinking', 0, 0, 1.0, 1.0, 0],

    apply(L1, pose(t, { at: END + .4, dy: 20 })); apply(CI, pose(t, { at: 52.84, dy: 0, s0: .5, dur: .4, follow: .03 })); apply(L2, pose(t, { at: 53.0, dy: 18 })); apply(u, pose(t, { at: 53.6, dy: 12 })); }); })();

window.render = t => U.forEach(f => f(t));
window.ready = Promise.all([document.fonts.load('700 60px Cairo'), document.fonts.load('500 40px Cairo'), document.fonts.load('60px Bebas'),
  ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); }))]).then(() => document.fonts.ready).then(() => {
  // fit every caption line inside the safe width (908 px), never above its design size
  document.querySelectorAll('.pl').forEach(row => { const d = row.style.display; row.style.display = 'flex'; let fs = parseFloat(row.style.fontSize);
    while (row.scrollWidth > 908 && fs > 34) { fs -= 2; row.style.fontSize = fs + 'px'; } row.style.display = d; });
});
