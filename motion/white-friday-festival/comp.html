<!doctype html>
<html><head><meta charset="utf-8">
<!-- Saber Group White Friday Festival: SG MOTION announcement (1080x1920, 25fps). Two variants:
     ?v=text  kinetic typography only, centred inside the safe box
     ?v=mix   the same text + illustrative motion graphics that move with the words (12 principles)
     Text = the client's script only. Timing = VO word times (analysis/vo_words.json) + music beats (analysis/beats.json).
     Story: it opens dark ("Black Friday?"), then flips to white on the music build (6.853 s): WHITE Friday. -->
<style>
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Bebas;src:url(../../brand-kit/assets/fonts/BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo}
.layer{position:absolute;inset:0;overflow:hidden}
#dark{background:#0A0A0A}
#light{background:#F6F3F2}
.grid{position:absolute;inset:0;background-size:72px 72px}
#dark .grid{background-image:linear-gradient(rgba(246,243,242,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(246,243,242,.025) 1px,transparent 1px)}
#light .grid{background-image:linear-gradient(rgba(21,21,21,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(21,21,21,.045) 1px,transparent 1px)}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 50%,transparent 60%,rgba(122,27,18,.22) 100%)}
.line{position:absolute;left:86px;right:86px;display:flex;flex-direction:row;direction:rtl;gap:0 .26em;font-weight:700;line-height:1.22;white-space:nowrap}
.line.c{justify-content:center}
.wm{display:inline-block;clip-path:inset(-.22em -.8em -.30em -.8em)}   /* vertical mask only: Arabic tails (ع م ي) overhang sideways */
.wi{display:inline-block;will-change:transform}
.red{color:#C4321F}
.dim{color:#5C5F66}
.lat{font-family:Bebas;font-weight:400;letter-spacing:0}
.abs{position:absolute}
.card{position:absolute;background:#fff;border-radius:7px;clip-path:polygon(17px 0,100% 0,100% calc(100% - 17px),calc(100% - 17px) 100%,0 100%,0 17px)}
.sh{position:absolute;filter:drop-shadow(0 16px 26px rgba(21,21,21,.10)) drop-shadow(0 2px 4px rgba(21,21,21,.06))}
.chip{display:inline-flex;align-items:center;gap:14px;direction:rtl;padding:16px 30px 18px;font-weight:700;font-size:46px;color:#151515;background:#fff;border-radius:7px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.ic{display:grid;place-items:center;border-radius:7px}
.strike{position:absolute;height:6px;background:#C4321F;border-radius:3px;transform-origin:100% 50%}
.plate{position:absolute;background:#151515;display:grid;place-items:center;border-radius:7px}
.plate img{display:block}
.corner{position:absolute;width:46px;height:46px;border-color:#C4321F;border-style:solid}
.lbl{position:absolute;font-size:26px;font-weight:500}
.bar{position:absolute;height:18px;border-radius:9px;background:rgba(21,21,21,.08);overflow:hidden}
.bar i{position:absolute;inset:0;background:linear-gradient(270deg,#C4321F,#E85C3B);transform-origin:100% 50%}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#C4321F}
.skel{position:absolute;height:20px;border-radius:10px;background:rgba(21,21,21,.09)}
.row{position:absolute;left:86px;right:86px;display:flex;justify-content:center;gap:28px;direction:rtl}
.row > .sh{position:relative}
svg.ill{position:absolute;overflow:visible}
</style></head>
<body><div id="stage">
  <div id="dark" class="layer"><div class="grid"></div><div class="wash"></div></div>
  <div id="light" class="layer"><div class="grid"></div></div>
  <div id="chrome" class="layer"></div>
</div>
<script src="../engine/kit.js"></script>
<script>
const { K, ease, easeIn, inOut, clamp, lin, lerp, IN, OUT, pose, apply, $, line, lineUpdate, icon, settle } = SG;
const MIX = new URLSearchParams(location.search).get('v') === 'mix';
// ?land=1 → 1920x1080, recomposed (not cropped): text in the right column (RTL), illustrations in the left column,
// title / end card centred, bunting across the full width. Each layer keeps the portrait coordinates and gets its own transform.
const LAND = new URLSearchParams(location.search).get('land') === '1';
if (LAND) [document.documentElement, document.body, document.getElementById('stage')].forEach(e => { e.style.width = '1920px'; e.style.height = '1080px'; });
const DARKL = document.getElementById('dark'), LIGHTL = document.getElementById('light'), CHROME = document.getElementById('chrome');
// content sits in an inner layer, lowered so each scene is balanced around the frame's optical centre
const lay = (p, css) => $('div', 'layer', p, 'width:1080px;height:1920px;right:auto;bottom:auto;overflow:visible;transform-origin:0 0;' + css);
const at = (s, cx, cy, X, Y) => `transform:translate(${X - cx * s}px,${Y - cy * s}px) scale(${s})`;   // portrait point (cx,cy) → (X,Y)
const DARK = lay(DARKL, LAND ? at(.75, 540, 1130, 500, 560) : 'transform:translateY(70px)');     // dark: illustrations
const DT = lay(DARKL, LAND ? at(.78, 540, 770, 1430, 540) : 'transform:translateY(70px)');       // dark: text
const LIGHT = lay(LIGHTL, LAND ? at(.62, 540, 950, 500, 560) : 'transform:translateY(110px)');   // light: illustrations
const LT = lay(LIGHTL, LAND ? at(.78, 540, 850, 1430, 540) : 'transform:translateY(110px)');     // light: text
const LF = lay(LIGHTL, LAND ? at(.75, 540, 900, 960, 600) : 'transform:translateY(110px)');      // light: centred lockups
const LTOP = lay(LIGHTL, LAND ? at(1.2, 540, 300, 960, 165) : 'transform:translateY(110px)');     // light: bunting, between the corners and under the logo
const FLIP = 6.853, TITLE = 13.114, END = 67.903, DUR = 71.04;   // music: build bar, downbeat, downbeat after the lift
const LOGO = '../../brand-kit/assets/logos/saber-group-wordmark.png';   // locked asset: placed, never redrawn
const U = [];
const W = (t, at, c) => ({ t, at, c });
// centred text line (inside the safe box): words [[text, at, cls]]
function T(parent, y, size, words, out, o = {}) {
  const isDark = parent === DARK || parent === DT; parent = parent === LIGHT ? LT : parent === DARK ? DT : parent;
  const L = line(parent, words.map(w => W(w[0], w[1], (w[2] || '') + (/^[A-Z ]+$/.test(w[0]) ? ' lat' : ''))), `top:${y}px;font-size:${size}px;color:${o.color || (isDark ? K.text : K.ink)};${o.css || ''}`, 'c');
  U.push(t => lineUpdate(L, t, out)); return L;
}
function P(el, o, extra) { U.push(t => apply(el, pose(t, o), typeof extra === 'function' ? extra(t) : '')); return el; }
const row = (parent, y, gap = 28) => $('div', 'row', parent, `top:${y}px;gap:${gap}px`);
function chip(rowEl, html, o, css = '') { const w = $('div', 'sh', rowEl, 'transform-origin:50% 50%'); const c = $('div', 'chip', w, css, html); P(w, Object.assign({ dy: 22, s0: .94, squash: .025, follow: .012 }, o)); return { w, c }; }
function strike(chipObj, at) {
  const s = $('div', 'strike', chipObj.w, 'left:18px;right:18px;top:50%;margin-top:-3px');
  U.push(t => { const k = ease(lin(t, at, at + .34)); s.style.transform = `scaleX(${k})`; chipObj.c.style.opacity = lerp(1, .42, ease(lin(t, at + .1, at + .5))); });
}
function card(parent, x, y, w, h, o) { const sh = $('div', 'sh', parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`); const c = $('div', 'card', sh, 'inset:0'); P(sh, Object.assign({ dy: 30, s0: .96, arc: 0, squash: .02, follow: .01 }, o)); return { sh, c }; }
function iconBox(parent, name, size, at, css, color = '#C4321F', bg = 'rgba(196,50,31,.09)') {
  const b = $('div', 'ic abs', parent, `width:${size}px;height:${size}px;background:${bg};${css}`, icon(name, size * .56, color, 2));
  P(b, { at, dy: 10, s0: .7, follow: .03, dur: .4 }); return b;
}
const svg = (parent, x, y, w, h, inner, css = '') => $('div', 'abs', parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${css}`, `<svg class="ill" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`);
const vis = (t, a, b) => (t >= a && t <= b);
// gravity drop with squash on landing (principles 1 + 6): returns {y, sx, sy, o}
function drop(t, at, h, land = .42) {
  const q = lin(t, at, at + land), y = -h * (1 - q * q);                  // accelerating fall
  const k = lin(t, at + land, at + land + .26), sq = Math.sin(Math.PI * k) * .12 * (1 - k * .3);
  return { y: t < at ? -h : y, sx: 1 + sq, sy: 1 - sq, o: t < at ? 0 : clamp((t - at) / .08) };
}

// ================= S1 · dark hook =================
T(DARK, 470, 46, [['تفتكروا', .02]], 2.5, { color: K.text2 });
T(DARK, 540, 104, [['البلاك', .36], ['فرايدي', .58]], 2.5);
T(DARK, 690, 50, [['لازم', .90], ['يكون', 1.32], ['في', 1.54]], 2.5, { color: K.text2 });
T(DARK, 760, 66, [['آخر', 1.66], ['شهر', 1.84], ['نوفمبر؟', 2.08, 'red']], 2.5);
(() => { // November 2026 calendar (the 1st is a Sunday; Fridays 6/13/20/27 → Black Friday = 27th)
  const CW = MIX ? 500 : 430, CH = MIX ? 460 : 400, sc = CW / 430;
  const sh = $('div', 'sh', DARK, `left:${(1080 - CW) / 2}px;top:930px;width:${CW}px;height:${CH}px;filter:none`);
  const c = $('div', 'card', sh, 'inset:0;background:#151515;border:1px solid rgba(246,243,242,.08)');
  const inner = $('div', 'abs', c, `left:0;top:0;width:430px;height:400px;transform:scale(${sc});transform-origin:0 0`);
  $('div', 'abs', inner, 'top:26px;right:30px;font-size:30px;font-weight:700;color:#F6F3F2', 'نوفمبر');
  $('div', 'abs lat', inner, 'top:28px;left:30px;font-size:32px;color:#C7C9CD', '2026');
  ['ح', 'ن', 'ث', 'ر', 'خ', 'ج', 'س'].forEach((d, i) => $('div', 'abs', inner, `top:92px;right:${30 + i * 54}px;width:44px;text-align:center;font-size:22px;color:#5C5F66;font-weight:500`, d));
  const cells = [];
  for (let n = 1; n <= 30; n++) { const i = n - 1, col = i % 7, r = Math.floor(i / 7);
    cells.push($('div', 'abs lat', inner, `top:${130 + r * 50}px;right:${30 + col * 54}px;width:44px;height:44px;line-height:46px;text-align:center;font-size:30px;color:${col === 5 ? '#F6F3F2' : '#7d8087'};border-radius:50%`, n)); }
  const ring = $('div', 'abs', inner, `top:${130 + 3 * 50 - 4}px;right:${30 + 5 * 54 - 4}px;width:52px;height:52px;border:3px solid #C4321F;border-radius:50%`);
  P(sh, { at: 1.70, dy: 40, arc: 18, s0: .96, out: 4.95, follow: .01 });
  U.push(t => { const k = ease(lin(t, 2.08, 2.5)); ring.style.opacity = k * (1 - ease(lin(t, 4.28, 4.6))); ring.style.transform = `scale(${lerp(1.6, 1, k) * (1 + settle(lin(t, 2.3, 2.9), .05))})`; cells[26].style.color = k > .5 && t < 4.4 ? '#C4321F' : '#F6F3F2'; });
  if (!MIX) { // "بدري": an arrow sweeps back along the month (no date implied)
    const arr = $('div', 'abs', inner, 'top:340px;right:40px;color:#C4321F', icon('arrow', 44, '#C4321F', 2.4));
    U.push(t => { const k = inOut(lin(t, 4.28, 4.9)); arr.style.opacity = clamp((t - 4.28) / .1) * (1 - easeIn(lin(t, 4.95, 5.2))); arr.style.transform = `translateX(${-k * 300}px)`; });
  } else { // "بدري": a clock pops on the card's corner and its hands rewind (arcs + anticipation)
    const ck = svg(DARK, (1080 - CW) / 2 - 70, 870, 170, 170, `<circle cx="85" cy="85" r="74" fill="#0A0A0A" stroke="#C4321F" stroke-width="6"/>${[...Array(12)].map((_, i) => `<line x1="85" y1="20" x2="85" y2="${i % 3 ? 28 : 34}" stroke="#F6F3F2" stroke-width="${i % 3 ? 2 : 4}" transform="rotate(${i * 30} 85 85)"/>`).join('')}<g class="hh"><line x1="85" y1="85" x2="85" y2="48" stroke="#F6F3F2" stroke-width="7" stroke-linecap="round"/></g><g class="mh"><line x1="85" y1="85" x2="85" y2="30" stroke="#C4321F" stroke-width="5" stroke-linecap="round"/></g><circle cx="85" cy="85" r="7" fill="#F6F3F2"/>`);
    P(ck, { at: 4.10, dy: 0, s0: .3, squash: .05, follow: .04, out: 4.95, dur: .4 });
    const hh = ck.querySelector('.hh'), mh = ck.querySelector('.mh');
    U.push(t => { const a = easeIn(lin(t, 4.20, 4.30)) * 12, k = ease(lin(t, 4.30, 4.95)); // wind forward a hair, then spin back
      mh.setAttribute('transform', `rotate(${a - k * 540} 85 85)`); hh.setAttribute('transform', `rotate(${120 + a / 12 - k * 45} 85 85)`); });
  }
})();
T(DARK, 470, 50, [['إحنا', 2.56], ['في', 3.02]], 4.95, { color: K.text2 });
(() => { const box = $('div', 'abs', DT, 'left:260px;top:560px;width:560px;height:81px;overflow:hidden');
  const im = $('img', '', box, 'position:absolute;right:0;top:0;width:560px'); im.src = LOGO;
  U.push(t => { const k = ease(lin(t, 3.14, 3.14 + .8)); box.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; box.style.opacity = (t >= 3.14) * (1 - easeIn(lin(t, 4.95, 5.27))); box.style.transform = `translateY(${-12 * easeIn(lin(t, 4.95, 5.27))}px)`; }); })();
T(DARK, 690, 62, [['قررنا', 3.56], ['نبدأ', 3.98], ['بدري', 4.28, 'red'], ['السنة', 4.56], ['دي', 4.76]], 4.95);
T(DARK, 800, 56, [['بس', 5.00], ['المرة', 5.42], ['دي', 5.68]], 99, { color: K.text2 });
T(DARK, 880, 100, [['الموضوع', 5.94], ['مختلف', 6.32, 'red'], ['تمامًا', 6.78]], 99);
U.push(t => { const a = easeIn(lin(t, FLIP - .2, FLIP)); DARKL.style.transform = `scale(${1 - .02 * a})`;
  const k = ease(lin(t, FLIP, FLIP + .5)); LIGHTL.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`; LIGHTL.style.visibility = t >= FLIP ? 'visible' : 'hidden';
  DARKL.style.visibility = t < FLIP + .5 ? 'visible' : 'hidden'; });
(() => { // light frame chrome (kit portrait frame)
  const cs = LAND ? [$('div', 'corner', CHROME, 'left:115px;top:86px;border-width:4px 0 0 4px'), $('div', 'corner', CHROME, 'right:115px;top:948px;border-width:0 4px 4px 0')]
    : [$('div', 'corner', CHROME, 'left:86px;top:192px;border-width:4px 0 0 4px'), $('div', 'corner', CHROME, 'right:86px;top:1528px;border-width:0 4px 4px 0')];
  const plate = $('div', 'plate', CHROME, LAND ? 'right:115px;top:86px;width:280px;height:70px' : 'left:390px;top:200px;width:300px;height:76px'); const im = $('img', '', plate, 'width:256px'); im.src = LOGO;
  const url = $('div', 'lbl', CHROME, (LAND ? 'left:115px;top:960px;' : 'left:86px;top:1512px;') + 'color:#5C5F66;direction:ltr', 'sabergroupacademy.com');
  const ac = $('div', 'lbl lat', CHROME, (LAND ? 'right:180px;top:955px;' : 'right:150px;top:1506px;') + 'font-size:32px;color:#C4321F', 'SABER GROUP ACADEMY');
  U.push(t => { [plate, url, ac, ...cs].forEach((e, i) => apply(e, pose(t, { at: FLIP + .35 + i * .08, dy: 10, out: END - .25 }))); });
})();

// ================= S2 · not one contest, not just offers =================
T(LIGHT, 520, 48, [['السنة', 7.44], ['دي', 7.92]], 10.6, { color: K.ink2 });
T(LIGHT, 590, 76, [['مش', 8.08], ['عاملين', 8.20]], 10.6);
if (!MIX) {
  const r1 = row(LIGHT, 760); const c1 = chip(r1, 'مسابقة واحدة', { at: 8.40, out: 10.6 }); strike(c1, 8.809);
  T(LIGHT, 930, 58, [['ولا', 9.02], ['مجرد', 9.30]], 10.6, { color: K.ink2 });
  const r2 = row(LIGHT, 1060); const c2 = chip(r2, 'عروض', { at: 9.78, out: 10.6 }); const c3 = chip(r2, 'وخصومات', { at: 10.00, out: 10.6 }); strike(c2, 10.374); strike(c3, 10.42);
} else {
  // one trophy, crossed out on the drop
  const tr = $('div', 'abs', LIGHT, 'left:420px;top:700px', icon('trophy', 240, '#151515', 1.6));
  P(tr, { at: 8.40, dy: 30, s0: .8, squash: .035, follow: .02, out: 10.6 });
  $('div', 'abs', LIGHT, 'left:0;right:0;top:930px;text-align:center;font-size:42px;font-weight:700;color:#151515', '<span class="one">مسابقة واحدة</span>');
  const one = LIGHT.querySelector('.one'); U.push(t => { one.style.opacity = clamp((t - 8.5) / .2) * (1 - easeIn(lin(t, 10.6, 10.9))) * lerp(1, .45, ease(lin(t, 8.9, 9.3))); });
  const X = svg(LIGHT, 400, 690, 280, 280, '<path class="x1" d="M30 30 L250 250" stroke="#C4321F" stroke-width="14" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1" /><path class="x2" d="M250 30 L30 250" stroke="#C4321F" stroke-width="14" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1"/>');
  U.push(t => { X.querySelector('.x1').style.strokeDashoffset = 1 - ease(lin(t, 8.809, 9.1)); X.querySelector('.x2').style.strokeDashoffset = 1 - ease(lin(t, 9.0, 9.3)); X.style.opacity = 1 - easeIn(lin(t, 10.6, 10.9)); tr.style.filter = `grayscale(1) opacity(${lerp(1, .35, ease(lin(t, 8.9, 9.3)))})`; });
  T(LIGHT, 1045, 52, [['ولا', 9.02], ['مجرد', 9.30]], 10.6, { color: K.ink2 });
  // two price tags hanging from a rail, swinging (follow-through), then struck and dropped
  const rail = $('div', 'abs', LIGHT, 'left:240px;right:240px;top:1130px;height:6px;border-radius:3px;background:#151515'); P(rail, { at: 9.6, dy: 0, out: 10.6 });
  [['عروض', 9.78, 380], ['خصومات', 10.00, 600]].forEach(([tx, at, x], i) => {
    const tg = svg(LIGHT, x, 1130, 220, 230, `<line x1="110" y1="0" x2="110" y2="56" stroke="#151515" stroke-width="3"/><path d="M60 56 H160 L190 96 V212 H30 V96 Z" fill="#fff" stroke="#151515" stroke-width="3" stroke-linejoin="round"/><circle cx="110" cy="84" r="9" fill="none" stroke="#151515" stroke-width="3"/><text x="110" y="170" text-anchor="middle" font-family="Cairo" font-weight="700" font-size="40" fill="#151515">${tx}</text><text x="110" y="126" text-anchor="middle" font-family="Bebas" font-size="34" fill="#C4321F">%</text><path class="st" d="M40 150 H180" stroke="#C4321F" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>`, 'transform-origin:110px 0');
    U.push(t => { const ap = clamp((t - at) / .1); const s = t - at, sw = s > 0 ? 18 * Math.exp(-s * 2.6) * Math.sin(s * 9 + i) : 0;   // damped pendulum
      const fall = easeIn(lin(t, 10.55 + i * .05, 10.95 + i * .05));
      tg.style.opacity = ap * (1 - fall); tg.style.transform = `translateY(${fall * 300}px) rotate(${sw + fall * (i ? 20 : -20)}deg) scaleY(${lerp(.6, 1, ease(lin(t, at, at + .3)))})`;
      tg.querySelector('.st').style.strokeDashoffset = 1 - ease(lin(t, 10.374 + i * .05, 10.6 + i * .05)); });
  });
}

// ================= S3 · a whole festival → title on the downbeat =================
const S3P = LAND && MIX ? LF : LIGHT;   // landscape mix: no side illustration here, so the lines sit centred under the bunting
T(S3P, 600, 58, [['السنة', 10.68], ['دي', 11.18], ['عاملين', 11.44]], 12.95, { color: K.ink2 });
T(S3P, 680, 112, [['مهرجان', 11.92], ['كامل', 12.50, 'red']], 12.95);
if (!MIX) {
  for (let i = 0; i < 3; i++) { const r = $('div', 'abs', LT, `left:${190 - i * 40}px;top:${660 - i * 26}px;width:6px;height:${44 - i * 6}px;background:#C4321F;border-radius:3px;transform-origin:50% 100%`);
    U.push(t => { const k = ease(lin(t, 12.50 + i * .05, 12.86 + i * .05)); r.style.opacity = k * (1 - easeIn(lin(t, 12.95, 13.2))); r.style.transform = `rotate(${-28 + i * 28}deg) scaleY(${k})`; }); }
} else {
  // festival bunting drops in from the top and swings (follow-through), stays under the title
  const N = 9, path = 'M20 20 Q 520 150 1020 20';
  const flags = [...Array(N)].map((_, i) => { const u = (i + .5) / N, x = 20 + 1000 * u, y = 20 + 2 * 130 * u * (1 - u); return `<g class="fl" data-i="${i}" transform="translate(${x} ${y})"><path d="M-34 0 L34 0 L0 70 Z" fill="${['#C4321F', '#151515', '#E85C3B'][i % 3]}"/></g>`; }).join('');
  const b = svg(LTOP, 20, 300, 1040, 240, `<path d="${path}" stroke="#151515" stroke-width="3" fill="none"/>${flags}`);
