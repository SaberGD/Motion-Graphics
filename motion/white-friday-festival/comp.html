<!doctype html>
<html><head><meta charset="utf-8">
<!-- Saber Group White Friday Festival: SG MOTION announcement (1080x1920, 25fps).
     Text = the client's script only. Timing = VO word times (analysis/vo_words.json) + music beats (analysis/beats.json).
     Story: it opens dark ("Black Friday?"), then flips to white on the music build (6.853 s): WHITE Friday. -->
<style>
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Bebas;src:url(../../brand-kit/assets/fonts/BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo}
.layer{position:absolute;inset:0;overflow:hidden}
#dark{background:#0A0A0A}
#light{background:#F6F3F2}
.grid{position:absolute;inset:0;background-size:72px 72px}
#dark .grid{background-image:linear-gradient(rgba(246,243,242,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(246,243,242,.025) 1px,transparent 1px)}
#light .grid{background-image:linear-gradient(rgba(21,21,21,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(21,21,21,.045) 1px,transparent 1px)}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 50%,transparent 60%,rgba(122,27,18,.22) 100%)}
.line{position:absolute;left:86px;right:86px;display:flex;flex-direction:row;direction:rtl;gap:0 .26em;font-weight:700;line-height:1.22;white-space:nowrap}
.line.c{justify-content:center}
.wm{display:inline-block;clip-path:inset(-.22em -.8em -.30em -.8em)}   /* vertical mask only: Arabic tails (ع م ي) overhang sideways */   /* wide mask: Arabic tails (ع ق ي) overhang the advance width */
.wi{display:inline-block;will-change:transform}
.red{color:#C4321F}
.dim{color:#5C5F66}
.lat{font-family:Bebas;font-weight:400;letter-spacing:0}
.abs{position:absolute}
.card{position:absolute;background:#fff;border-radius:7px;clip-path:polygon(17px 0,100% 0,100% calc(100% - 17px),calc(100% - 17px) 100%,0 100%,0 17px)}
.sh{position:absolute;filter:drop-shadow(0 16px 26px rgba(21,21,21,.10)) drop-shadow(0 2px 4px rgba(21,21,21,.06))}
.chip{display:inline-flex;align-items:center;gap:14px;direction:rtl;padding:16px 30px 18px;font-weight:700;font-size:46px;color:#151515;background:#fff;border-radius:7px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.ic{display:grid;place-items:center;border-radius:7px}
.strike{position:absolute;height:6px;background:#C4321F;border-radius:3px;transform-origin:100% 50%}
.plate{position:absolute;background:#151515;display:grid;place-items:center;border-radius:7px}
.plate img{display:block}
.corner{position:absolute;width:46px;height:46px;border-color:#C4321F;border-style:solid}
.lbl{position:absolute;font-size:26px;font-weight:500}
.bar{position:absolute;height:18px;border-radius:9px;background:rgba(21,21,21,.08);overflow:hidden}
.bar i{position:absolute;inset:0;background:linear-gradient(270deg,#C4321F,#E85C3B);transform-origin:100% 50%}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#C4321F}
.skel{position:absolute;height:20px;border-radius:10px;background:rgba(21,21,21,.09)}
</style></head>
<body><div id="stage">
  <div id="dark" class="layer"><div class="grid"></div><div class="wash"></div></div>
  <div id="light" class="layer"><div class="grid"></div></div>
  <div id="chrome" class="layer"></div>
</div>
<script src="../engine/kit.js"></script>
<script>
const { K, ease, easeIn, inOut, clamp, lin, lerp, IN, OUT, pose, apply, $, line, lineUpdate, icon, settle } = SG;
const DARKL = document.getElementById('dark'), LIGHTL = document.getElementById('light'), CHROME = document.getElementById('chrome');
// content sits in an inner layer, lowered so each scene is balanced around the frame's optical centre
const DARK = $('div', 'layer', DARKL, 'transform:translateY(70px);overflow:visible'), LIGHT = $('div', 'layer', LIGHTL, 'transform:translateY(110px);overflow:visible');
const FLIP = 6.853, TITLE = 13.114, END = 67.903, DUR = 71.04;   // music: build bar, downbeat, downbeat after the lift
const LOGO = '../../brand-kit/assets/logos/saber-group-wordmark.png';   // locked asset: placed, never redrawn
const U = [];                       // per-frame updaters
const W = (t, at, c) => ({ t, at, c });
// a text line: words [[text, at, cls]], right-aligned unless center
function T(parent, y, size, words, out, o = {}) {
  const L = line(parent, words.map(w => W(w[0], w[1], (w[2] || '') + (/^[A-Z ]+$/.test(w[0]) ? ' lat' : ''))), `top:${y}px;font-size:${size}px;color:${o.color || (parent === DARK ? K.text : K.ink)};${o.css || ''}`, o.center ? 'c' : '');
  U.push(t => lineUpdate(L, t, out)); return L;
}
// a generic element animated by pose()
function P(el, o, extra) { U.push(t => apply(el, pose(t, o), typeof extra === 'function' ? extra(t) : '')); return el; }
function chip(parent, html, x, y, o, css = '') {
  const w = $('div', 'sh', parent, `right:${x}px;top:${y}px;transform-origin:100% 50%`); const c = $('div', 'chip', w, css, html);
  P(w, Object.assign({ dy: 22, s0: .94, squash: .025, follow: .012 }, o)); return { w, c };
}
function strike(chipObj, at, parent) {   // red line drawn across a chip on the beat
  const s = $('div', 'strike', chipObj.w, 'left:18px;right:18px;top:50%;margin-top:-3px');
  U.push(t => { const k = ease(lin(t, at, at + .34)); s.style.transform = `scaleX(${k})`; chipObj.c.style.opacity = lerp(1, .42, ease(lin(t, at + .1, at + .5))); });
}
function card(parent, x, y, w, h, o) { const sh = $('div', 'sh', parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`); const c = $('div', 'card', sh, 'inset:0'); P(sh, Object.assign({ dy: 30, s0: .96, arc: 0, squash: .02, follow: .01 }, o)); return { sh, c }; }
function iconBox(parent, name, size, at, css, color = '#C4321F', bg = 'rgba(196,50,31,.09)') {
  const b = $('div', 'ic abs', parent, `width:${size}px;height:${size}px;background:${bg};${css}`, icon(name, size * .56, color, 2));
  P(b, { at, dy: 10, s0: .7, follow: .03, dur: .4 }); return b;   // overlapping action: lands after its card
}

// ================= S1 · dark hook: "تفتكروا البلاك فرايدي …؟" =================
T(DARK, 470, 46, [['تفتكروا', .02]], 2.5, { color: K.text2 });
T(DARK, 540, 104, [['البلاك', .36], ['فرايدي', .58]], 2.5);
T(DARK, 690, 50, [['لازم', .90], ['يكون', 1.32], ['في', 1.54]], 2.5, { color: K.text2 });
T(DARK, 760, 66, [['آخر', 1.66], ['شهر', 1.84], ['نوفمبر؟', 2.08, 'red']], 2.5);

(() => {

  for (let n = 1; n <= 30; n++) { const i = n - 1, col = i % 7, row = Math.floor(i / 7);
    cells.push($('div', 'abs lat', c, `top:${130 + row * 50}px;right:${30 + col * 54}px;width:44px;height:44px;line-height:46px;text-align:center;font-size:30px;color:${col === 5 ? '#F6F3F2' : '#7d8087'};border-radius:50%`, n)); }
  const ring = $('div', 'abs', c, `top:${130 + 3 * 50 - 4}px;right:${30 + 5 * 54 - 4}px;width:52px;height:52px;border:3px solid #C4321F;border-radius:50%`);
  P(sh, { at: 1.70, dy: 40, dx: -30, arc: 18, s0: .96, out: 4.95, follow: .01 });
  U.push(t => { const k = ease(lin(t, 2.08, 2.5)); ring.style.opacity = k * (1 - ease(lin(t, 4.28, 4.6))); ring.style.transform = `scale(${lerp(1.6, 1, k) * (1 + settle(lin(t, 2.3, 2.9), .05))})`; cells[26].style.color = k > .5 && t < 4.4 ? '#C4321F' : '#F6F3F2'; });
  // "بدري": an arrow sweeps back along the month (no date implied)
  const arr = $('div', 'abs', c, 'top:340px;right:40px;color:#C4321F', icon('arrow', 44, '#C4321F', 2.4));
  U.push(t => { const k = inOut(lin(t, 4.28, 4.9)); arr.style.opacity = clamp((t - 4.28) / .1) * (1 - easeIn(lin(t, 4.95, 5.2))); arr.style.transform = `translateX(${-k * 300}px)`; });
})();
T(DARK, 470, 50, [['إحنا', 2.56], ['في', 3.02]], 4.95, { color: K.text2 });
(() => { const box = $('div', 'abs', DARK, 'right:86px;top:560px;width:560px;height:81px;overflow:hidden');
  const im = $('img', '', box, 'position:absolute;right:0;top:0;width:560px'); im.src = LOGO;
  U.push(t => { const k = ease(lin(t, 3.14, 3.14 + .8)); box.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; box.style.opacity = (t >= 3.14) * (1 - easeIn(lin(t, 4.95, 5.27))); box.style.transform = `translateY(${-12 * easeIn(lin(t, 4.95, 5.27))}px)`; }); })();
T(DARK, 690, 62, [['قررنا', 3.56], ['نبدأ', 3.98], ['بدري', 4.28, 'red'], ['السنة', 4.56], ['دي', 4.76]], 4.95);
T(DARK, 800, 56, [['بس', 5.00], ['المرة', 5.42], ['دي', 5.68]], 99, { color: K.text2 });
T(DARK, 880, 100, [['الموضوع', 5.94], ['مختلف', 6.32, 'red'], ['تمامًا', 6.78]], 99);
// anticipation of the flip: the dark scene leans back a touch, then the white world rises over it
U.push(t => { const a = easeIn(lin(t, FLIP - .2, FLIP)); DARKL.style.transform = `scale(${1 - .02 * a})`;
  const k = ease(lin(t, FLIP, FLIP + .5)); LIGHTL.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`; LIGHTL.style.visibility = t >= FLIP ? 'visible' : 'hidden';
  DARKL.style.visibility = t < FLIP + .5 ? 'visible' : 'hidden'; });
// light frame chrome (kit portrait frame): corners, charcoal logo plate, url + academy label
(() => {
  const cs = [$('div', 'corner', CHROME, 'left:86px;top:192px;border-width:4px 0 0 4px'), $('div', 'corner', CHROME, 'right:86px;top:1528px;border-width:0 4px 4px 0')];
  const plate = $('div', 'plate', CHROME, 'right:86px;top:200px;width:300px;height:76px'); const im = $('img', '', plate, 'width:256px'); im.src = LOGO;
  const url = $('div', 'lbl', CHROME, 'left:86px;top:1512px;color:#5C5F66;direction:ltr', 'sabergroupacademy.com');
  const ac = $('div', 'lbl lat', CHROME, 'right:150px;top:1506px;font-size:32px;color:#C4321F', 'SABER GROUP ACADEMY');
  U.push(t => { const on = t > FLIP + .35 && t < END - .2;
    [plate, url, ac, ...cs].forEach((e, i) => { const p = pose(t, { at: FLIP + .35 + i * .08, dy: 10, out: END - .25 }); apply(e, p); }); });
})();

// ================= S2 · not one contest, not just offers =================
T(LIGHT, 520, 48, [['السنة', 7.44], ['دي', 7.92]], 10.6, { color: K.ink2 });
T(LIGHT, 590, 76, [['مش', 8.08], ['عاملين', 8.20]], 10.6);
const c1 = chip(LIGHT, 'مسابقة واحدة', 86, 760, { at: 8.40, out: 10.6 }); strike(c1, 8.809, LIGHT);
T(LIGHT, 930, 58, [['ولا', 9.02], ['مجرد', 9.30]], 10.6, { color: K.ink2 });
const c2 = chip(LIGHT, 'عروض', 86, 1060, { at: 9.78, out: 10.6 }); const c3 = chip(LIGHT, 'وخصومات', 330, 1060, { at: 10.00, out: 10.6 });
strike(c2, 10.374, LIGHT); strike(c3, 10.42, LIGHT);

// ================= S3 · a whole festival → the title on the downbeat =================
T(LIGHT, 600, 58, [['السنة', 10.68], ['دي', 11.18], ['عاملين', 11.44]], 12.95, { color: K.ink2 });
T(LIGHT, 680, 112, [['مهرجان', 11.92], ['كامل', 12.50, 'red']], 12.95);
(() => { // secondary action: three short rays behind the word
  for (let i = 0; i < 3; i++) { const r = $('div', 'abs', LIGHT, `left:${250 - i * 40}px;top:${700 - i * 26}px;width:6px;height:${44 - i * 6}px;background:#C4321F;border-radius:3px;transform-origin:50% 100%;transform:rotate(${-28 + i * 28}deg)`);
    U.push(t => { const k = ease(lin(t, 12.50 + i * .05, 12.86 + i * .05)); r.style.opacity = k * (1 - easeIn(lin(t, 12.95, 13.2))); r.style.transform = `rotate(${-28 + i * 28}deg) scaleY(${k})`; }); }
})();
(() => { // TITLE lockup (centered): charcoal plate + wordmark, WHITE FRIDAY / FESTIVAL
  const plate = $('div', 'plate', LIGHT, 'left:220px;top:640px;width:640px;height:150px'); const im = $('img', '', plate, 'width:560px'); im.src = LOGO;
  U.push(t => { const k = ease(lin(t, TITLE, TITLE + .8)); const p = pose(t, { at: TITLE, dy: 0, s0: .9, antic: true, follow: .012, out: 15.25, dur: .8 });
    apply(plate, p); plate.style.clipPath = `inset(0 0 0 ${(1 - k) * 100}%)`; });
  T(LIGHT, 830, 150, [['WHITE', 14.00], ['FRIDAY', 14.36]], 15.25, { center: true, css: 'direction:ltr' });
  const fest = T(LIGHT, 990, 150, [['FESTIVAL', 14.78, 'red']], 15.25, { center: true, css: 'direction:ltr' });
  const heart = $('div', 'abs', LIGHT, 'left:500px;top:1190px', '<svg width="80" height="72" viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12.2A5 5 0 0 1 12 6a5 5 0 0 1 9 2.8C21 15.4 12 21 12 21z" fill="#C4321F"/></svg>');
  P(heart, { at: 14.95, dy: 16, s0: .4, squash: .04, follow: .04, out: 15.25 });
})();

// ================= S4 · days full of surprises + what you can win =================
T(LIGHT, 400, 44, [['خلال', 15.34], ['الفترة', 15.96], ['الجاية', 16.26]], 20.7, { color: K.ink2 });
T(LIGHT, 462, 66, [['مستنيينكم', 16.56], ['معانا', 17.14]], 20.7);
T(LIGHT, 560, 66, [['في', 17.42], ['أيام', 17.56], ['مليانة', 17.90], ['مفاجآت', 18.34, 'red']], 20.7);
(() => { const a = card(LIGHT, 574, 720, 420, 300, { at: 18.84, arc: 24, out: 20.7 }); iconBox(a.c, 'trophy', 96, 19.0, 'top:44px;right:40px');
  $('div', 'abs', a.c, 'top:170px;right:40px;font-size:52px;font-weight:700;color:#151515', 'مسابقات');
  const b = card(LIGHT, 86, 720, 420, 300, { at: 19.68, arc: -24, out: 20.7 }); iconBox(b.c, 'target', 96, 19.84, 'top:44px;right:40px');
  $('div', 'abs', b.c, 'top:170px;right:40px;font-size:52px;font-weight:700;color:#151515', 'وتحديات');
  T(LIGHT, 1060, 50, [['مختلفة', 20.22, 'red']], 20.7, { center: true }); })();
T(LIGHT, 400, 66, [['وكمان', 20.78], ['فرص', 21.22, 'red'], ['كتير', 21.48]], 25.62);
T(LIGHT, 492, 46, [['تكسبوا', 21.84], ['من', 22.24], ['خلالها', 22.30]], 25.62, { color: K.ink2 });
[['book', 'كورسات مجانية', 22.64], ['pen', 'ورش تدريبية', 23.54], ['gift', 'هدايا مميزة', 24.54]].forEach(([ic, tx, at], i) => {
  const c = card(LIGHT, 86, 640 + i * 190, 908, 160, { at, dx: 40, arc: 0, dy: 16, out: 25.62 + i * .04 });
  iconBox(c.c, ic, 104, at + .1, 'top:28px;right:32px');
  $('div', 'abs', c.c, 'top:42px;right:170px;font-size:54px;font-weight:700;color:#151515', tx);
  const tick = $('div', 'abs', c.c, 'top:52px;left:40px', icon('check', 56, '#C4321F', 2.6)); P(tick, { at: at + .26, dy: 0, s0: .5, follow: .04, dur: .36 });
});

// ================= S5 · beginners and experienced =================
T(LIGHT, 400, 46, [['يعني', 25.72], ['سواء', 26.12]], 32.28, { color: K.ink2 });
function level(parent, x, y, w, fill, at) { const b = $('div', 'bar', parent, `left:${x}px;top:${y}px;width:${w}px`); const i = $('i', '', b); U.push(t => { i.style.transform = `scaleX(${fill * ease(lin(t, at, at + .7))})`; }); }
(() => { const a = card(LIGHT, 554, 520, 440, 460, { at: 26.34, arc: 20, out: 32.28 });
  iconBox(a.c, 'user', 92, 26.5, 'top:40px;right:40px');
  $('div', 'abs', a.c, 'top:156px;right:40px;font-size:48px;font-weight:700;color:#151515', 'لسه بتبدأ');
  $('div', 'abs', a.c, 'top:226px;right:40px;font-size:34px;font-weight:500;color:#5C5F66', 'في الجرافيك ديزاين');
  level(a.c, 40, 320, 360, .22, 26.74);
  const b = card(LIGHT, 86, 520, 440, 460, { at: 28.16, arc: -20, out: 32.28 });
  iconBox(b.c, 'star', 92, 28.3, 'top:40px;right:40px');
  $('div', 'abs', b.c, 'top:156px;right:40px;font-size:48px;font-weight:700;color:#151515', 'عندك خبرة');
  $('div', 'abs', b.c, 'top:226px;right:40px;font-size:34px;font-weight:500;color:#5C5F66', 'وعايز تطور من نفسك');
  level(b.c, 40, 320, 360, .78, 29.0);
  [a, b].forEach((c, i) => { const k = $('div', 'abs', c.c, 'bottom:36px;right:40px;display:flex;gap:10px;align-items:center;font-size:32px;font-weight:700;color:#C4321F', icon('check', 40, '#C4321F', 2.6) + '<span>تقدر تشارك</span>');
    P(k, { at: 31.74 + i * .08, dy: 12, s0: .8, follow: .02 }); }); })();
T(LIGHT, 1060, 60, [['هيكون', 29.86], ['فيه', 30.24], ['فرص', 30.42, 'red'], ['وحاجات', 30.72], ['كتير', 31.04]], 32.28);
T(LIGHT, 1150, 60, [['تقدر', 31.44], ['تشارك', 31.74], ['فيها', 32.08]], 32.28, { color: K.ink2 });

// ================= S6 · more participation, better odds =================
T(LIGHT, 400, 54, [['والأحلى', 32.36, 'red']], 38.9);
T(LIGHT, 480, 64, [['إن', 32.98], ['مشاركتك', 33.30], ['مش', 33.88], ['مرتبطة', 34.00]], 38.9);
T(LIGHT, 570, 64, [['بمسابقة', 34.44], ['واحدة', 34.78], ['بس!', 35.10]], 38.9);
(() => { const c = card(LIGHT, 86, 730, 908, 470, { at: 35.32, out: 38.9 });
  $('div', 'abs', c.c, 'top:36px;right:44px;font-size:40px;font-weight:700;color:#151515', 'كل ما تشارك');
  const toks = [['فعاليات', 36.30], ['مسابقات', 36.70], ['أكتر', 37.18]];
  toks.forEach(([tx, at], i) => { const k = $('div', 'abs', c.c, `top:110px;right:${44 + i * 250}px;padding:10px 26px 12px;border-radius:7px;background:rgba(196,50,31,.09);color:#C4321F;font-size:38px;font-weight:700;display:flex;gap:8px;align-items:center`, icon('plus', 30, '#C4321F', 2.6) + `<span>${tx}</span>`);
    P(k, { at, dy: 18, s0: .8, squash: .03, follow: .02, dur: .4 }); });
  $('div', 'abs', c.c, 'top:250px;right:44px;font-size:40px;font-weight:700;color:#151515', 'فرصتك في الفوز');
  const b = $('div', 'bar', c.c, 'left:44px;right:44px;top:330px;height:34px;border-radius:17px'); const i = $('i', '', b);
  const steps = [[35.86, .18], [36.30, .36], [36.70, .55], [37.18, .70], [38.547, .94]];
  U.push(t => { let f = 0; steps.forEach(([at, v], j) => { const prev = j ? steps[j - 1][1] : 0; if (t >= at) f = lerp(prev, v, ease(lin(t, at, at + .45))) * (1 + settle(lin(t, at + .3, at + .9), .015)); }); i.style.transform = `scaleX(${f})`; });
  const up = $('div', 'abs', c.c, 'top:250px;left:44px;font-size:40px;font-weight:700;color:#C4321F', 'بتزيد');
  P(up, { at: 38.54, dy: 14, s0: .9, follow: .02, dur: .36 }); })();
T(LIGHT, 1270, 46, [['كل', 35.32], ['ما', 35.68], ['تشارك', 35.86], ['أكتر،', 37.18], ['فرصتك', 37.52], ['بتزيد', 38.54, 'red']], 38.9, { color: K.ink2 });

// ================= S7 · points system → the grand prize =================
T(LIGHT, 400, 46, [['وفيه', 39.00], ['كمان', 39.48]], 44.7, { color: K.ink2 });
