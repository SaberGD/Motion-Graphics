<!doctype html>
<html><head><meta charset="utf-8">
<!-- Light theme (as Mariam option A): off-white page + grid, wordmark on its charcoal plate, browsers in light mode.
     Saber Group Academy · «install the Student Portal as an app» (PWA) explainer, SG MOTION 9:16, 25 fps.
     Four variants (?v=ios_ar | ios_en | android_ar | android_en): the steps on iPhone (Safari) or Android (Chrome), with the
     phone in Arabic (RTL, Arabic labels, mirrored bars) or English. The portal page is the REAL login page captured from
     portal.sabergroupacademy.com; the app icon is the portal's own icon-512; the opened app is the portal's real UI (demo data).
     The browser / system UI around it is a simplified drawing with the exact labels. VO: Fatima, timings in timing.js. -->
<style>
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(../../brand-kit/assets/fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Bebas;src:url(../../brand-kit/assets/fonts/BebasNeue-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F6F3F2}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo;background:#F6F3F2;color:#151515}
.grid{position:absolute;inset:0;background-size:72px 72px;background-image:linear-gradient(rgba(21,21,21,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(21,21,21,.035) 1px,transparent 1px)}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 50% 45%,transparent 60%,rgba(196,50,31,.06) 100%)}
.abs{position:absolute}

.pl{position:absolute;left:86px;right:86px;display:flex;justify-content:center;direction:rtl;gap:0 .24em;font-weight:700;line-height:1.25;white-space:nowrap;z-index:30}
.wm{display:inline-block;position:relative;clip-path:inset(-.22em -.8em -.30em -.8em)}
.wi{display:inline-block;position:relative}

.scr{position:absolute;inset:0;overflow:hidden}
.sb{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-family:-apple-system,Cairo;font-size:17px;font-weight:700;color:#fff;z-index:9}

.row{display:flex;align-items:center;justify-content:space-between;height:66px;padding:0 22px;font-size:20px;border-bottom:1px solid rgba(0,0,0,.08)}
.hl{box-shadow:inset 0 0 0 4px #FF8A1F;background:rgba(255,138,31,.16)!important;border-radius:14px}

.chip{position:absolute;padding:12px 26px;border-radius:999px;background:#151515;color:#F6F3F2;font-size:34px;font-weight:700;white-space:nowrap;box-shadow:0 16px 44px rgba(21,21,21,.25);display:flex;align-items:center;gap:12px;z-index:35}
.ico{border-radius:22%;overflow:hidden;background:#151515}
.ico img{width:100%;height:100%;display:block}
.sk{border-radius:22%;background:rgba(21,21,21,.09)}
.sk2{border-radius:22%;background:#E5E5EA}
</style></head>
<body><div id="stage"><div class="grid"></div><div class="wash"></div></div>
<script src="../engine/kit.js"></script><script src="timing.js"></script>
<script>
const { ease, easeIn, inOut, lin, lerp, clamp, pose, apply, $, maskRise, settle } = SG;
const ST = document.getElementById('stage'), U = [];
const V = new URLSearchParams(location.search).get('v') || 'ios_ar';
const IOS = V.startsWith('ios'), AR = V.endsWith('_ar'), TM = TIMING[V], INTRO = TM.intro !== false,   // AR variants: no intro line, the steps start at «افتح البوابة من…» (client)
      T = TM.starts, VOEND = TM.end, END = VOEND + .25, DUR = END + 3.2;
window.DUR = DUR;
const vis = (el, on) => { el.style.display = on ? '' : 'none'; return on; };
const LOGO = '../../brand-kit/assets/logos/saber-group-wordmark.png', ICON = 'assets/app_icon.png', DOMAIN = 'portal.sabergroupacademy.com';

// ---------- exact labels per platform and phone language ----------
const LBL = IOS ? (AR
  ? { share: 'مشاركة', rows: ['نسخ', 'إضافة إلى قائمة القراءة', 'إضافة إشارة مرجعية', 'إضافة إلى المفضلة', 'إضافة إلى الشاشة الرئيسية', 'البحث في الصفحة'], pick: 4, cancel: 'إلغاء', title: 'إضافة إلى الشاشة الرئيسية', add: 'إضافة', note: 'ستتم إضافة أيقونة إلى الشاشة الرئيسية للوصول سريعًا إلى هذا الموقع.' }
  : { share: 'Share', rows: ['Copy', 'Add to Reading List', 'Add Bookmark', 'Add to Favorites', 'Add to Home Screen', 'Find on Page'], pick: 4, cancel: 'Cancel', title: 'Add to Home Screen', add: 'Add', note: 'An icon will be added to your Home Screen so you can quickly access this website.' })
  : (AR
  ? { menu: '⋮', rows: ['علامة تبويب جديدة', 'علامة تبويب جديدة للتصفح المتخفي', 'السجلّ', 'عمليات التنزيل', 'الإشارات المرجعية', 'تثبيت التطبيق', 'الإعدادات'], pick: 5, dtitle: 'هل تريد تثبيت التطبيق؟', cancel: 'إلغاء', add: 'تثبيت' }
  : { menu: '⋮', rows: ['New tab', 'New Incognito tab', 'History', 'Downloads', 'Bookmarks', 'Install app', 'Settings'], pick: 5, dtitle: 'Install app?', cancel: 'Cancel', add: 'Install' });
const DIR = AR ? 'rtl' : 'ltr';

// ---------- captions: the VO line by line (Latin terms when the phone is in English) ----------
const CAP = {
  ios_ar: ['عايز بوابة الطالب تبقى أبلكيشن على موبايلك؟', 'افتح البوابة من Safari… لازم Safari.', 'دوس على زرار المشاركة… اللي تحت.', 'انزل شوية… واختار «إضافة إلى الشاشة الرئيسية»', 'اسمها «بوابة الطالب»… دوس «إضافة»', 'خلاص! الأيقونة على شاشتك… تفتحها بدوسة', 'ومن غير تحديثات… كل جديد بيوصلك على طول'],
  ios_en: ['عايز بوابة الطالب تبقى أبلكيشن على موبايلك؟', 'افتح البوابة من Safari… لازم Safari.', 'دوس على زرار Share… اللي تحت.', 'انزل شوية… واختار Add to Home Screen', 'اسمها «بوابة الطالب»… دوس Add', 'خلاص! الأيقونة على شاشتك… تفتحها بدوسة', 'ومن غير تحديثات… كل جديد بيوصلك على طول'],
  android_ar: ['عايز بوابة الطالب تبقى أبلكيشن على موبايلك؟', 'افتح البوابة من Chrome.', 'دوس على التلات نقط… فوق على الشمال.', 'واختار «تثبيت التطبيق»', 'ودوس «تثبيت»', 'خلاص! هتلاقيها مع أبلكيشناتك… تفتحها بدوسة', 'ومن غير تحديثات… كل جديد بيوصلك على طول'],
  android_en: ['عايز بوابة الطالب تبقى أبلكيشن على موبايلك؟', 'افتح البوابة من Chrome.', 'دوس على التلات نقط… فوق على اليمين.', 'واختار Install app', 'ودوس Install', 'خلاص! هتلاقيها مع أبلكيشناتك… تفتحها بدوسة', 'ومن غير تحديثات… كل جديد بيوصلك على طول'],
}[V];
const KEYW = ['أبلكيشن', 'Safari', 'Chrome', 'المشاركة', 'Share', 'نقط…', '«إضافة', 'Add', '«تثبيت', 'Install', '«بوابة', 'بدوسة', 'جديد'];
const rows = [];
CAP.forEach((line, i) => { if (i === 0 && !INTRO) return;
  const t0 = T[i], t1 = (T[i + 1] ?? VOEND) - .1, words = line.match(/[A-Za-z]+(?: [A-Za-z]+)*[.…]*|\S+/g);   // an English phrase (Add to Home Screen) stays one LTR token, so RTL does not reverse it
  // spread the words over the first 70% of the line's time (proportional to their length)
  const tot = words.reduce((a, w) => a + w.length + 2, 0); let acc = 0;
  const row = $('div', 'pl', ST, `top:1470px;font-size:60px`); let keyed = false;
  const ws = words.map(w => { const at = t0 + (t1 - t0) * .7 * acc / tot; acc += w.length + 2;
    const m = $('span', 'wm', row), el = $('span', 'wi', m, 'z-index:1', w);
    if (/^[A-Za-z]/.test(w)) { el.style.direction = 'ltr'; el.style.unicodeBidi = 'isolate'; }
    if (!keyed && KEYW.some(k => w.includes(k))) { keyed = true; const b = $('span', '', el, 'position:absolute;left:-.1em;right:-.1em;top:.2em;bottom:.06em;background:#C4321F;z-index:-1;transform-origin:100% 50%;transform:scaleX(0)');
      U.push(t => { const k = ease(lin(t, at + .06, at + .3)); b.style.transform = `scaleX(${k})`; el.style.color = k > .5 ? '#F6F3F2' : ''; }); }
    return { el, at }; });
  rows.push(row);
  U.push(t => { const v = t >= t0 - .3 && t < t1 + .4 && t < END; row.style.display = v ? 'flex' : 'none'; if (v) ws.forEach(w => maskRise(w.el, t, w.at, t1)); });
});

// ---------- chrome ----------
$('div', 'corner', ST, 'left:86px;top:192px;border-width:4px 0 0 4px;z-index:40'); $('div', 'corner', ST, 'right:86px;top:1528px;border-width:0 4px 4px 0;z-index:40');
const LG = $('div', 'abs', ST, 'left:427px;top:182px;width:226px;height:54px;border-radius:12px;background:#151515;display:grid;place-items:center;z-index:40'); $('img', '', LG, 'width:190px;display:block').src = LOGO;
const OSB = $('div', 'abs', ST, 'left:0;right:0;top:242px;text-align:center;font-size:24px;line-height:1.3;font-weight:500;color:#5C5F66;direction:ltr;z-index:40', (IOS ? 'iPhone' : 'Android') + ' · ' + (AR ? 'العربية' : 'English'));
U.push(t => { const o = clamp((t - .2) / .3) * (1 - easeIn(lin(t, END - .2, END))); LG.style.opacity = o; OSB.style.opacity = o * .9; });

// ---------- the phone ----------
const PH = $('div', 'phone', ST); $('div', 'cam', PH);
const sb = $('div', 'sb ui', PH, `direction:ltr`, '<span>9:41</span><span style="display:flex;gap:6px;align-items:center"><i style="width:22px;height:12px;border:2px solid #fff;border-radius:4px;display:block"></i></span>');
U.push(t => { const k = ease(lin(t, .1, .6)); PH.style.opacity = clamp((t - .1) / .15) * (1 - easeIn(lin(t, END - .1, END + .15)));
  PH.style.transformOrigin = '50% 0'; PH.style.transform = `translateY(${lerp(100, 0, k)}px) scale(${.92 * lerp(.88, 1, k) * (1 + settle(lin(t, .45, 1.2), .012))})`; });   // 0.92: the phone ends at y≈1295, the callouts sit under it

// home screen (wallpaper + skeleton icons; the portal icon drops into its slot on step 6)
const HOME = $('div', 'scr', PH, 'background:radial-gradient(ellipse 120% 80% at 50% 0%,#F4D6CF,#EDE9E7 72%)');
const ICONS = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) { const x = 34 + c * 112, y = 110 + r * 140;
  const s = $('div', 'sk abs', HOME, `left:${x}px;top:${y}px;width:82px;height:82px`); $('div', 'abs', HOME, `left:${x + 16}px;top:${y + 92}px;width:50px;height:8px;border-radius:4px;background:rgba(21,21,21,.12)`); ICONS.push(s); }
const SLOT = { x: 34 + (AR ? 0 : 3) * 112, y: 110 + 4 * 140 };   // first free slot on the last row (RTL fills from the right)
ICONS[16 + (AR ? 3 : 0)].style.visibility = 'hidden';
const APP = $('div', 'ico abs', HOME, `left:${AR ? 34 + 3 * 112 : 34}px;top:${SLOT.y}px;width:82px;height:82px;box-shadow:0 8px 24px rgba(21,21,21,.25)`); $('img', '', APP).src = ICON;
const APPL = $('div', 'abs', HOME, `left:${(AR ? 34 + 3 * 112 : 34) - 20}px;top:${SLOT.y + 88}px;width:122px;text-align:center;font-size:15px;font-weight:700;color:#151515`, 'بوابة الطالب');
const Q = $('div', 'abs', HOME, `left:${(AR ? 34 + 3 * 112 : 34) + 10}px;top:${SLOT.y - 6}px;width:62px;height:62px;border-radius:50%;background:#C4321F;display:grid;place-items:center;font-size:44px;font-weight:700;color:#fff`, '؟');

// the browser: the REAL portal login page inside Safari / Chrome
const BR = $('div', 'scr', PH, 'background:#fff');
const PAGE = $('div', 'abs', BR, `left:0;right:0;top:${IOS ? 46 : 118}px;bottom:${IOS ? 150 : 0}px;overflow:hidden`); $('img', '', PAGE, 'width:100%;display:block').src = 'assets/portal_login.png';
let BTN;   // the button the user taps on step 3 (screen coords)
if (IOS) {
  const bar = $('div', 'abs ui', BR, 'left:0;right:0;bottom:0;height:150px;background:rgba(249,249,249,.97);border-top:1px solid #d1d1d6');
  const pill = $('div', 'abs ui', bar, 'left:24px;right:24px;top:14px;height:50px;border-radius:14px;background:#E5E5EA;display:flex;align-items:center;justify-content:center;font-size:17px;color:#000;direction:ltr');
  const URLT = $('span', '', pill, '', '');
  const icons = $('div', 'abs', bar, `left:30px;right:30px;top:80px;height:44px;display:flex;justify-content:space-between;align-items:center;direction:${DIR};color:#007AFF;font-size:34px`);
  const sv = p => `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  [AR ? '<path d="M9 6l6 6-6 6"/>' : '<path d="M15 6l-6 6 6 6"/>', AR ? '<path d="M15 6l-6 6 6 6"/>' : '<path d="M9 6l6 6-6 6"/>', '<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/>', '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>', '<rect x="4" y="7" width="12" height="12" rx="2"/><path d="M8 7V5h12v12h-2"/>']
    .forEach(p => $('span', '', icons, '', sv(p)));
  BTN = { x: 250, y: 1082 - 150 + 80 + 22 };
  U.push(t => { URLT.textContent = DOMAIN.slice(0, Math.round(DOMAIN.length * clamp((t - T[1] + .1) / .9))) || '🔍'; });
} else {
  const bar = $('div', 'abs ui', BR, 'left:0;right:0;top:46px;height:72px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px;padding:0 14px;direction:' + DIR);
  $('div', '', bar, 'width:30px;height:30px;border-radius:50%;border:2px solid #80868b;flex:none');
  const pill = $('div', 'ui', bar, 'flex:1;height:46px;border-radius:23px;background:#F1F3F4;display:flex;align-items:center;padding:0 18px;font-size:17px;color:#202124;direction:ltr;overflow:hidden;white-space:nowrap'); const URLT = $('span', '', pill);
  $('div', '', bar, 'width:32px;height:32px;border:2.5px solid #5f6368;border-radius:7px;flex:none;display:grid;place-items:center;font-size:15px;color:#5f6368', '1');
  $('div', '', bar, 'width:24px;text-align:center;font-size:34px;color:#5f6368;flex:none;line-height:1', '⋮');
  BTN = { x: AR ? 26 : 474, y: 46 + 36 };
  U.push(t => { URLT.textContent = DOMAIN.slice(0, Math.round(DOMAIN.length * clamp((t - T[1] + .1) / .9))); });
}

// step 4: the share sheet (iOS) / the Chrome menu (Android), the right row highlighted
const SHEET = IOS
  ? $('div', 'abs ui', PH, `left:0;right:0;bottom:0;height:720px;border-radius:28px 28px 0 0;background:#F2F2F7;box-shadow:0 -10px 40px rgba(0,0,0,.18);direction:${DIR};z-index:6;overflow:hidden`)
  : $('div', 'abs ui', PH, `${AR ? 'left' : 'right'}:10px;top:52px;width:330px;border-radius:14px;background:#fff;direction:${DIR};z-index:6;box-shadow:0 14px 40px rgba(0,0,0,.28);overflow:hidden`);
const LIST = $('div', '', SHEET, IOS ? 'position:absolute;left:0;right:0;top:0' : '');
if (IOS) { const hd = $('div', '', LIST, 'display:flex;align-items:center;gap:14px;padding:22px;border-bottom:1px solid rgba(0,0,0,.08)');
  const ic = $('div', 'ico', hd, 'width:58px;height:58px;flex:none'); $('img', '', ic).src = ICON;
  $('div', '', hd, 'flex:1;min-width:0', `<div style="font-size:19px;font-weight:700;color:#000;white-space:nowrap;overflow:hidden">بوابة الطالب - SABER GROUP</div><div style="font-size:15px;color:#8e8e93;direction:ltr;text-align:${AR ? 'right' : 'left'}">${DOMAIN}</div>`);
  const apps = $('div', '', LIST, 'display:flex;gap:18px;padding:22px;border-bottom:1px solid rgba(0,0,0,.08)'); for (let i = 0; i < 5; i++) $('div', 'sk2', apps, 'width:64px;height:64px;flex:none'); }
else { const top = $('div', '', LIST, 'display:flex;justify-content:space-around;padding:14px 8px;border-bottom:1px solid rgba(0,0,0,.08)'); for (let i = 0; i < 5; i++) $('div', '', top, 'width:26px;height:26px;border-radius:6px;border:2.5px solid #5f6368'); }
const ROWS = LBL.rows.map((r, i) => { const el = $('div', 'row', LIST, `color:${IOS ? '#000' : '#202124'};${IOS ? 'margin:0 14px;' : ''}`, `<span>${r}</span>${IOS ? '<span style="width:28px;height:28px;border:2.5px solid #3c3c43;border-radius:7px;display:block"></span>' : ''}`); return el; });
// step 5: the confirm panel (iOS full sheet / Android dialog)
const CONF = IOS
  ? $('div', 'abs ui', PH, `inset:0;background:#F2F2F7;direction:${DIR};z-index:7`)
  : $('div', 'abs ui', PH, `left:40px;right:40px;top:380px;border-radius:26px;background:#fff;padding:30px;direction:${DIR};z-index:7;box-shadow:0 20px 60px rgba(0,0,0,.3)`);
let ADDB;
if (IOS) { const nav = $('div', '', CONF, 'position:absolute;left:0;right:0;top:46px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #d1d1d6;font-size:19px');
  $('span', '', nav, 'color:#007AFF', LBL.cancel); $('span', '', nav, 'color:#000;font-weight:700', LBL.title); ADDB = $('span', '', nav, 'color:#007AFF;font-weight:700', LBL.add);
  const card = $('div', '', CONF, 'position:absolute;left:22px;right:22px;top:140px;border-radius:16px;background:#fff;display:flex;gap:18px;padding:18px;align-items:center');
  const ic = $('div', 'ico', card, 'width:92px;height:92px;flex:none'); $('img', '', ic).src = ICON;
  $('div', '', card, 'flex:1', `<div style="font-size:22px;font-weight:700;color:#000;border-bottom:1px solid #e5e5ea;padding-bottom:10px">بوابة الطالب</div><div style="font-size:15px;color:#8e8e93;padding-top:10px;direction:ltr;text-align:${AR ? 'right' : 'left'}">https://${DOMAIN}/</div>`);
  $('div', '', CONF, 'position:absolute;left:30px;right:30px;top:290px;font-size:15px;color:#6d6d72;line-height:1.5', LBL.note);
  ADDB.dataset.pos = 'nav'; }
else { const hd = $('div', '', CONF, 'display:flex;align-items:center;gap:18px'); const ic = $('div', 'ico', hd, 'width:76px;height:76px;flex:none;border-radius:50%'); $('img', '', ic).src = ICON;
  $('div', '', hd, '', `<div style="font-size:23px;font-weight:700;color:#202124">${LBL.dtitle}</div><div style="font-size:19px;color:#3c4043;margin-top:4px">بوابة الطالب</div><div style="font-size:15px;color:#5f6368;direction:ltr;text-align:${AR ? 'right' : 'left'}">${DOMAIN}</div>`);
  const bt = $('div', '', CONF, `display:flex;justify-content:flex-end;gap:26px;margin-top:30px;font-size:21px;font-weight:700`);
  $('span', '', bt, 'color:#1a73e8;padding:10px 6px', LBL.cancel); ADDB = $('span', '', bt, 'color:#fff;background:#1a73e8;padding:10px 26px;border-radius:22px', LBL.add); }

// the opened app: the portal's real UI, full screen (no browser bars)
const APPV = $('div', 'scr', PH, 'z-index:8;background:#0a0a0a'); $('img', '', APPV, 'width:100%;display:block').src = 'assets/portal_home.jpg';
const UPD = $('div', 'abs ui', APPV, 'left:20px;right:20px;top:60px;height:64px;border-radius:16px;background:#C4321F;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:700;direction:rtl;box-shadow:0 12px 30px rgba(0,0,0,.5)', 'نزل تحديث جديد · <u>حدّث دلوقتي</u>');

const TAP = $('div', 'tap', PH);
const tapAt = (t, at, x, y) => { const k = lin(t, at, at + .45); if (t < at || k >= 1) return false; TAP.style.display = ''; TAP.style.left = x + 'px'; TAP.style.top = y + 'px'; TAP.style.opacity = 1 - k; TAP.style.transform = `scale(${lerp(.5, 1.5, ease(k))})`; return true; };

U.push(t => {
  // which screen: home (step 1) → browser (2..5) → home with the icon (6) → the app (6 tap .. 7)
  const s2 = T[1], s3 = T[2], s4 = T[3], s5 = T[4], s6 = T[5], s7 = T[6], appOpen = s6 + (s7 - s6) * .55;
  vis(HOME, (INTRO && t < s2) || (t >= s6 && t < appOpen + .5)); vis(BR, (!INTRO || t >= s2 - .05) && t < s6);
  sb.style.color = t < appOpen + .2 ? '#000' : '#fff';   // light home + light browsers; the portal app itself is dark
  // step 1: the question mark on the empty slot; step 6: the icon drops into it
  if (t < s2) { APP.style.opacity = APPL.style.opacity = 0; apply(Q, pose(t, { at: .8, dy: 0, s0: .3, dur: .35, follow: .04 })); }
  else { Q.style.opacity = 0; const k = ease(lin(t, s6 + .15, s6 + .6)); APP.style.opacity = APPL.style.opacity = clamp((t - s6 - .15) / .1);
    APP.style.transform = `translateY(${lerp(-260, 0, k)}px) scale(${lerp(1.6, 1, k) * (1 + settle(lin(t, s6 + .45, s6 + 1.2), .05))})`; }
  // browser opens (slides up from the home screen)
  if (!INTRO) PAGE.style.opacity = clamp((t - T[1] - .85) / .2);   // the page loads once the address is typed
  BR.style.transform = INTRO ? `translateY(${lerp(1082, 0, ease(lin(t, s2 - .05, s2 + .35)))}px)` : 'none';   // no intro: the phone comes in on the browser
  // step 4 sheet / menu, step 5 confirm
  const shOn = t >= s4 - .05 && t < s5 + .25; vis(SHEET, shOn);
  if (shOn) { if (IOS) SHEET.style.transform = `translateY(${lerp(720, 0, ease(lin(t, s4, s4 + .35)))}px)`;
    else { SHEET.style.transformOrigin = AR ? '0 0' : '100% 0'; SHEET.style.transform = `scale(${lerp(.6, 1, ease(lin(t, s4 - .05, s4 + .25)))})`; SHEET.style.opacity = clamp((t - s4 + .05) / .12); }
    if (IOS) LIST.style.transform = `translateY(${-130 * inOut(lin(t, s4 + .5, s4 + 1.3))}px)`;   // «انزل شوية»
    const hlAt = IOS ? s4 + 1.4 : s4 + .7; ROWS.forEach((r, i) => r.classList.toggle('hl', i === LBL.pick && t > hlAt)); }
  const cfOn = t >= s5 - .05 && t < s6; vis(CONF, cfOn);
  if (cfOn) { if (IOS) CONF.style.transform = `translateY(${lerp(1082, 0, ease(lin(t, s5 - .05, s5 + .35)))}px)`;
    else { CONF.style.transform = `scale(${lerp(.85, 1, ease(lin(t, s5 - .05, s5 + .3)))})`; CONF.style.opacity = clamp((t - s5 + .05) / .12); }
    ADDB.style.outline = t > s5 + .6 ? '4px solid #FF8A1F' : 'none'; ADDB.style.borderRadius = '12px'; }
  // the app opens from the icon, full screen; then the update bar (step 7)
  const ao = t >= appOpen; vis(APPV, ao && t < END + .3);
  if (ao) { const k = ease(lin(t, appOpen, appOpen + .45)), ox = (AR ? 34 + 3 * 112 : 34) + 41, oy = SLOT.y + 41;
    APPV.style.transformOrigin = `${ox}px ${oy}px`; APPV.style.transform = `scale(${lerp(.16, 1, k)})`; APPV.style.opacity = clamp((t - appOpen) / .1); APPV.style.borderRadius = `${lerp(30, 0, k)}px`; }
  apply(UPD, pose(t, { at: s7 + .5, dy: -30, dur: .4, follow: .02 }));
  // taps
  TAP.style.display = 'none';
  tapAt(t, s3 + .55, BTN.x, BTN.y) ||
  tapAt(t, (IOS ? s4 + 1.7 : s4 + 1.0), IOS ? 250 : (AR ? 175 : 325), IOS ? 46 + 300 + LBL.pick * 66 - 130 + 140 : 52 + 56 + LBL.pick * 66 + 33) ||
  tapAt(t, s5 + .9, IOS ? (AR ? 50 : 450) : (AR ? 120 : 400), IOS ? 46 + 32 : 380 + 150) ||
  tapAt(t, appOpen - .25, (AR ? 34 + 3 * 112 : 34) + 41, SLOT.y + 41);
});
// highlight ring on the tapped bar button (step 3) + callout chip with the exact label, outside the phone
const RING = $('div', 'abs', PH, `width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:4px solid #FF8A1F;box-shadow:0 0 24px rgba(255,138,31,.7);left:${BTN.x}px;top:${BTN.y}px;z-index:30`);
U.push(t => { vis(RING, t > T[2] && t < T[3]); RING.style.opacity = .6 + .4 * Math.sin(t * 9); });
const CALLS = [[T[1], IOS ? 'Safari' : 'Chrome'], [T[2], IOS ? LBL.share : (AR ? 'التلات نقط ⋮' : 'Menu ⋮')], [T[3], LBL.rows[LBL.pick]], [T[4], LBL.add]];
CALLS.forEach(([at, txt], i) => { const c = $('div', 'chip', ST, `left:50%;top:1322px`, `<span style="width:14px;height:14px;border-radius:50%;background:#C4321F;display:block"></span><span style="direction:${/^[A-Za-z]/.test(txt) ? 'ltr' : 'rtl'}">${txt}</span>`);
  const end = (T[[2, 3, 4, 5][i]]) - .15; U.push(t => { if (!vis(c, t > at + .2 && t < end + .4)) return; apply(c, pose(t, { at: at + .3, dy: 20, dur: .35, follow: .02, out: end }), 'translateX(-50%)'); }); });

// ---------- END card ----------
(() => { const g = $('div', 'abs', ST, 'inset:0;z-index:50;background:#F6F3F2'); $('div', 'grid', g); $('div', 'wash', g);
  $('div', 'corner', g, 'left:86px;top:192px;border-width:4px 0 0 4px'); $('div', 'corner', g, 'right:86px;top:1528px;border-width:0 4px 4px 0');
  const ic = $('div', 'ico abs', g, 'left:430px;top:560px;width:220px;height:220px;box-shadow:0 24px 70px rgba(21,21,21,.28)'); $('img', '', ic).src = ICON;
  const L1 = $('div', 'abs', g, 'left:0;right:0;top:830px;text-align:center;font-size:76px;font-weight:700;direction:rtl', 'بوابة <span style="color:#C4321F">الطالب</span>');
  const L2 = $('div', 'abs', g, 'left:0;right:0;top:950px;text-align:center;font-size:40px;font-weight:500;color:#5C5F66;direction:rtl', 'أبلكيشن على موبايلك… من غير ستور');
  const u = $('div', 'abs', g, 'left:0;right:0;top:1040px;text-align:center;font-size:38px;font-weight:700;color:#151515;direction:ltr', DOMAIN);
  const lg = $('div', 'abs', g, 'left:375px;top:1160px;width:330px;height:80px;border-radius:14px;background:#151515;display:grid;place-items:center'); $('img', '', lg, 'width:280px;display:block').src = LOGO;
  U.push(t => { if (!vis(g, t > END - .05)) return; g.style.opacity = clamp((t - END + .05) / .2);
    apply(ic, pose(t, { at: END + .05, dy: 30, s0: .7, dur: .45, follow: .03 })); apply(L1, pose(t, { at: END + .35, dy: 20 })); apply(L2, pose(t, { at: END + .55, dy: 16 })); apply(u, pose(t, { at: END + .75, dy: 12 })); apply(lg, pose(t, { at: END + .95, dy: 10 })); }); })();

window.render = t => U.forEach(f => f(t));
window.ready = Promise.all([document.fonts.load('700 60px Cairo'), document.fonts.load('500 40px Cairo'), document.fonts.load('60px Bebas'),
  ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); }))]).then(() => document.fonts.ready).then(() => {
  document.querySelectorAll('.pl').forEach(row => { const d = row.style.display; row.style.display = 'flex'; let fs = parseFloat(row.style.fontSize);
    while (row.scrollWidth > 908 && fs > 34) { fs -= 2; row.style.fontSize = fs + 'px'; } row.style.display = d; }); });
</script></body></html>
