<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>القناة والجروب</title>
<link rel="stylesheet" href="../lib/sg.css">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  .status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 32px 0; font: 700 15px -apple-system, Plex; direction: ltr; z-index: 40; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status .batt { width: 24px; height: 12px; border: 2px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
  .status .batt::after { content: ''; position: absolute; inset: 1px 4px 1px 1px; background: currentColor; border-radius: 1px; }
  .login .status, .portal .status { color: #fff; }
  .wa { background: #0b141a; font-family: -apple-system, Plex, sans-serif; color: #e9edef; }
  .wa .status { color: #fff; background: #1f2c34; }
  .wah { position: absolute; top: 50px; left: 0; right: 0; height: 62px; background: #1f2c34; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .wback { font: 400 30px -apple-system; color: #00a884; } .wav { width: 38px; height: 38px; border-radius: 50%; background: #e2361d; display: grid; place-items: center; font: 800 12px Plex; color: #fff; }
  .wah b { display: block; font: 700 13.5px Plex; direction: ltr; text-align: right; } .wah small { font: 500 10px Plex; color: #8696a0; }
  .wamsgs { position: absolute; top: 120px; left: 0; right: 0; bottom: 64px; padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; zoom: 1.12; }
  .wday { align-self: center; font: 600 10px Plex; color: #8696a0; background: #182229; border-radius: 8px; padding: 4px 10px; }
  .wb { max-width: 78%; border-radius: 10px; padding: 6px 9px 4px; display: grid; gap: 2px; }
  .wb.out { align-self: flex-start; background: #005c4b; } .wb.in { align-self: flex-end; background: #202c33; }
  .wb p { font: 500 12px/1.55 Plex; } .wn { font: 700 10.5px Plex; } .wn.c1 { color: #53bdeb; } .wn.c2 { color: #ffbc38; } .wn.c3 { color: #fc9775; }
  .wt { justify-self: start; font: 500 9px Plex; color: rgba(233,237,239,.6); direction: rtl; }
  .wshot { width: 210px; height: 120px; border-radius: 8px; background: #2b2b2b; position: relative; overflow: hidden; margin-bottom: 4px; }
  .wsbar { height: 14px; background: #3c3c3c; } .wsdlg { position: absolute; left: 40px; right: 40px; top: 34px; background: #ececec; border-radius: 6px; padding: 7px; display: grid; gap: 4px; direction: ltr; }
  .wsdlg b { font: 700 9px -apple-system; color: #c00; } .wsdlg i { height: 4px; background: #bbb; border-radius: 2px; } .wsdlg span { justify-self: end; font: 700 8px -apple-system; color: #fff; background: #0a64d8; border-radius: 3px; padding: 1px 8px; }
  .wain { position: absolute; left: 10px; right: 10px; bottom: 14px; height: 40px; border-radius: 20px; background: #1f2c34; display: flex; align-items: center; padding: 0 16px; } .wain i { font: 500 12px Plex; color: #8696a0; font-style: normal; }
  #hours { position: absolute; top: 960px; right: 86px; width: 340px; direction: rtl; z-index: 5; display: grid; gap: 14px; }
  #hours .hr { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 14px 20px; display: grid; gap: 4px; }
  #hours .hr small { font: 600 22px Cairo; color: #b8afad; } #hours .hr b { font: 700 34px Cairo; color: var(--orange); }
</style>
</head>
<body>
<!--#include ../lib/icons.svg.html-->
<div id="stage" class="layoutB">
  <svg id="corners" width="1080" height="1920" viewBox="0 0 1080 1920"><g fill="none" stroke-width="2"><path stroke="#FF8A1F" d="M86 140v-37l17-17h37"/><path stroke="#C4321F" d="M994 1780v37l-17 17h-37"/></g></svg>
  <div id="logo"><img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP"></div>
  <div id="stepTag"><b id="stepNum">2</b><span id="stepLbl">CHATS</span></div>
  <div id="head"></div>

  <div id="phone"><div id="screen">
    <div class="notch"></div>
<!--#include ../lib/screens.telegram.html-->
<!--#include ../lib/screens.groups.html-->
<!--#include ../lib/screens.whatsapp.html-->
    <div id="ring"></div><div class="tapring" id="ripple"></div><div class="tapdot" id="finger"></div>
  </div></div>

  <div id="cap"></div>
  <div id="foot"><span class="url">portal.sabergroupacademy.com</span><span class="lbl">SABER GROUP ACADEMY</span></div>

  <div id="hours"><div class="hr" id="hr1"><small>المتابعة كل يوم</small><b>من 4 لـ 10 مساءً</b></div><div class="hr" id="hr2"><small>برّه المواعيد دي؟</small><b>أي حد متاح بيرد</b></div></div>
  <div id="end">
    <img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP">
    <h2>بوابة الطالب</h2>
    <div class="sub">القناة للتسجيلات… والجروب للمتابعة</div>
    <div class="rule"></div>
    <p>portal.sabergroupacademy.com</p>
  </div>
</div>

<script src="../lib/engine.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const show = (sel, on) => { const el = $(sel); el.style.display = on ? '' : 'none'; return el; };
const FPS = 25, IN = 12 / FPS, OUT = 8 / FPS, STAG = 2 / FPS, PHONE_K = 1.3;
function bez(x1, y1, x2, y2) {
  return (x) => { let t = x; for (let i = 0; i < 6; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x; const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; t = Math.min(1, Math.max(0, t)); } return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const ease = bez(0.16, 1, 0.3, 1);
const inX = (t, t0) => ease(Math.min(1, Math.max(0, (t - t0) / IN)));

const HEADS = {
  h:  { tag: ['2', 'CHATS'], eyebrow: 'TELEGRAM', title: 'قناة وجروب لكل كورس', sub: 'وكل واحد ليه دور' },
  c1: { tag: ['01', 'CHANNEL'], eyebrow: 'RECORDINGS CHANNEL', title: 'قناة التسجيلات', sub: 'تسجيل كل محاضرة… خلال <span class="ltr">48</span> ساعة بالكتير' },
  c2: { tag: ['01', 'CHANNEL'], eyebrow: 'RECORDINGS CHANNEL', title: 'متاحة <span class="ltr">6</span> شهور', sub: 'للمشاهدة بس… من غير تحميل' },
  g1: { tag: ['02', 'GROUP'], eyebrow: 'FOLLOW-UP GROUP', title: 'جروب المتابعة', sub: 'فيه كذا توبيك' },
  g2: { tag: ['02', 'GROUP'], eyebrow: 'TOPIC · RULES', title: 'القواعد العامة', sub: 'اقراها أول ما تدخل' },
  g3: { tag: ['02', 'GROUP'], eyebrow: 'TOPIC · TASKS', title: 'تاسكات المحاضرات', sub: 'المطلوب بعد كل محاضرة' },
  g4: { tag: ['02', 'GROUP'], eyebrow: 'TOPIC · YOURS', title: 'التوبيك اللي باسمك', sub: 'تسلّم فيه… والمدرب يتابعك' },
  r1: { tag: ['!', 'HELP'], eyebrow: 'GOT A PROBLEM?', title: 'جروب الواتس', sub: 'ابعتها… مع سكرين شوت كاملة' },
  r2: { tag: ['!', 'HELP'], eyebrow: 'DAILY FOLLOW-UP', title: 'مدربين بيتابعوا كل يوم', sub: '' },
};

window.SCENE = {
  setup(E) {
    const W = E.W, L = E.L, T = (this.T = {});
    const head = $('#head');
    this.heads = Object.entries(HEADS).map(([id, h]) => {
      const el = document.createElement('div');
      el.className = 'blk';
      el.innerHTML = `<div class="eyebrow">${h.eyebrow}</div><h1>${h.title}</h1>${h.sub ? `<p>${h.sub}</p>` : ''}<div class="rule"></div>`;
      head.appendChild(el);
      return { id, el, h, parts: [...el.children], t0: L(id).start - 0.15 };
    });
    this.heads.forEach((b, i) => (b.t1 = this.heads[i + 1] ? this.heads[i + 1].t0 : E.tl.outro_start));
    T.fwd = W('c2', 12);
    T.tapRules = W('g2', 1) - 0.05;
    T.tapMine = W('g4', 1);
    T.end = E.tl.outro_start;
    this.beats = [
      { t: 0, layer: 'grp', focus: '.topics', ring: false },
      { t: W('h', 4) - 0.1, layer: 'feed', focus: '.tgh', ring: false },
      { t: W('h', 6) - 0.1, layer: 'grp', focus: '.tgh', ring: false },
      { t: L('c1').start - 0.15, layer: 'feed', focus: '#p2' },
      { t: W('c1', 6) - 0.1, layer: 'rules', focus: '#ruleRec', mark: '#ruleRec' },
      { t: L('c2').start - 0.15, layer: 'rules', focus: '#ruleKeep', mark: '#ruleKeep' },
      { t: W('c2', 7) - 0.1, layer: 'feed', focus: '#p2' },
      { t: W('c2', 11) - 0.1, layer: 'feed', focus: '#fwdToast' },
      { t: L('g1').start - 0.15, layer: 'grp', focus: '.topics', ring: false },
      { t: T.tapRules + 0.35, layer: 'rules', focus: '#ruleMsg', ring: false },
      { t: W('g2', 6) - 0.1, layer: 'rules', focus: '.pinbar' },
      { t: L('g3').start - 0.15, layer: 'grp', focus: '#tTasks' },
      { t: L('g4').start - 0.15, layer: 'grp', focus: '#myTopic' },
      { t: T.tapMine + 0.35, layer: 'topic', focus: '#t2' },
      { t: L('r1').start - 0.15, layer: 'wa', focus: '.wah', ring: false },
      { t: W('r1', 10) - 0.1, layer: 'wa', focus: '#w1' },
      { t: W('r1', 15) - 0.1, layer: 'wa', focus: '#w2' },
      { t: W('r1', 20) - 0.1, layer: 'wa', focus: '#w3' },
      { t: W('r2', 1) - 0.1, layer: 'wa', focus: '#w4' },
    ];
    this.taps = [{ t: T.tapRules, sel: '#tRules' }, { t: T.tapMine, sel: '#myTopic' }];
    this.taps.forEach((p) => E.ev(p.t, 'tap'));
    E.ev(T.fwd, 'pop');
    T.w = [W('r1', 10), W('r1', 15), W('r1', 20), W('r2', 1)];
    T.w.forEach((x) => E.ev(x, 'pop'));
    T.hr = [W('r2', 6), W('r2', 11)];
  },

  state(t) {
    const T = this.T;
    show('#fwdToast', t >= T.fwd && t < E.L('g1').start);
    ['#w1', '#w2', '#w3', '#w4'].forEach((id, i) => { const x = inX(t, T.w[i] - 0.1); const el = $(id); el.style.opacity = x; el.style.transform = `translateY(${(1 - x) * 12}px)`; });
    const ho = 1 - E.k(t, T.end, T.end + OUT);
    ['#hr1', '#hr2'].forEach((id, i) => { const x = inX(t, T.hr[i]); const el = $(id); el.style.opacity = x * ho; el.style.transform = `translateX(${(1 - x) * -24}px)`; });
    show('#grToast', false);
    $('#myTopic').classList.toggle('hi', false);
    show('#t1', true); show('#t2', true);
    let bi = 0; this.beats.forEach((b, i) => { if (t >= b.t) bi = i; });
    document.querySelectorAll('.rl').forEach((r) => r.classList.toggle('mark', !!this.beats[bi].mark && r.matches(this.beats[bi].mark)));
  },

  render(t, E) {
    const T = this.T;
    this.state(t);

    let bi = 0;
    this.beats.forEach((b, i) => { if (t >= b.t) bi = i; });
    const beat = this.beats[bi], prevBeat = this.beats[bi - 1];
    $('#phone').style.transform = `scale(${PHONE_K})`;
    document.querySelectorAll('#screen > .layer').forEach((l) => { l.style.display = l.id === beat.layer ? 'block' : 'none'; l.style.opacity = 1; l.style.transform = 'none'; });
    const lay = document.getElementById(beat.layer);
    if (bi > 0 && prevBeat.layer !== beat.layer) {
      const x = inX(t, beat.t);
      lay.style.opacity = x; lay.style.transform = `translateY(${(1 - x) * 10}px)`;
    }
    const sr = $('#screen').getBoundingClientRect(), sk = sr.width / 390;
    // orange ring on what the voice talks about
    const ring = $('#ring');
    ring.style.opacity = 0;
    const fe = beat.ring !== false && beat.focus ? lay.querySelector(beat.focus) : null;
    if (fe && fe.offsetParent) {
      const r = fe.getBoundingClientRect(), pad = 5;
      ring.style.left = (r.left - sr.left) / sk - pad + 'px'; ring.style.top = (r.top - sr.top) / sk - pad + 'px';
      ring.style.width = r.width / sk + pad * 2 + 'px'; ring.style.height = r.height / sk + pad * 2 + 'px';
      ring.style.opacity = inX(t, beat.t + 0.2) * 0.95;
    }
    // taps
    const f = $('#finger'), rp = $('#ripple');
    f.style.opacity = 0; rp.style.opacity = 0;
    for (const tap of this.taps) {
      if (t < tap.t - 0.45 || t > tap.t + 0.5) continue;
      const el = $(tap.sel);
      if (!el || !el.offsetParent) continue;
      const r = el.getBoundingClientRect();
      const x = (r.left + r.width / 2 - sr.left) / sk, y = (r.top + r.height / 2 - sr.top) / sk;
      const a = ease(E.k(t, tap.t - 0.45, tap.t - 0.1));
      f.style.left = x + 'px'; f.style.top = y + (1 - a) * 18 + 'px';
      f.style.opacity = Math.min(a, 1 - E.k(t, tap.t + 0.2, tap.t + 0.45));
      f.style.transform = `scale(${t >= tap.t - 0.05 && t < tap.t + 0.1 ? 0.86 : 1})`;
      if (t >= tap.t) { const q = E.k(t, tap.t, tap.t + 0.5); rp.style.left = x + 'px'; rp.style.top = y + 'px'; rp.style.opacity = 1 - q; rp.style.transform = `scale(${1 + q * 1.4})`; }
    }

    // head blocks: old exits (8f), then new enters (12f, 2f stagger)
    let cur = this.heads[0];
    this.heads.forEach((b) => {
      if (t >= b.t0 && t < b.t1) cur = b;
      const first = b === this.heads[0];
      const vis = t >= b.t0 + (first ? 0 : OUT) && t < b.t1 + OUT;
      b.el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      const out = t >= b.t1 ? E.k(t, b.t1, b.t1 + OUT) : 0;
      b.parts.forEach((p, i) => {
        const x = first && t < 0.6 ? inX(t, 0.2 + i * STAG) : inX(t, b.t0 + (first ? 0 : OUT) + i * STAG);
        p.style.opacity = x * (1 - out); p.style.transform = `translateY(${(1 - x) * 18}px)`;
      });
    });
    $('#stepNum').textContent = cur.h.tag[0]; $('#stepLbl').textContent = cur.h.tag[1];

    // captions
    E.pages.forEach((p) => {
      const on = t >= p.t0 && t < p.t1;
      p.el.style.display = on ? 'flex' : 'none';
      if (!on) return;
      const x = inX(t, p.t0), out = E.k(t, p.t1 - OUT, p.t1);
      p.el.style.opacity = x * (1 - out); p.el.style.transform = `translateY(${(1 - x) * 12}px)`;
      p.words.forEach((w) => { w.el.style.opacity = 1; w.el.style.transform = 'none'; w.el.classList.toggle('now', t >= w.s && t < w.e + 0.05); });
    });

    const logoIn = ease(E.k(t, 0, 20 / FPS));
    $('#logo').style.opacity = logoIn; $('#logo').style.transform = `translateY(${(1 - logoIn) * 14}px)`;
    const endIn = ease(E.k(t, T.end, T.end + 20 / FPS));
    $('#end').style.opacity = endIn; $('#end img').style.transform = `translateY(${(1 - endIn) * 14}px)`;
  },
};
</script>
</body>
</html>
