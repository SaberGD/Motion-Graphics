<script>
const $ = (s) => document.querySelector(s);
const show = (sel, on) => { const el = $(sel); el.style.display = on ? '' : 'none'; return el; };
const FPS = 25, IN = 12 / FPS, OUT = 8 / FPS, STAG = 2 / FPS, PHONE_K = 1.3;
function bez(x1, y1, x2, y2) {
  return (x) => { let t = x; for (let i = 0; i < 6; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x; const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; t = Math.min(1, Math.max(0, t)); } return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const ease = bez(0.16, 1, 0.3, 1);
const inX = (t, t0) => ease(Math.min(1, Math.max(0, (t - t0) / IN)));
// emoji glyphs come from a local color-emoji font
const EMO = /(\p{Extended_Pictographic}️?)/u;
function wrapEmoji(root) {
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walk.nextNode())) if (EMO.test(n.nodeValue) && !n.parentElement.closest('script,style')) nodes.push(n);
  nodes.forEach((node) => {
    const frag = document.createDocumentFragment();
    node.nodeValue.split(EMO).forEach((part, i) => {
      if (!part) return;
      if (i % 2 && !'✓★✦◎'.includes(part)) { const s = document.createElement('span'); s.className = 'emo'; s.textContent = part; frag.appendChild(s); }
      else frag.appendChild(document.createTextNode(part));
    });
    node.parentNode.replaceChild(frag, node);
  });
}

const HEADS = {
  h:  { tag: ['◆', 'HOME'], eyebrow: 'FOLLOW-UP & COMPETITION', title: 'إنت مش رقم', sub: 'متابعتك ومنافستك من «الرئيسية»' },
  t1: { tag: ['01', 'TO DO'], eyebrow: 'YOUR TASKS', title: 'المطلوب منك دلوقتي', sub: 'الناقص… وزرار «سلّم»' },
  c1: { tag: ['02', 'CERTIFICATE'], eyebrow: 'ON TRACK?', title: 'طريقك للشهادة', sub: 'حضورك وتطبيقاتك قصاد الـ80%' },
  n1: { tag: ['03', 'NOTES'], eyebrow: 'JUST FOR YOU', title: 'ملاحظات ليك إنت', sub: 'من المدرب… لحد «تم المعالجة»' },
  p1: { tag: ['04', 'TOP 3'], eyebrow: 'LEADERBOARD', title: 'المتصدرين', sub: 'أول تلاتة في الجروب' },
  l1: { tag: ['05', 'LEVEL'], eyebrow: 'LEVEL UP', title: 'مستواك', sub: 'من مبتدئ… لحد ماسي 💎' },
  w1: { tag: ['06', 'WEEKLY'], eyebrow: 'STAR OF THE WEEK', title: 'نجم الأسبوع', sub: 'أعلى 3 كل أسبوع ⭐' },
  a1: { tag: ['07', 'BADGES'], eyebrow: 'ACHIEVEMENTS', title: 'إنجازاتك', sub: 'ترتيبك… وسلسلتك… وشاراتك' },
  ph: { tag: ['08', 'PHOTO'], eyebrow: 'PROFILE PHOTO', title: 'حط صورتك', sub: 'من «حسابي»' },
  x:  { tag: ['★', 'GO'], eyebrow: 'YOUR TURN', title: 'النجمة الجاية بتاعتك', sub: 'التزم… وسلّم في ميعادك' },
};

window.SCENE = {
  setup(E) {
    const W = E.W, L = E.L, T = (this.T = {});
    wrapEmoji($('#screen'));
    const head = $('#head');
    this.heads = Object.entries(HEADS).map(([id, h]) => {
      const el = document.createElement('div');
      el.className = 'blk';
      el.innerHTML = `<div class="eyebrow">${h.eyebrow}</div><h1>${h.title}</h1>${h.sub ? `<p>${h.sub}</p>` : ''}<div class="rule"></div>`;
      head.appendChild(el);
      wrapEmoji(el);
      return { id, el, h, parts: [...el.children], t0: L(id).start - 0.15 };
    });
    this.heads.forEach((b, i) => (b.t1 = this.heads[i + 1] ? this.heads[i + 1].t0 : E.tl.outro_start));

    T.send = W('t1', 12) + 0.1; T.good = W('t1', 16) - 0.1;
    T.bars = L('c1').start + 0.2; T.ready = W('c1', 12) - 0.05;
    T.tabProg = L('n1').start + 0.35; T.prog = T.tabProg + 0.35; T.resolve = W('n1', 14);
    T.lvlFill = L('l1').start + 0.3;
    T.lad = [W('l1', 6), W('l1', 7), W('l1', 8), W('l1', 10)];
    T.acct = W('ph', 3) - 0.05; T.dlg = T.acct + 0.35; T.change = W('ph', 5) - 0.1; T.photo = T.change + 0.55;
    T.end = E.tl.outro_start;
    this.beats = [
      { t: 0, layer: 'mot', focus: '.home-hero', ring: false, y: 0 },
      { t: W('h', 6) - 0.1, layer: 'mot', focus: '.ostats', y: 0 },
      { t: L('t1').start - 0.15, layer: 'mot', focus: '#mTodo', y: '#mTodo' },
      { t: W('t1', 11) - 0.2, layer: 'mot', focus: '#mSend', y: '#mTodo' },
      { t: T.good, layer: 'mot', focus: '#mTodo', y: '#mTodo' },
      { t: L('c1').start - 0.15, layer: 'mot', focus: '#mCert', y: '#mTodo' },
      { t: T.ready, layer: 'mot', focus: '#mReady', y: '#mTodo' },
      { t: L('n1').start - 0.15, layer: 'mot', focus: '#navProg2', y: '#mTodo' },
      { t: T.prog, layer: 'prog', focus: '#wk2' },
      { t: T.resolve + 0.5, layer: 'prog', focus: '#wkAll' },
      { t: L('p1').start - 0.15, layer: 'mot', focus: '#mPod', y: '#mPod' },
      { t: W('p1', 8) - 0.1, layer: 'mot', focus: '#mMe', y: '#mPod' },
      { t: L('l1').start - 0.15, layer: 'mot', focus: '#mLvl', y: '#mLvl' },
      { t: W('l1', 5) - 0.1, layer: 'mot', focus: '#mLadder', y: '#mLvl' },
      { t: L('w1').start - 0.15, layer: 'mot', focus: '#mWeekTop', y: '#mWeek' },
      { t: W('w1', 9) - 0.1, layer: 'mot', focus: '#mStar', y: '#mWeek' },
      { t: L('a1').start - 0.15, layer: 'mot', focus: '#mRank', y: '#mAch' },
      { t: W('a1', 4) - 0.1, layer: 'mot', focus: '#mStreak', y: '#mAch' },
      { t: W('a1', 8) - 0.1, layer: 'mot', focus: '#mBadges', y: '#mAch' },
      { t: L('ph').start - 0.15, layer: 'mot', focus: '#mAcct', y: 0 },
      { t: T.dlg, layer: 'acct', focus: '#mPhoto' },
      { t: L('x').start - 0.15, layer: 'mot', focus: '#mMe', y: '#mPod' },
    ];
    this.taps = [{ t: T.send, sel: '#mSend' }, { t: T.tabProg, sel: '#navProg2' }, { t: T.acct, sel: '#mAcct' }, { t: T.change, sel: '#mChange' }];
    this.taps.forEach((p) => E.ev(p.t, 'tap'));
    E.ev(T.good + 0.15, 'success'); E.ev(T.ready, 'ding'); E.ev(T.resolve, 'success');
    E.ev(W('p1', 2), 'pop'); T.lad.forEach((x) => E.ev(x, 'pop'));
    E.ev(W('w1', 8), 'ding'); E.ev(T.photo, 'success');
  },

  state(t) {
    const T = this.T;
    const good = t >= T.good;
    show('#mTodoList', !good); show('#mTodoGood', good);
    $('#mTodoCnt').textContent = good ? '5 من 5 تطبيق' : '4 من 5 تطبيق';
    $('#oTasks').innerHTML = (good ? '5' : '4') + '<small> / 5</small>';
    // certificate bars grow in, tasks reach 100% after delivery
    const g = ease(E.k(t, T.bars, T.bars + 0.9));
    const pct = good ? 100 : 80;
    $('#mTaskFill').style.width = pct * (t >= T.bars - 0.2 ? g : 1) + '%';
    $('#mTaskPct').textContent = pct + '%';
    $('#mTaskBar').classList.toggle('ok', pct >= 80);
    $('#mReady').style.opacity = t >= T.ready || t < L0(this) ? 1 : 0;
    // progress tab: weak point resolved
    $('#pgScroll').style.transform = 'translateY(-250px)';
    const res = t >= T.resolve;
    $('#wk2').classList.toggle('done', res);
    $('#wk2i').textContent = res ? '✓' : '!';
    $('#wk2l').textContent = res ? 'تم المعالجة والتغلب عليها' : 'نقطة ضعف محتاجة تطوير';
    show('#wkCount', !res); show('#wkAll', res);
    // level bar and ladder
    $('#mLvlFill').style.width = 35 * (t >= T.lvlFill - 0.2 ? ease(E.k(t, T.lvlFill, T.lvlFill + 0.9)) : 1) + '%';
    const lad = [...document.querySelectorAll('#mLadder span')];
    const idx = [0, 1, 2, 5];
    lad.forEach((s) => s.classList.remove('hi'));
    T.lad.forEach((x, i) => { if (t >= x - 0.05 && t < x + 0.7) lad[idx[i]].classList.add('hi'); });
    // profile photo
    const ph = t >= T.photo;
    document.querySelectorAll('.av.photo, #mPhAv').forEach((a) => a.classList.toggle('has', ph));
    $('#mPhOk').style.visibility = ph ? 'visible' : 'hidden';
  },

  scrollFor(b) {
    if (b.layer !== 'mot' || !b.y) return 0;
    let el = $(b.y), o = 0;
    while (el && el.id !== 'mtScroll') { o += el.offsetTop; el = el.offsetParent; }
    return Math.max(0, Math.min(o - 60, this.maxY()));
  },
  maxY() { const s = $('#mtScroll'); return Math.max(0, s.scrollHeight - 780 / 1.12 + 40); },

  render(t, E) {
    const T = this.T;
    this.state(t);
    let bi = 0;
    this.beats.forEach((b, i) => { if (t >= b.t) bi = i; });
    const beat = this.beats[bi], prevBeat = this.beats[bi - 1];
    $('#phone').style.transform = `scale(${PHONE_K})`;
    document.querySelectorAll('#screen > .layer').forEach((l) => { l.style.display = l.id === beat.layer ? 'block' : 'none'; l.style.opacity = 1; l.style.transform = 'none'; });
    const lay = document.getElementById(beat.layer);
    if (bi > 0 && prevBeat.layer !== beat.layer) {
      const x = inX(t, beat.t);
      lay.style.opacity = x; lay.style.transform = `translateY(${(1 - x) * 10}px)`;
    }
    // home scroll: glide from the last home position to this beat's
    if (beat.layer === 'mot') {
      let from = this.scrollFor(beat);
      for (let i = bi - 1; i >= 0; i--) if (this.beats[i].layer === 'mot') { from = this.scrollFor(this.beats[i]); break; }
      const to = this.scrollFor(beat);
      const y = from + (to - from) * ease(E.k(t, beat.t, beat.t + 0.6));
      $('#mtScroll').style.transform = `translateY(${-y}px)`;
    }
    const sr = $('#screen').getBoundingClientRect(), sk = sr.width / 390;
    const ring = $('#ring');
    ring.style.opacity = 0;
    const fe = beat.ring !== false && beat.focus ? lay.querySelector(beat.focus) : null;
    if (fe && fe.offsetParent) {
      const r = fe.getBoundingClientRect(), pad = 5;
      ring.style.left = (r.left - sr.left) / sk - pad + 'px'; ring.style.top = (r.top - sr.top) / sk - pad + 'px';
      ring.style.width = r.width / sk + pad * 2 + 'px'; ring.style.height = r.height / sk + pad * 2 + 'px';
      ring.style.opacity = inX(t, beat.t + 0.45) * 0.95;
    }
    const f = $('#finger'), rp = $('#ripple');
    f.style.opacity = 0; rp.style.opacity = 0;
    for (const tap of this.taps) {
      if (t < tap.t - 0.45 || t > tap.t + 0.5) continue;
      const el = $(tap.sel);
      if (!el || !el.offsetParent) continue;
      const r = el.getBoundingClientRect();
      const x = (r.left + r.width / 2 - sr.left) / sk, y = (r.top + r.height / 2 - sr.top) / sk;
      const a = ease(E.k(t, tap.t - 0.45, tap.t - 0.1));
      f.style.left = x + 'px'; f.style.top = y + (1 - a) * 18 + 'px';
      f.style.opacity = Math.min(a, 1 - E.k(t, tap.t + 0.2, tap.t + 0.45));
      f.style.transform = `scale(${t >= tap.t - 0.05 && t < tap.t + 0.1 ? 0.86 : 1})`;
      if (t >= tap.t) { const q = E.k(t, tap.t, tap.t + 0.5); rp.style.left = x + 'px'; rp.style.top = y + 'px'; rp.style.opacity = 1 - q; rp.style.transform = `scale(${1 + q * 1.4})`; }
    }
    let cur = this.heads[0];
    this.heads.forEach((b) => {
      if (t >= b.t0 && t < b.t1) cur = b;
      const first = b === this.heads[0];
      const vis = t >= b.t0 + (first ? 0 : OUT) && t < b.t1 + OUT;
      b.el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      const out = t >= b.t1 ? E.k(t, b.t1, b.t1 + OUT) : 0;
      b.parts.forEach((p, i) => {
        const x = first && t < 0.6 ? inX(t, 0.2 + i * STAG) : inX(t, b.t0 + (first ? 0 : OUT) + i * STAG);
        p.style.opacity = x * (1 - out); p.style.transform = `translateY(${(1 - x) * 18}px)`;
      });
    });
    $('#stepNum').textContent = cur.h.tag[0]; $('#stepLbl').textContent = cur.h.tag[1];
    E.pages.forEach((p) => {
      const on = t >= p.t0 && t < p.t1;
      p.el.style.display = on ? 'flex' : 'none';
      if (!on) return;
      const x = inX(t, p.t0), out = E.k(t, p.t1 - OUT, p.t1);
      p.el.style.opacity = x * (1 - out); p.el.style.transform = `translateY(${(1 - x) * 12}px)`;
      p.words.forEach((w) => { w.el.style.opacity = 1; w.el.style.transform = 'none'; w.el.classList.toggle('now', t >= w.s && t < w.e + 0.05); });
    });
    const logoIn = ease(E.k(t, 0, 20 / FPS));
    $('#logo').style.opacity = logoIn; $('#logo').style.transform = `translateY(${(1 - logoIn) * 14}px)`;
    const endIn = ease(E.k(t, T.end, T.end + 20 / FPS));
    $('#end').style.opacity = endIn; $('#end img').style.transform = `translateY(${(1 - endIn) * 14}px)`;
  },
};
// the «on track» badge shows before the certificate scene, then pops in on its word
function L0(s) { return E.L('c1').start - 0.15; }
</script>
</body>
