<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الحضور</title>
<link rel="stylesheet" href="../lib/sg.css">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  .status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 32px 0; font: 700 15px -apple-system, Plex; direction: ltr; z-index: 40; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status .batt { width: 24px; height: 12px; border: 2px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
  .status .batt::after { content: ''; position: absolute; inset: 1px 4px 1px 1px; background: currentColor; border-radius: 1px; }
  .login .status, .portal .status { color: #fff; }
  .ostats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
  .ostats div { background: #1b1718; border: 1px solid #2a2425; border-radius: 13px; padding: 9px 6px; display: grid; gap: 3px; font: 600 9px Plex; color: #9a908e; }
  .ostats b { font: 800 17px Taj; color: #fff; } .ostats small { font: 500 8px Plex; color: #7d7472; }
  .scard { border-radius: 20px; padding: 14px; margin-top: 10px; border: 1px solid rgba(239,68,68,.2); }
  .scard.up { background: linear-gradient(90deg, #0f172a, rgba(69,10,10,.55), #0f172a); }
  .scard.live { background: linear-gradient(90deg, rgba(69,10,10,.6), rgba(69,10,10,.45), #0f172a); }
  .scard .pill { font: 800 10px Plex; color: #f87171; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); border-radius: 999px; padding: 3px 10px; }
  .scard h3 { font: 800 16px/1.5 Taj; color: #fff; margin: 9px 0; }
  .scard p { font: 600 10.5px/1.7 Plex; color: #94a3b8; }
  .red { color: #f87171; } .red2 { color: #fca5a5; }
  .mgrid { display: grid; gap: 6px; }
  .mgrid div { background: rgba(10,10,10,.6); border: 1px solid #1e293b; border-radius: 13px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; }
  .mgrid small { font: 700 9.5px Plex; color: #64748b; } .mgrid b { font: 700 12px Plex; color: #e2e8f0; } .mgrid b.red { color: #f87171; } .mgrid b.red2 { color: #fca5a5; }
  .sbtns { display: grid; gap: 7px; margin-top: 10px; }
  .sb { border-radius: 14px; padding: 10px; text-align: center; font: 800 12px Plex; color: #fff; }
  .sb.red { background: #dc2626; } .sb.green { background: #059669; }
  .livetag { display: flex; align-items: center; gap: 7px; font: 800 11px Plex; color: #f87171; }
  .livetag i { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 4px rgba(248,113,113,.3); }
  .joinbtn { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 13px; border-radius: 16px; background: linear-gradient(90deg, #059669, #0d9488); color: #fff; font: 800 14px Plex; border: 1px solid rgba(52,211,153,.3); box-shadow: 0 8px 22px rgba(16,185,129,.2); }
  .joinbtn i { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .joinbtn svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2; }
  .ostats div.up { border-color: #10b981; } .ostats div.up b { color: #6ee7b7; }
  #aHome .scroll, #aLive .scroll { zoom: 1.18; }
  #aHome .home-hero p, #aLive .home-hero p { margin-bottom: 4px; }
  .ecard { zoom: 1.12; }
  #meet { background: #202124; color: #fff; font-family: Plex; }
  .mtop { position: absolute; top: 58px; left: 18px; right: 18px; display: grid; gap: 2px; direction: rtl; }
  .mtop b { font: 800 15px Taj; } .mtop span { font: 500 11px -apple-system, sans-serif; color: #9aa0a6; direction: ltr; text-align: right; }
  .share { position: absolute; top: 112px; left: 12px; right: 12px; height: 250px; border-radius: 14px; background: #3c4043; overflow: hidden; }
  .slide { position: absolute; inset: 14px 14px 34px; border-radius: 8px; background: linear-gradient(135deg, #0A0A0A, #3a1410); }
  .slide i { position: absolute; border-radius: 50%; } .slide i:nth-child(1) { width: 70px; height: 70px; background: #C4321F; left: 24px; top: 26px; }
  .slide i:nth-child(2) { width: 50px; height: 50px; background: #FF8A1F; left: 70px; top: 60px; opacity: .85; } .slide i:nth-child(3) { width: 40px; height: 40px; background: #F6F3F2; left: 40px; top: 96px; opacity: .8; }
  .slide em { position: absolute; right: 18px; top: 40px; font: 800 20px Taj; font-style: normal; color: #fff; }
  .share .who { position: absolute; bottom: 8px; left: 12px; font: 500 11px -apple-system, sans-serif; color: #e8eaed; }
  .tiles { position: absolute; top: 376px; left: 12px; right: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles div { height: 150px; border-radius: 14px; background: #3c4043; display: grid; place-items: center; position: relative; }
  .tiles b { width: 62px; height: 62px; border-radius: 50%; background: #8430ce; display: grid; place-items: center; font: 800 24px Taj; }
  .tiles div:nth-child(2) b { background: #1a73e8; } .tiles div:nth-child(3) b { background: #e37400; } .tiles div:nth-child(4) b { background: #5f6368; font-size: 18px; font-family: -apple-system, sans-serif; }
  .tiles span { position: absolute; bottom: 8px; right: 10px; font: 500 11px Plex; color: #e8eaed; }
  .mbar { position: absolute; bottom: 26px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
  .mbar i { width: 52px; height: 52px; border-radius: 50%; background: #3c4043; } .mbar i.end { width: 72px; border-radius: 26px; background: #ea4335; }
  #cam { background: #000; }
  .viewfinder { position: absolute; top: 96px; left: 0; right: 0; height: 560px; background: radial-gradient(400px 300px at 50% 40%, #4a3d34, #1e1915 70%); overflow: hidden; }
  .laptop { position: absolute; left: 22px; right: 22px; top: 70px; transform: perspective(700px) rotateX(6deg) rotateZ(-2deg); }
  .lscreen { background: #0f172a; border: 10px solid #111; border-radius: 12px 12px 4px 4px; padding: 14px 10px 16px; text-align: center; direction: rtl; }
  .lscreen p { font: 800 12px Taj; color: #818cf8; margin-bottom: 10px; }
  .qrbox { width: 172px; height: 172px; margin: 0 auto; padding: 11px; background: #020617; border-radius: 14px; border: 1px solid #1e293b; position: relative; }
  .qrbox canvas { width: 150px; height: 150px; display: block; image-rendering: pixelated; }
  .brk { position: absolute; inset: -14px; border: 3px solid #ffd60a; border-radius: 18px; opacity: 0; }
  .lscreen .active { display: inline-block; margin-top: 10px; font: 700 10px Plex; color: #34d399; background: rgba(6,78,59,.4); border-radius: 10px; padding: 4px 9px; }
  .lbase { height: 14px; margin: 0 -18px; background: linear-gradient(#3a3a3c, #1c1c1e); border-radius: 0 0 14px 14px; }
  .qchip { position: absolute; top: 590px; left: 50%; transform: translateX(-50%); background: #ffd60a; color: #000; border-radius: 12px; padding: 7px 13px; display: flex; gap: 8px; align-items: center; font: 600 13px -apple-system, sans-serif; direction: ltr; white-space: nowrap; z-index: 5; }
  .qchip b { font-weight: 800; border: 1.5px solid #000; border-radius: 4px; padding: 0 3px; font-size: 10px; }
  .cambar { position: absolute; bottom: 0; left: 0; right: 0; height: 180px; display: flex; align-items: center; justify-content: center; gap: 46px; color: #fff; font: 600 12px -apple-system, sans-serif; letter-spacing: 1px; }
  .cambar span:first-child { color: #ffd60a; } .cambar i { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: #fff; box-shadow: inset 0 0 0 3px #000; }
  .entry { background: radial-gradient(300px 300px at 100% 0%, rgba(220,38,38,.12), transparent 70%), #0a0a0a; }
  .ecard { position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); background: linear-gradient(#0f172a, #0a0a0a); border: 1px solid rgba(239,68,68,.2); border-radius: 30px; padding: 24px 18px; text-align: center; display: grid; gap: 12px; justify-items: center; direction: rtl; }
  .eic { width: 70px; height: 70px; border-radius: 22px; display: grid; place-items: center; font: 800 34px Taj; }
  .eic.ok { color: #34d399; background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
  .eic.bad { color: #f87171; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); }
  .ebadge { font: 800 10px Plex; border-radius: 999px; padding: 4px 11px; }
  .ebadge.ok { color: #34d399; background: #022c22; border: 1px solid #064e3b; } .ebadge.bad { color: #ef4444; background: #450a0a; border: 1px solid #7f1d1d; }
  .ecard h2 { font: 800 22px/1.5 Taj; color: #fff; } .ecard.bad h2 { font-size: 18px; }
  .ecard > p { font: 700 13px/1.7 Plex; color: #94a3b8; }
  .etable, .etips { width: 100%; background: rgba(15,23,42,.7); border: 1px solid #1e293b; border-radius: 16px; padding: 12px; text-align: right; display: grid; gap: 8px; }
  .etable div { display: flex; justify-content: space-between; font: 700 11px Plex; } .etable span { color: #64748b; } .etable b { color: #e2e8f0; } .etable b.red2 { color: #f87171; }
  .etips p { font: 600 11px/1.7 Plex; color: #cbd5e1; } .etips b { color: #fff; }
  .etips p + p { border-top: 1px solid rgba(30,41,59,.6); padding-top: 8px; }
</style>
</head>
<body>
<!--#include ../lib/icons.svg.html-->
<div id="stage" class="layoutB">
  <svg id="corners" width="1080" height="1920" viewBox="0 0 1080 1920"><g fill="none" stroke-width="2"><path stroke="#FF8A1F" d="M86 140v-37l17-17h37"/><path stroke="#C4321F" d="M994 1780v37l-17 17h-37"/></g></svg>
  <div id="logo"><img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP"></div>
  <div id="stepTag"><b id="stepNum">✓</b><span id="stepLbl">ATTENDANCE</span></div>
  <div id="head"></div>

  <div id="phone"><div id="screen">
    <div class="notch"></div>
<!--#include ../lib/screens.telegram.html-->
<!--#include ../lib/screens.attend.html-->
    <div id="ring"></div><div class="tapring" id="ripple"></div><div class="tapdot" id="finger"></div>
  </div></div>

  <div id="cap"></div>
  <div id="foot"><span class="url">portal.sabergroupacademy.com</span><span class="lbl">SABER GROUP ACADEMY</span></div>

  <div id="end">
    <img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP">
    <h2>بوابة الطالب</h2>
    <div class="sub">ادخل المحاضرة من البوابة… وحضورك يتسجّل</div>
    <div class="rule"></div>
    <p>portal.sabergroupacademy.com</p>
  </div>
</div>

<script src="../lib/engine.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const show = (sel, on) => { const el = $(sel); el.style.display = on ? '' : 'none'; return el; };
const FPS = 25, IN = 12 / FPS, OUT = 8 / FPS, STAG = 2 / FPS, PHONE_K = 1.3;
function bez(x1, y1, x2, y2) {
  return (x) => { let t = x; for (let i = 0; i < 6; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x; const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; t = Math.min(1, Math.max(0, t)); } return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const ease = bez(0.16, 1, 0.3, 1);
const inX = (t, t0) => ease(Math.min(1, Math.max(0, (t - t0) / IN)));

const HEADS = {
  h:  { tag: ['✓', 'ATTENDANCE'], eyebrow: 'ATTENDANCE', title: 'حضورك بيتسجّل لوحده', sub: 'بس ادخل صح' },
  o1: { tag: ['01', 'ONLINE'], eyebrow: 'NEXT LECTURE', title: 'المحاضرة القادمة', sub: 'الميعاد واسم المدرب' },
  o2: { tag: ['01', 'ONLINE'], eyebrow: 'LIVE NOW', title: 'ادخل المحاضرة الآن', sub: 'وحضورك يتسجّل لوحده' },
  o3: { tag: ['!', 'TIP'], eyebrow: 'ALWAYS', title: 'من البوابة دايماً', sub: 'مش من لينك برّه' },
  q1: { tag: ['02', 'QR'], eyebrow: 'QR CODE', title: 'صوّر الكود', sub: 'وحضورك يتسجّل على طول' },
  q2: { tag: ['02', 'QR'], eyebrow: 'TIME LIMIT', title: 'صالح لوقت محدود', sub: 'لو خلص… اطلب كود جديد' },
};

function drawQR() {
  const c = $('#qr'), x = c.getContext('2d'), N = 29, s = 150 / N;
  let seed = 2614; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  x.fillStyle = '#0f172a'; x.fillRect(0, 0, 150, 150); x.fillStyle = '#fff';
  const finder = (cx, cy) => (px, py) => { const dx = px - cx, dy = py - cy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; const r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3)); return r !== 2; };
  const fs = [finder(0, 0), finder(N - 7, 0), finder(0, N - 7)];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    let on = null; for (const f of fs) { const v = f(i, j); if (v !== null) on = v; }
    const nearF = fs.some((f, k) => { const cx = [0, N - 7, 0][k], cy = [0, 0, N - 7][k]; return i >= cx - 1 && i <= cx + 7 && j >= cy - 1 && j <= cy + 7; });
    if (on === null) on = nearF ? false : rnd() < 0.48;
    if (on) x.fillRect(i * s, j * s, Math.ceil(s), Math.ceil(s));
  }
}

window.SCENE = {
  setup(E) {
    drawQR();
    const W = E.W, L = E.L, T = (this.T = {});
    const head = $('#head');
    this.heads = Object.entries(HEADS).map(([id, h]) => {
      const el = document.createElement('div');
      el.className = 'blk';
      el.innerHTML = `<div class="eyebrow">${h.eyebrow}</div><h1>${h.title}</h1><p>${h.sub}</p><div class="rule"></div>`;
      head.appendChild(el);
      return { id, el, h, parts: [...el.children], t0: L(id).start - 0.15 };
    });
    this.heads.forEach((b, i) => (b.t1 = this.heads[i + 1] ? this.heads[i + 1].t0 : E.tl.outro_start));
    T.tapJoin = W('o2', 4) + 0.1;
    T.att = W('o2', 9) - 0.1;
    T.scan = W('q1', 5);
    T.ok = W('q1', 8) - 0.1;
    T.end = E.tl.outro_start;
    this.beats = [
      { t: 0, layer: 'aHome', focus: '#stAtt', ring: false },
      { t: W('h', 0) + 0.2, layer: 'aHome', focus: '#stAtt' },
      { t: L('o1').start - 0.15, layer: 'aHome', focus: '#nextCard' },
      { t: W('o1', 9) - 0.1, layer: 'aHome', focus: '#nextMeta' },
      { t: L('o2').start - 0.15, layer: 'aLive', focus: '#liveTag' },
      { t: T.tapJoin - 0.5, layer: 'aLive', focus: '#bJoin' },
      { t: W('o2', 7) - 0.1, layer: 'meet', focus: '.share', ring: false },
      { t: T.att, layer: 'aLive', focus: '#stAtt2' },
      { t: L('o3').start - 0.15, layer: 'aLive', focus: '#bJoin' },
      { t: L('q1').start - 0.15, layer: 'cam', focus: '#qrBox', ring: false },
      { t: T.scan + 0.3, layer: 'cam', focus: '#qChip' },
      { t: T.ok, layer: 'qrOk', focus: '#okBadge' },
      { t: L('q2').start - 0.15, layer: 'qrErr', focus: '#errBadge' },
      { t: W('q2', 8) - 0.1, layer: 'qrErr', focus: '#errTip' },
    ];
    this.taps = [{ t: T.tapJoin, sel: '#bJoin' }, { t: T.scan + 0.6, sel: '#qChip' }];
    this.taps.forEach((p) => E.ev(p.t, 'tap'));
    E.ev(T.att, 'pop'); E.ev(T.scan, 'ding'); E.ev(T.ok, 'success');
  },

  state(t) {
    const T = this.T, done = t >= T.att;
    $('#attPct').textContent = '100%'; $('#attCnt').textContent = done ? '3 من 3 محاضرة' : '2 من 2 محاضرة';
    $('#stAtt2').classList.toggle('up', done && t < E.L('q1').start);
    const sc = inX(t, T.scan);
    $('#qrBrk').style.opacity = sc; $('#qrBrk').style.transform = `scale(${1.15 - 0.15 * sc})`;
    const ch = inX(t, T.scan + 0.15);
    $('#qChip').style.opacity = ch; $('#qChip').style.transform = `translateX(-50%) translateY(${(1 - ch) * 10}px)`;
  },

  render(t, E) {
    const T = this.T;
    this.state(t);

    let bi = 0;
    this.beats.forEach((b, i) => { if (t >= b.t) bi = i; });
    const beat = this.beats[bi], prevBeat = this.beats[bi - 1];
    $('#phone').style.transform = `scale(${PHONE_K})`;
    document.querySelectorAll('#screen > .layer').forEach((l) => { l.style.display = l.id === beat.layer ? 'block' : 'none'; l.style.opacity = 1; l.style.transform = 'none'; });
    const lay = document.getElementById(beat.layer);
    if (bi > 0 && prevBeat.layer !== beat.layer) {
      const x = inX(t, beat.t);
      lay.style.opacity = x; lay.style.transform = `translateY(${(1 - x) * 10}px)`;
    }
    const sr = $('#screen').getBoundingClientRect(), sk = sr.width / 390;
    // orange ring on what the voice talks about
    const ring = $('#ring');
    ring.style.opacity = 0;
    const fe = beat.ring !== false && beat.focus ? lay.querySelector(beat.focus) : null;
    if (fe && fe.offsetParent) {
      const r = fe.getBoundingClientRect(), pad = 5;
      ring.style.left = (r.left - sr.left) / sk - pad + 'px'; ring.style.top = (r.top - sr.top) / sk - pad + 'px';
      ring.style.width = r.width / sk + pad * 2 + 'px'; ring.style.height = r.height / sk + pad * 2 + 'px';
      ring.style.opacity = inX(t, beat.t + 0.2) * 0.95;
    }
    // taps
    const f = $('#finger'), rp = $('#ripple');
    f.style.opacity = 0; rp.style.opacity = 0;
    for (const tap of this.taps) {
      if (t < tap.t - 0.45 || t > tap.t + 0.5) continue;
      const el = $(tap.sel);
      if (!el || !el.offsetParent) continue;
      const r = el.getBoundingClientRect();
      const x = (r.left + r.width / 2 - sr.left) / sk, y = (r.top + r.height / 2 - sr.top) / sk;
      const a = ease(E.k(t, tap.t - 0.45, tap.t - 0.1));
      f.style.left = x + 'px'; f.style.top = y + (1 - a) * 18 + 'px';
      f.style.opacity = Math.min(a, 1 - E.k(t, tap.t + 0.2, tap.t + 0.45));
      f.style.transform = `scale(${t >= tap.t - 0.05 && t < tap.t + 0.1 ? 0.86 : 1})`;
      if (t >= tap.t) { const q = E.k(t, tap.t, tap.t + 0.5); rp.style.left = x + 'px'; rp.style.top = y + 'px'; rp.style.opacity = 1 - q; rp.style.transform = `scale(${1 + q * 1.4})`; }
    }

    // head blocks: old exits (8f), then new enters (12f, 2f stagger)
    let cur = this.heads[0];
    this.heads.forEach((b) => {
      if (t >= b.t0 && t < b.t1) cur = b;
      const first = b === this.heads[0];
      const vis = t >= b.t0 + (first ? 0 : OUT) && t < b.t1 + OUT;
      b.el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      const out = t >= b.t1 ? E.k(t, b.t1, b.t1 + OUT) : 0;
      b.parts.forEach((p, i) => {
        const x = first && t < 0.6 ? inX(t, 0.2 + i * STAG) : inX(t, b.t0 + (first ? 0 : OUT) + i * STAG);
        p.style.opacity = x * (1 - out); p.style.transform = `translateY(${(1 - x) * 18}px)`;
      });
    });
    $('#stepNum').textContent = cur.h.tag[0]; $('#stepLbl').textContent = cur.h.tag[1];

    // captions
    E.pages.forEach((p) => {
      const on = t >= p.t0 && t < p.t1;
      p.el.style.display = on ? 'flex' : 'none';
      if (!on) return;
      const x = inX(t, p.t0), out = E.k(t, p.t1 - OUT, p.t1);
      p.el.style.opacity = x * (1 - out); p.el.style.transform = `translateY(${(1 - x) * 12}px)`;
      p.words.forEach((w) => { w.el.style.opacity = 1; w.el.style.transform = 'none'; w.el.classList.toggle('now', t >= w.s && t < w.e + 0.05); });
    });

    const logoIn = ease(E.k(t, 0, 20 / FPS));
    $('#logo').style.opacity = logoIn; $('#logo').style.transform = `translateY(${(1 - logoIn) * 14}px)`;
    const endIn = ease(E.k(t, T.end, T.end + 20 / FPS));
    $('#end').style.opacity = endIn; $('#end img').style.transform = `translateY(${(1 - endIn) * 14}px)`;
  },
};
</script>
</body>
