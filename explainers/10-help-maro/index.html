<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>المساعدة ومارو</title>
<link rel="stylesheet" href="../lib/sg.css">
<link rel="stylesheet" href="../lib/ui.css">
<style>
  .status { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 32px 0; font: 700 15px -apple-system, Plex; direction: ltr; z-index: 40; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status .batt { width: 24px; height: 12px; border: 2px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
  .status .batt::after { content: ''; position: absolute; inset: 1px 4px 1px 1px; background: currentColor; border-radius: 1px; }
  .login .status, .portal .status { color: #fff; }
  .ostats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; }
  .ostats div { background: #1b1718; border: 1px solid #2a2425; border-radius: 13px; padding: 9px 6px; display: grid; gap: 3px; font: 600 9px Plex; color: #9a908e; }
  .ostats b { font: 800 17px Taj; color: #fff; } .ostats small { font: 500 8px Plex; color: #7d7472; }
  #gHome .scroll { zoom: 1.18; }
  #help .scroll { zoom: 1.2; }
  .hc { background: linear-gradient(135deg, #0f172a, #0a0a0a); border: 1px solid #1e293b; border-radius: 20px; padding: 12px; margin-bottom: 10px; display: grid; gap: 6px; }
  .hk { justify-self: start; font: 800 9px Plex; border-radius: 999px; padding: 3px 9px; }
  .hk.grn { background: rgba(16,185,129,.15); color: #34d399; } .hk.red { background: rgba(239,68,68,.15); color: #f87171; } .hk.amb { background: rgba(245,158,11,.15); color: #fbbf24; }
  .hc h3 { font: 800 14.5px Taj; color: #fff; } .hc p { font: 500 10px/1.7 Plex; color: #94a3b8; }
  .hb { justify-self: stretch; text-align: center; display: flex; gap: 6px; justify-content: center; align-items: center; font: 800 11px Plex; color: #fff; border-radius: 12px; padding: 9px; }
  .hb.grn { background: #059669; } .hb.red { background: #dc2626; } .hb svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2; }
  .hb2 { display: block; text-align: center; font: 800 10.5px Plex; color: #e2e8f0; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 9px; }
  .mfab { position: absolute; left: 14px; bottom: 86px; width: 96px; display: grid; justify-items: center; z-index: 30; }
  .mfab img { height: 120px; } .mfab span { margin-top: -8px; font: 800 9px Plex; letter-spacing: 1px; color: #fff; background: #e2361d; border-radius: 99px; padding: 1px 9px; }
  .mbub { position: absolute; left: 100px; bottom: 170px; width: 190px; background: #fff; color: #0f172a; font: 700 11px/1.6 Plex; border-radius: 16px 16px 16px 4px; padding: 9px 11px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #maro { background: #0b0909; }
  .mpanel { position: absolute; inset: 56px 10px 14px; border: 1px solid #2a2425; border-radius: 26px; background: #141112; display: flex; flex-direction: column; overflow: hidden; }
  .mhead { zoom: 1.15; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #2a2425; background: linear-gradient(90deg, rgba(226,54,29,.18), transparent); }
  .mhead img { height: 58px; } .mhead b { display: block; font: 800 18px Taj; color: #fff; } .mhead small { font: 600 11px Plex; color: #9a908e; display: flex; gap: 6px; align-items: center; }
  .mhead small i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; } .mhead .x { margin-right: auto; color: #9a908e; font: 700 14px Plex; }
  .mbody { zoom: 1.3; flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .mempty { font: 700 13px/1.8 Plex; color: #c9c0be; text-align: center; margin-top: 30px; }
  .mmsg { max-width: 86%; border-radius: 18px; padding: 10px 13px; font: 600 13px/1.75 Plex; }
  .mmsg.me { align-self: flex-start; background: #c4321f; color: #fff; border-bottom-right-radius: 6px; }
  .mmsg.bot { align-self: flex-end; background: #231d1e; color: #f3eeec; border: 1px solid #2f2829; border-bottom-left-radius: 6px; }
  .mmsg.bot b { color: #fdba74; } .mmsg small { display: block; margin-top: 6px; font: 600 10.5px Plex; color: #8d8482; }
  .think { display: flex; gap: 8px; align-items: center; color: #9a908e; } .dots { display: flex; gap: 3px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fb923c; }
  .mfoot { padding: 10px 12px 12px; border-top: 1px solid #2a2425; }
  .mform { display: flex; gap: 8px; align-items: center; } .ta { flex: 1; height: 42px; border-radius: 14px; background: #0b0909; border: 1px solid #3a3132; display: flex; align-items: center; padding: 0 12px; font: 600 13px Plex; color: #fff; position: relative; }
  .ta .tph { position: absolute; right: 12px; color: #6f6564; } .ta .caret { width: 2px; height: 18px; background: #fb923c; display: inline-block; opacity: 0; }
  .send { width: 42px; height: 42px; border-radius: 14px; background: #e2361d; display: grid; place-items: center; } .send svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; transform: scaleX(-1); }
  .mnote { font: 700 12.5px/1.6 Plex; color: #8d8482; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<!--#include ../lib/icons.svg.html-->
<div id="stage" class="layoutB">
  <svg id="corners" width="1080" height="1920" viewBox="0 0 1080 1920"><g fill="none" stroke-width="2"><path stroke="#FF8A1F" d="M86 140v-37l17-17h37"/><path stroke="#C4321F" d="M994 1780v37l-17 17h-37"/></g></svg>
  <div id="logo"><img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP"></div>
  <div id="stepTag"><b id="stepNum">?</b><span id="stepLbl">HELP</span></div>
  <div id="head"></div>

  <div id="phone"><div id="screen">
    <div class="notch"></div>
<!--#include ../lib/screens.progress.html-->
<!--#include ../lib/screens.help.html-->
    <div id="ring"></div><div class="tapring" id="ripple"></div><div class="tapdot" id="finger"></div>
  </div></div>

  <div id="cap"></div>
  <div id="foot"><span class="url">portal.sabergroupacademy.com</span><span class="lbl">SABER GROUP ACADEMY</span></div>

  <div id="end">
    <img src="../assets/kit/logos/saber-group-wordmark.png" alt="SABER GROUP">
    <h2>بوابة الطالب</h2>
    <div class="sub">مش لوحدك… إحنا معاك</div>
    <div class="rule"></div>
    <p>portal.sabergroupacademy.com</p>
  </div>
</div>

<script src="../lib/engine.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const show = (sel, on) => { const el = $(sel); el.style.display = on ? '' : 'none'; return el; };
const FPS = 25, IN = 12 / FPS, OUT = 8 / FPS, STAG = 2 / FPS, PHONE_K = 1.3;
function bez(x1, y1, x2, y2) {
  return (x) => { let t = x; for (let i = 0; i < 6; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x; const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; t = Math.min(1, Math.max(0, t)); } return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const ease = bez(0.16, 1, 0.3, 1);
const inX = (t, t0) => ease(Math.min(1, Math.max(0, (t - t0) / IN)));

const HEADS = {
  h:  { tag: ['?', 'HELP'], eyebrow: 'HELP TAB', title: 'تاب المساعدة', sub: 'كل اللينكات اللي تحتاجها' },
  l1: { tag: ['01', 'LINKS'], eyebrow: 'GROUPS & REPORTS', title: 'لينكاتك', sub: 'الواتس… الريكوردات… التقرير… بياناتك' },
  m1: { tag: ['02', 'MARO'], eyebrow: 'AI ASSISTANT', title: 'مارو', sub: 'المساعد الذكي… في أي صفحة' },
  q1: { tag: ['03', 'ASK'], eyebrow: 'ASK MARO', title: 'اسأله', sub: 'وبيرد من بياناتك إنت بس' },
  n1: { tag: ['04', 'NOTE'], eyebrow: 'READ ONLY', title: 'بيقرا بس', sub: 'والأرقام المهمة… راجعها بنفسك' },
};
const Q = 'عليا تاسكات ناقصة؟';

window.SCENE = {
  setup(E) {
    const W = E.W, L = E.L, T = (this.T = {});
    const head = $('#head');
    this.heads = Object.entries(HEADS).map(([id, h]) => {
      const el = document.createElement('div');
      el.className = 'blk';
      el.innerHTML = `<div class="eyebrow">${h.eyebrow}</div><h1>${h.title}</h1>${h.sub ? `<p>${h.sub}</p>` : ''}<div class="rule"></div>`;
      head.appendChild(el);
      return { id, el, h, parts: [...el.children], t0: L(id).start - 0.15 };
    });
    this.heads.forEach((b, i) => (b.t1 = this.heads[i + 1] ? this.heads[i + 1].t0 : E.tl.outro_start));
    T.tabTap = W('h', 3) - 0.1; T.help = W('h', 3) + 0.3;
    T.scroll = W('l1', 4) - 0.2;
    T.bub = L('m1').start - 0.1;
    T.fabTap = W('m1', 6) + 0.1; T.panel = T.fabTap + 0.4;
    T.type0 = W('q1', 1) - 0.05; T.type1 = W('q1', 3) + 0.2; T.send = T.type1 + 0.15;
    T.ans = W('q1', 6) + 0.1;
    T.end = E.tl.outro_start;
    this.beats = [
      { t: 0, layer: 'gHome', focus: '#navHelp', ring: false },
      { t: W('h', 2) - 0.15, layer: 'gHome', focus: '#navHelp' },
      { t: T.help, layer: 'help', focus: '#hWa', ring: false },
      { t: L('l1').start - 0.1, layer: 'help', focus: '#hWa' },
      { t: W('l1', 2) - 0.1, layer: 'help', focus: '#hRec' },
      { t: W('l1', 4) + 0.3, layer: 'help', focus: '#hRep' },
      { t: W('l1', 7) - 0.1, layer: 'help', focus: '#hMe' },
      { t: W('m1', 3) - 0.1, layer: 'help', focus: '#mFab' },
      { t: T.panel, layer: 'maro', focus: '#mTa', ring: false },
      { t: T.type0, layer: 'maro', focus: '#mTa' },
      { t: T.send + 0.1, layer: 'maro', focus: '#mQ', ring: false },
      { t: T.ans + 0.1, layer: 'maro', focus: '#mA' },
      { t: W('q1', 9) - 0.1, layer: 'maro', focus: '#mUsed' },
      { t: L('n1').start - 0.1, layer: 'maro', focus: '#mNote' },
    ];
    this.taps = [{ t: T.tabTap, sel: '#navHelp' }, { t: T.fabTap, sel: '#mFab img' }];
    this.taps.forEach((p) => E.ev(p.t, 'tap'));
    for (let i = 0; i < 6; i++) E.ev(T.type0 + 0.08 + i * 0.13, 'key');
    E.ev(T.send, 'whoosh'); E.ev(T.ans, 'ding'); E.ev(T.bub, 'pop');
  },

  state(t) {
    const T = this.T;
    $('#hpScroll').style.transform = `translateY(${-125 * ease(E.k(t, T.scroll, T.scroll + 0.6))}px)`;
    const b = ease(E.k(t, T.bub, T.bub + 0.4));
    $('#mBub').style.opacity = b; $('#mBub').style.transform = `scale(${0.85 + 0.15 * b})`; $('#mBub').style.transformOrigin = '0 100%';
    $('#mFab').style.transform = `translateY(${Math.sin(t * 2.4) * 4}px)`;
    // chat
    const n = Math.round(Q.length * E.k(t, T.type0, T.type1));
    const sent = t >= T.send;
    $('#mTyped').textContent = sent ? '' : Q.slice(0, n);
    $('#mPh').style.display = n && !sent ? 'none' : '';
    $('#mCaret').style.opacity = t >= T.type0 && !sent ? (Math.floor(t * 2.5) % 2 ? 0 : 1) : 0;
    show('#mEmpty', !sent); show('#mQ', sent); show('#mThink', sent && t < T.ans); show('#mA', t >= T.ans);
    $('#mSub').textContent = sent && t < T.ans ? 'بجيب تاسكاتك…' : 'المساعد الذكي · نص فقط';
    $('#mFace').src = '../assets/maro/' + (sent && t < T.ans ? 'thinking' : t >= T.ans ? 'solved' : 'happy') + '.webp';
    document.querySelectorAll('#mThink .dots i').forEach((d, i) => (d.style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin(t * 8 - i * 0.9))));
  },

  render(t, E) {
    const T = this.T;
    this.state(t);

    let bi = 0;
    this.beats.forEach((b, i) => { if (t >= b.t) bi = i; });
    const beat = this.beats[bi], prevBeat = this.beats[bi - 1];
    $('#phone').style.transform = `scale(${PHONE_K})`;
    document.querySelectorAll('#screen > .layer').forEach((l) => { l.style.display = l.id === beat.layer ? 'block' : 'none'; l.style.opacity = 1; l.style.transform = 'none'; });
    const lay = document.getElementById(beat.layer);
    if (bi > 0 && prevBeat.layer !== beat.layer) {
      const x = inX(t, beat.t);
      lay.style.opacity = x; lay.style.transform = `translateY(${(1 - x) * 10}px)`;
    }
    const sr = $('#screen').getBoundingClientRect(), sk = sr.width / 390;
    // orange ring on what the voice talks about
    const ring = $('#ring');
    ring.style.opacity = 0;
    const fe = beat.ring !== false && beat.focus ? lay.querySelector(beat.focus) : null;
    if (fe && fe.offsetParent) {
      const r = fe.getBoundingClientRect(), pad = 5;
      ring.style.left = (r.left - sr.left) / sk - pad + 'px'; ring.style.top = (r.top - sr.top) / sk - pad + 'px';
      ring.style.width = r.width / sk + pad * 2 + 'px'; ring.style.height = r.height / sk + pad * 2 + 'px';
      ring.style.opacity = inX(t, beat.t + 0.2) * 0.95;
    }
    // taps
    const f = $('#finger'), rp = $('#ripple');
    f.style.opacity = 0; rp.style.opacity = 0;
    for (const tap of this.taps) {
      if (t < tap.t - 0.45 || t > tap.t + 0.5) continue;
      const el = $(tap.sel);
      if (!el || !el.offsetParent) continue;
      const r = el.getBoundingClientRect();
      const x = (r.left + r.width / 2 - sr.left) / sk, y = (r.top + r.height / 2 - sr.top) / sk;
      const a = ease(E.k(t, tap.t - 0.45, tap.t - 0.1));
      f.style.left = x + 'px'; f.style.top = y + (1 - a) * 18 + 'px';
      f.style.opacity = Math.min(a, 1 - E.k(t, tap.t + 0.2, tap.t + 0.45));
      f.style.transform = `scale(${t >= tap.t - 0.05 && t < tap.t + 0.1 ? 0.86 : 1})`;
      if (t >= tap.t) { const q = E.k(t, tap.t, tap.t + 0.5); rp.style.left = x + 'px'; rp.style.top = y + 'px'; rp.style.opacity = 1 - q; rp.style.transform = `scale(${1 + q * 1.4})`; }
    }

    // head blocks: old exits (8f), then new enters (12f, 2f stagger)
    let cur = this.heads[0];
    this.heads.forEach((b) => {
      if (t >= b.t0 && t < b.t1) cur = b;
      const first = b === this.heads[0];
      const vis = t >= b.t0 + (first ? 0 : OUT) && t < b.t1 + OUT;
      b.el.style.display = vis ? 'block' : 'none';
      if (!vis) return;
      const out = t >= b.t1 ? E.k(t, b.t1, b.t1 + OUT) : 0;
      b.parts.forEach((p, i) => {
        const x = first && t < 0.6 ? inX(t, 0.2 + i * STAG) : inX(t, b.t0 + (first ? 0 : OUT) + i * STAG);
        p.style.opacity = x * (1 - out); p.style.transform = `translateY(${(1 - x) * 18}px)`;
      });
    });
    $('#stepNum').textContent = cur.h.tag[0]; $('#stepLbl').textContent = cur.h.tag[1];

    // captions
    E.pages.forEach((p) => {
      const on = t >= p.t0 && t < p.t1;
      p.el.style.display = on ? 'flex' : 'none';
      if (!on) return;
      const x = inX(t, p.t0), out = E.k(t, p.t1 - OUT, p.t1);
      p.el.style.opacity = x * (1 - out); p.el.style.transform = `translateY(${(1 - x) * 12}px)`;
      p.words.forEach((w) => { w.el.style.opacity = 1; w.el.style.transform = 'none'; w.el.classList.toggle('now', t >= w.s && t < w.e + 0.05); });
    });

    const logoIn = ease(E.k(t, 0, 20 / FPS));
    $('#logo').style.opacity = logoIn; $('#logo').style.transform = `translateY(${(1 - logoIn) * 14}px)`;
    const endIn = ease(E.k(t, T.end, T.end + 20 / FPS));
    $('#end').style.opacity = endIn; $('#end img').style.transform = `translateY(${(1 - endIn) * 14}px)`;
  },
};
</script>
</body>
</html>
