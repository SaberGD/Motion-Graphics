<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>HORIX Super Intelligence</title>
<style>
@font-face { font-family: 'Cairo'; font-weight: 400; src: url('assets/fonts/cairo-arabic-400-normal.woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFC, U+200C-200F; }
@font-face { font-family: 'Cairo'; font-weight: 800; src: url('assets/fonts/cairo-arabic-800-normal.woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFC, U+200C-200F; }
@font-face { font-family: 'Cairo'; font-weight: 400; src: url('assets/fonts/cairo-latin-400-normal.woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Cairo'; font-weight: 800; src: url('assets/fonts/cairo-latin-800-normal.woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Inter'; font-weight: 400; src: url('assets/fonts/inter-latin-400-normal.woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-latin-600-normal.woff2'); }
@font-face { font-family: 'Barlow'; font-weight: 800; src: url('assets/fonts/barlow-condensed-latin-800-normal.woff2'); }
/* HORIX brand guide (apps/sg-ps/brand/HORIX-Brand-Guide.md) */
:root { --ink: #141314; --graphite: #2A2727; --ivory: #F3EFE8; --red: #D63C32; --amber: #EA993F; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
body { font-family: 'Cairo', sans-serif; color: var(--ivory); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
.scene { position: absolute; inset: 0; overflow: hidden; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform-origin: 50% 50%; }

/* headline: Cairo 800, RTL; *word in Horix Red */
.hl { position: absolute; display: flex; gap: 0 22px; flex-wrap: wrap; white-space: nowrap; font-weight: 800; font-size: 76px; line-height: 1.25; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
.hl .w { display: inline-block; will-change: transform, opacity; }
.hl .em { color: var(--red); }
.hl.lat { direction: ltr; font-family: 'Barlow', 'Cairo', sans-serif; letter-spacing: 2px; }
.hl.podium { left: 0; right: 0; justify-content: center; top: 862px; font-size: 64px; }

/* product name outside the screenshot */
.pname { position: absolute; left: 96px; top: 64px; direction: ltr; font: 800 46px 'Barlow'; letter-spacing: 2px; text-transform: uppercase; }
.pname i { display: inline-block; width: 46px; height: 6px; background: var(--red); vertical-align: middle; margin-left: 16px; }

/* real screenshot, locked as one layer: straight-on, never redrawn */
.card { position: absolute; left: 50%; top: 128px; width: 1280px; height: 720px; margin-left: -640px; transform-origin: 50% 50%; }
.shot { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 40px 90px -20px rgba(0,0,0,.85), 0 0 0 2px rgba(243,239,232,.10); background: #111; }
.shot img { display: block; width: 1280px; height: 720px; }
.ph { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: repeating-linear-gradient(45deg, #1d1b1c 0 24px, #232122 24px 48px); font-family: 'Inter'; direction: ltr; }
.ph b { font: 800 90px 'Barlow'; color: var(--amber); }
.ph span { font-size: 30px; } .ph small { font-size: 20px; opacity: .6; }

/* external callouts: labelled detail lens and outline frame (graphics on top of the shot, not app UI) */
.lens { position: absolute; border-radius: 12px; overflow: hidden; border: 3px solid var(--amber); box-shadow: 0 30px 70px rgba(0,0,0,.8); background: #111; }
.lens img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tag { position: absolute; padding: 6px 14px; border-radius: 6px; background: var(--ink); border: 2px solid var(--amber); color: var(--ivory); font: 800 24px 'Cairo'; white-space: nowrap; }
.frm { position: absolute; border: 3px solid var(--amber); border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,0); }
.badge { position: absolute; padding: 8px 18px; border-radius: 999px; background: rgba(20,19,20,.85); border: 2px solid rgba(243,239,232,.25); font: 800 24px 'Cairo'; }
.pill { position: absolute; direction: ltr; font: 800 40px 'Barlow'; letter-spacing: 3px; color: var(--amber); }

/* S01 */
.trail { position: absolute; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--red) 30%, #ff6a4d 50%, var(--red) 70%, transparent); box-shadow: 0 0 18px rgba(214,60,50,.8); }
/* logos: the brand's own SVG files, unchanged */
.logo { position: absolute; left: 50%; }
.logo img { display: block; width: 100%; height: 100%; }

/* S08 family */
.fam { position: absolute; width: 300px; height: 169px; margin: -84px 0 0 -150px; left: 50%; top: 50%; }
.fam .shot { border-radius: 8px; }
.fam .shot img { width: 300px; height: 169px; }
.fam .ph b { font-size: 40px; } .fam .ph span, .fam .ph small { display: none; }
.fam .lab { position: absolute; left: 0; right: 0; top: 182px; text-align: center; direction: ltr; font: 800 28px 'Barlow'; letter-spacing: 2px; text-transform: uppercase; }
.title { position: absolute; left: 0; right: 0; text-align: center; direction: ltr; font: 800 84px 'Barlow'; letter-spacing: 4px; }
.title span { color: var(--red); }

/* S09 */
.cta { position: absolute; left: 0; right: 0; text-align: center; }
.cta.si { font: 800 46px 'Barlow'; letter-spacing: 8px; direction: ltr; }
.cta.url { font: 600 84px 'Inter'; direction: ltr; letter-spacing: 1px; }
.cta.sub { font: 400 36px 'Cairo'; color: #d9d4cc; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="timeline.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
