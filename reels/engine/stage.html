<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(../../project/fonts/Cairo.ttf);font-weight:200 1000}
@font-face{font-family:Alex;src:url(../../project/fonts/Alexandria.ttf);font-weight:100 900}
@font-face{font-family:Poppins;src:url(../../project/fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Poppins;src:url(../../project/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Bebas;src:url(../../project/fonts/BebasNeue-Regular.ttf)}
:root{
  --bg:#070707; --ink:#0c0b0b; --red:#D83B25; --red2:#8F2017; --org:#FF8A1F; --org2:#FFA34D; --amber:#FFC36B;
  --cream:#F6F3F2; --muted:#A9A8AE; --glow:rgba(255,122,30,.55); --glass:rgba(16,14,13,.62); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo,Poppins,sans-serif;color:#fff}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.abs{position:absolute}
.L{position:absolute;inset:0}
/* --- brand chrome --- */
#logo{position:absolute;top:112px;left:60px;width:310px;opacity:.92;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
#prog{position:absolute;top:0;right:0;height:7px;background:linear-gradient(270deg,var(--red),var(--org));box-shadow:0 0 18px var(--glow)}
/* --- captions --- */
#cap{position:absolute;left:90px;right:90px;top:1190px;display:flex;justify-content:center;flex-wrap:wrap;direction:rtl;gap:0 20px;
  font-family:Cairo;font-weight:900;font-size:76px;line-height:1.28;text-align:center}
#cap .w{display:inline-block;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.65);will-change:transform,filter,opacity;white-space:nowrap}
#cap .w.hl{color:var(--org);text-shadow:0 0 26px rgba(255,120,20,.55),0 3px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.6)}
#cap .w.lat{font-family:Poppins;font-weight:600;font-size:.86em;letter-spacing:-.5px}
/* --- kinetic full-screen scenes --- */
.kin{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.kin .blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
.kin .grid{position:absolute;inset:-40px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:72px 72px}
.kin .noise{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.kline{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:baseline;gap:0 26px;direction:rtl;flex-wrap:nowrap;padding:0 90px;text-align:center}
.kw{display:inline-block;white-space:nowrap;will-change:transform,filter,opacity}
.kw.hl{color:var(--org);text-shadow:0 0 34px rgba(255,120,20,.6)}
.kw.lat{font-family:Poppins;font-weight:600}
.dots{position:absolute;height:6px;background-image:radial-gradient(circle,var(--org) 2px,transparent 2.6px);background-size:12px 6px;background-repeat:repeat-x}
/* --- glass components --- */
.glass{background:var(--glass);border:2px solid rgba(255,160,90,.55);border-radius:26px;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 0 38px rgba(255,110,25,.28),0 24px 60px rgba(0,0,0,.5)}
.chip{position:absolute;display:flex;align-items:center;gap:14px;direction:rtl;font-family:Cairo;font-weight:800;font-size:42px;padding:10px 26px 12px 22px;border-radius:999px;white-space:nowrap;
  background:rgba(14,12,11,.72);border:2px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.chip .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--org),var(--red));font-family:Poppins;font-weight:600;font-size:24px;color:#fff;box-shadow:0 0 18px var(--glow)}
.chip.on{border-color:var(--org);box-shadow:0 0 30px rgba(255,120,20,.5),0 10px 30px rgba(0,0,0,.45)}
.chip.title{background:linear-gradient(270deg,var(--red),#B5301E);border-color:rgba(255,190,140,.5);border-radius:16px;font-size:36px}
.prompt{position:absolute;left:110px;width:860px;height:132px;border-radius:30px;display:flex;align-items:center;gap:20px;padding:0 22px 0 40px;direction:ltr}
.prompt .tx{flex:1;font-family:Poppins,Cairo;font-weight:500;font-size:40px;color:#F6F3F2;white-space:nowrap;overflow:hidden}
.prompt .tx.ar{direction:rtl;text-align:right;font-family:Cairo;font-weight:700;font-size:44px}
.prompt .cur{display:inline-block;width:3px;height:46px;background:var(--org);vertical-align:middle;margin:0 4px}
.prompt .send{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFB067,var(--org) 45%,var(--red) 100%);box-shadow:0 0 30px rgba(255,120,20,.75);display:grid;place-items:center}
.card{position:absolute;border-radius:28px;background:linear-gradient(160deg,rgba(28,24,22,.92),rgba(12,11,10,.92));border:2px solid rgba(255,150,80,.5);
  box-shadow:0 0 50px rgba(255,110,25,.3),0 40px 90px rgba(0,0,0,.6);padding:34px 40px;direction:rtl;font-family:Cairo;color:var(--cream)}
.card h3{font-weight:900;font-size:58px;line-height:1.25}
.card .row{display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;margin-top:18px;color:#E9E4E1}
.card .row .b{width:16px;height:16px;border-radius:50%;background:var(--org);box-shadow:0 0 12px var(--glow);flex:none}
.card .tag{display:inline-block;font-family:Poppins;font-weight:600;font-size:28px;letter-spacing:2px;color:var(--org2);margin-bottom:14px}
.sweep{position:absolute;left:-600px;width:2280px;height:520px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,236,210,.95) 0%,rgba(255,150,50,.75) 18%,rgba(230,70,25,.35) 42%,transparent 70%);mix-blend-mode:screen;filter:blur(8px)}
.vf{position:absolute;inset:150px 90px 330px 90px}
.vf i{position:absolute;width:70px;height:70px;border-color:#fff;border-style:solid;opacity:.9}
.vf .rec{position:absolute;top:-6px;right:84px;font-family:Poppins;font-weight:600;font-size:28px;letter-spacing:2px;display:flex;align-items:center;gap:12px}
.vf .rec b{width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red)}
.vf .meta{position:absolute;bottom:-4px;font-family:Poppins;font-weight:500;font-size:24px;letter-spacing:1px;opacity:.85}
.stat{position:absolute;text-align:center;direction:rtl}
.stat .n{font-family:Bebas;font-size:260px;line-height:.9;color:#fff;text-shadow:0 0 50px rgba(255,120,20,.55)}
.stat .n em{font-style:normal;color:var(--org)}
.stat .l{font-family:Cairo;font-weight:800;font-size:46px;color:var(--cream)}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px}
.outro .lock{display:flex;align-items:center;gap:44px;direction:ltr}
.outro .sep{width:3px;height:150px;background:linear-gradient(transparent,rgba(255,255,255,.55),transparent)}
.outro .cta{font-family:Cairo;font-weight:900;font-size:68px;direction:rtl;text-align:center;line-height:1.35}
.outro .pill{font-family:Cairo;font-weight:800;font-size:40px;padding:14px 46px 18px;border-radius:999px;border:2px solid var(--org);direction:rtl;
  box-shadow:0 0 34px rgba(255,120,20,.45);background:rgba(20,14,10,.6)}
.demo{position:absolute;left:100px;width:880px;border-radius:34px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(60,30,18,.92),rgba(10,9,9,.94) 70%);
  border:2px solid rgba(255,150,80,.45);box-shadow:0 0 50px rgba(255,110,25,.25),0 30px 80px rgba(0,0,0,.6)}
.demo .it{position:absolute;will-change:transform}
.demo .lbl{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:Cairo;font-weight:900;font-size:44px;direction:rtl;color:var(--cream)}
.demo .lbl b{color:var(--org)}
.demo .base{position:absolute;height:0;border-top:3px dashed rgba(255,255,255,.22)}
.spark{position:absolute;width:60px;height:60px}
.toast{position:absolute;display:flex;align-items:center;gap:18px;direction:rtl;padding:18px 26px;border-radius:24px;font-family:Cairo;font-weight:800;font-size:36px}
.toast .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--org),var(--red));display:grid;place-items:center;font-size:34px}
.bar{position:absolute;height:64px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08)}
.bar .f{position:absolute;inset:0;transform-origin:right center;background:linear-gradient(270deg,var(--org),var(--red))}
</style></head>
<body><div id="stage"><img id="bg"><div id="fx" class="L"></div><div id="ov" class="L"></div></div>
<script>
// ===================== helpers =====================
const $ = (t, cls, parent, css, html) => { const e = document.createElement(t); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (parent || OV).appendChild(e); return e; };
const OV = document.getElementById('ov'), FXL = document.getElementById('fx'), BG = document.getElementById('bg');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);            // ease out cubic
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ei = x => clamp(x) ** 3;
const lerp = (a, b, k) => a + (b - a) * k;
const isLat = s => /^[A-Za-z0-9%+.\-#@$&!?:/']+$/.test(s.replace(/[«»"،,.!?؟]/g, ''));
// in/out envelope: 0..1 visible amount with separate in/out durations
const env = (t, t0, t1, din = .25, dout = .2) => t < t0 || t > t1 ? 0 : Math.min(eo((t - t0) / din), eo((t1 - t) / dout));
const SPARK = '<svg viewBox="0 0 100 100"><path d="M50 0 C55 38 62 45 100 50 C62 55 55 62 50 100 C45 62 38 55 0 50 C38 45 45 38 50 0Z" fill="url(#g)"/><defs><radialGradient id="g"><stop offset="0" stop-color="#FFF3E0"/><stop offset=".6" stop-color="#FFA34D"/><stop offset="1" stop-color="#E8441C"/></radialGradient></defs></svg>';
const ICONS = {
  check: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>',
  send: '<svg width="40" height="40" viewBox="0 0 24 24"><path d="M12 3l1.8 5.6L19.5 10l-5.7 1.6L12 17l-1.8-5.4L4.5 10l5.7-1.4z" fill="#fff"/></svg>',
};

const CAR = c => `<svg viewBox="0 0 120 56" width="120" height="56"><path d="M8 40 C8 30 14 28 22 27 L36 13 C40 9 44 8 50 8 L78 8 C85 8 89 10 93 15 L104 27 C112 28 116 31 116 38 L116 42 C116 45 114 46 111 46 L9 46 C8 46 8 44 8 40Z" fill="${c}"/><path d="M42 15 L52 13 L52 27 L30 27Z M58 13 L78 13 C82 13 85 15 88 19 L94 27 L58 27Z" fill="rgba(0,0,0,.45)"/><circle cx="32" cy="46" r="9" fill="#151210" stroke="${c}" stroke-width="3"/><circle cx="92" cy="46" r="9" fill="#151210" stroke="${c}" stroke-width="3"/></svg>`;
const CUP = (ang, cape) => {
  // ang: 'high' = seen from above (wide mouth, squat), 'low' = hero shot from below (tall, narrow mouth)
  const hi = ang === 'high';
  const W = 150, top = hi ? 70 : 18, ryT = hi ? 46 : 10, ryB = hi ? 30 : 22, H = hi ? 120 : 250, bw = hi ? .78 : .92;
  const y0 = 300 - H - 30, y1 = 300 - 30;
  const xL = 200 - W / 2, xR = 200 + W / 2, bL = 200 - W * bw / 2, bR = 200 + W * bw / 2;
  return `<svg viewBox="0 0 400 320" width="400" height="320"><defs><linearGradient id="cg${ang}" x1="0" x2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset=".35" stop-color="#F6F3F2" stop-opacity=".9"/><stop offset=".55" stop-color="#cfc6c0"/><stop offset="1" stop-color="#4a3a32"/></linearGradient></defs>
  ${cape ? `<path d="M${xL + 10} ${y0 + 20} Q200 ${y0 + 40} ${xR - 10} ${y0 + 20} L${xR + 40} ${y1 + 10} Q200 ${y1 - 20} ${xL - 40} ${y1 + 10} Z" fill="#D83B25" opacity=".95"/>` : ''}
  <path d="M${xL} ${y0} L${bL} ${y1} A${W * bw / 2} ${ryB} 0 0 0 ${bR} ${y1} L${xR} ${y0} Z" fill="url(#cg${ang})"/>
  <ellipse cx="200" cy="${y0}" rx="${W / 2}" ry="${ryT}" fill="#2a1d17" stroke="#F6F3F2" stroke-width="4"/>
  <ellipse cx="200" cy="${y0 + ryT * .25}" rx="${W / 2 - 10}" ry="${Math.max(4, ryT - 10)}" fill="#6b3a1c"/>
  <path d="M${xR - 4} ${y0 + H * .25} q${hi ? 40 : 52} ${H * .1} 0 ${H * .45}" fill="none" stroke="#e8e1dc" stroke-width="${hi ? 12 : 14}" stroke-linecap="round"/>
  ${cape ? `<g transform="translate(200 ${y0 + H * .55}) scale(${hi ? .7 : 1})"><path d="M-30 -24 L30 -24 L42 -8 L0 32 L-42 -8 Z" fill="#FFC36B" stroke="#D83B25" stroke-width="5"/><text x="0" y="12" text-anchor="middle" font-family="Bebas" font-size="40" fill="#D83B25">S</text></g>` : ''}
  </svg>`;
};
const CAM = `<svg viewBox="0 0 64 48" width="84" height="63"><rect x="4" y="10" width="56" height="34" rx="7" fill="#F6F3F2"/><rect x="20" y="4" width="20" height="9" rx="3" fill="#F6F3F2"/><circle cx="32" cy="27" r="11" fill="#151210" stroke="#FF8A1F" stroke-width="4"/></svg>`;
// ===================== state =====================
let SPEC, WORDS, CHUNKS = [], ELS = [], DUR = 0, SPEECH = 0;

// caption chunking: break on pauses, punctuation, max words/chars; manual breaks via spec.cap.breaks (word indices)
function chunkWords(words, cfg) {
  const maxW = cfg.maxWords || 3, maxC = cfg.maxChars || 20, br = new Set(cfg.breaks || []), nobr = new Set(cfg.join || []);
  const out = []; let cur = [];
  words.forEach((w, i) => {
    const prev = words[i - 1];
    const gap = prev ? w.s - prev.e : 0;
    const len = cur.map(x => x.w).join(' ').length + w.w.length;
    const wi = w.i ?? i;
    if (cfg.starts) { if (cur.length && cfg.starts.includes(wi)) { out.push(cur); cur = []; } cur.push(Object.assign({ i }, w)); return; }
    if (cur.length && !nobr.has(wi) && (br.has(wi) || gap > .32 || cur.length >= maxW || len > maxC || /[.!?؟،,]$/.test(prev.w))) { out.push(cur); cur = []; }
    cur.push(Object.assign({ i }, w));
  });
  if (cur.length) out.push(cur);
  return out.map((ws, k) => ({ ws, t0: ws[0].s - .06, t1: ws[ws.length - 1].e }));
}

window.init = (spec, words) => {
  SPEC = spec; WORDS = words; DUR = spec._dur; SPEECH = spec._speech;
  const cfg = spec.cap || {};
  const hl = new Set(cfg.hl || []);
  CHUNKS = chunkWords(words, cfg);
  // chunks stay on screen until the next one starts (or max .7s of silence)
  CHUNKS.forEach((c, k) => { const nx = CHUNKS[k + 1]; c.t1 = nx ? Math.min(nx.t0, c.t1 + .7) : c.t1 + .6; });
  const cap = $('div', '', OV); cap.id = 'cap';
  CHUNKS.forEach(c => {
    c.el = $('div', '', cap, 'display:none;gap:0 20px;flex-wrap:wrap;justify-content:center;direction:rtl');
    c.ws.forEach(w => {
      const txt = (cfg.fix && cfg.fix[w.i] != null) ? cfg.fix[w.i] : w.w;
      if (txt === '') return;
      const shown = txt.replace(/[،,.؛]+$/, '');
      // keep runs of Latin words in one LTR span so RTL layout doesn't reverse them
      const last = c.el.lastElementChild;
      if (isLat(txt) && last && last.classList.contains('lat') && !/[،,.]$/.test(last._raw || '')) { last.textContent += ' ' + shown; last._raw = txt; if (hl.has(w.i)) last.classList.add('hl'); return; }
      const e = $('span', 'w' + (hl.has(w.i) ? ' hl' : '') + (isLat(txt) ? ' lat' : ''), c.el, isLat(txt) ? 'direction:ltr;unicode-bidi:isolate' : '', shown);
      e._raw = txt;
      e._s = w.s;
    });
  });
  // chrome
  if (spec.logo !== false) { const l = $('img', '', OV); l.id = 'logo'; l.src = '../../project/brand/saber-group-logo.png'; }
  const p = $('div', '', OV); p.id = 'prog';
  // elements
  ELS = (spec.els || []).map(d => Object.assign(BUILD[d.type](d), { d }));
  // kinetic lines: shrink until each fits on one line inside the side margins
  ELS.filter(e => e.d.type === 'kin').forEach(e => {
    e.root.style.display = '';
    e.lines.forEach(L => { let fs = parseFloat(L.row.style.fontSize); const maxW = 1080 - 160;
      const w = () => L.ws.reduce((a, x) => a + x.getBoundingClientRect().width, 0) + 26 * (L.ws.length - 1);
      while (w() > maxW && fs > 40) { fs -= 4; L.row.style.fontSize = fs + 'px'; } });
    e.root.style.display = 'none';
  });
  return CHUNKS.map(c => [c.t0.toFixed(2), c.ws.map(w => w.w).join(' ')].join(' '));
};

// ===================== element builders =====================
const BUILD = {
  // full-screen kinetic typography scene (covers the video)
  kin(d) {
    const root = $('div', 'kin', OV, 'display:none');
    const pal = d.pal || 'ember';
    const blobs = [
      $('div', 'blob', root, `width:1500px;height:1500px;background:radial-gradient(circle,${pal === 'red' ? 'rgba(194,48,28,.75)' : 'rgba(232,87,28,.7)'} 0%,rgba(150,40,15,.25) 35%,transparent 68%)`),
      $('div', 'blob', root, 'width:1300px;height:1300px;background:radial-gradient(circle,rgba(143,32,23,.8) 0%,rgba(90,20,12,.3) 38%,transparent 68%)'),
      $('div', 'blob', root, 'width:900px;height:900px;background:radial-gradient(circle,rgba(255,176,103,.22) 0%,transparent 65%)'),
    ];
    $('div', 'grid', root); $('div', 'noise', root);
    const lines = (d.lines || []).map((ln, li) => {
      const row = $('div', 'kline', root, `top:${ln.y || 800}px;font-family:${ln.font || 'Alex'};font-weight:${ln.w || 800};font-size:${ln.size || 120}px;line-height:1.2;color:${ln.color || '#F6F3F2'}`);
      const ws = ln.text.split(' ').map((tx, wi) => {
        const hl = (ln.hl || []).includes(wi) || (ln.hl === 'all');
        return $('span', 'kw' + (hl ? ' hl' : '') + (isLat(tx) ? ' lat' : ''), row, '', tx);
      });
      if (ln.text.split(' ').every(isLat)) row.style.direction = 'ltr';
      let dots = null;
      if (ln.dots) dots = $('div', 'dots', root, `top:${(ln.y || 800) + (ln.size || 120) * 1.32}px;left:140px;right:140px;transform-origin:right center`);
      return { ln, row, ws, dots };
    });
    const streak = d.streak != null ? $('div', 'abs', root, `left:-200px;width:1480px;top:${d.streak}px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,rgba(255,170,90,.0) 10%,#FFE2C4 50%,rgba(255,140,50,.0) 90%,transparent);box-shadow:0 0 24px 6px rgba(255,120,30,.55)`) : null;
    const sparks = (d.sparks || []).map(s => $('div', 'spark', root, `left:${s[0]}px;top:${s[1]}px;width:${s[2] || 60}px;height:${s[2] || 60}px`, SPARK));
    return { root, blobs, lines, sparks, streak };
  },
  // illustrative demo panel: 'dots' (one stands out), 'cars' (one breaks the row), 'morph' (one square changes colour/size/shape/line)
  demo(d) {
    const H = d.h || 470;
    const root = $('div', 'demo', OV, `display:none;top:${d.y || 250}px;height:${H}px`);
    const its = [];
    const lblH = d.labels ? 80 : 0, cy = (H - lblH) / 2 + (d.mode === 'morph' ? 45 : 10);
    if (d.mode === 'dots') {
      const C = 7, R = 4;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const hero = r === 1 && c === 3;
        const e = $('div', 'it', root, `left:${440 + (c - 3) * 112 - 26}px;top:${cy + (r - 1.5) * 96 - 26}px;width:52px;height:52px;border-radius:50%;background:${hero ? 'radial-gradient(circle at 35% 30%,#FFC089,#FF8A1F 50%,#D83B25)' : 'rgba(255,255,255,.16)'}`);
        e._hero = hero; e._r = Math.hypot(c - 3, r - 1); its.push(e);
      }
      root._ring = $('div', 'it', root, `left:${440 - 60}px;top:${cy - 48 - 60}px;width:120px;height:120px;border-radius:50%;border:4px solid #FF8A1F;box-shadow:0 0 24px rgba(255,120,20,.7)`);
    } else if (d.mode === 'cars') {

    const x = t - d.t0, p = eo(x / .55), o2 = eo((d.t1 - t) / .25);
    const ry = d.ry ?? -16, rx = d.rx ?? 8;
    o.c.style.opacity = Math.min(clamp(x / .2), o2);
    o.c.style.transform = `translateY(${lerp(220, 0, p) - 14 * Math.sin(x * 1.4)}px) rotateY(${lerp(ry * 2.2, ry, p) + 2 * Math.sin(x)}deg) rotateX(${lerp(rx * 2.5, rx, p)}deg) scale(${lerp(.8, 1, p) * (1 - .06 * (1 - o2))})`;
    o.c.style.filter = `blur(${lerp(14, 0, p) + 10 * (1 - o2)}px)`;
    o.rows.forEach((r, k) => { const q = t - (d.at ? d.at[k] : d.t0 + .35 + k * .3); r.style.opacity = clamp(q / .2); r.style.transform = `translateX(${lerp(-40, 0, eo(q / .35))}px)`; });
  },
  vf(o, t) {
    const d = o.d, a = env(t, d.t0, d.t1, .2, .2);
    o.root.style.display = a > 0 ? '' : 'none'; if (!a) return;
    const p = eo((t - d.t0) / .35);
    o.root.style.opacity = a; o.root.style.transform = `scale(${lerp(1.12, 1, p)})`;
    o.rec.querySelector('b').style.opacity = Math.floor(t * 2) % 2 ? .25 : 1;
    const f = Math.floor(t * 30), s = Math.floor(t);
    o.m2.textContent = `00:00:${String(s).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`;
  },
  stat(o, t) {
    const d = o.d, a = env(t, d.t0, d.t1, .25, .25);
    o.root.style.display = a > 0 ? '' : 'none'; if (!a) return;
    const x = t - d.t0, p = eo(x / (d.count || 1));
    let v = Math.round(lerp(d.from || 0, d.to, p)), bump = 1;
    if (d.steps) { let prev = d.from ?? d.steps[0][1]; v = prev; d.steps.forEach(([st, sv]) => { if (t >= st) { const k = eo((t - st) / .22); v = Math.round(lerp(prev, sv, k)); bump = Math.max(bump, 1 + .12 * Math.sin(clamp((t - st) / .3) * Math.PI)); } prev = t >= st ? sv : prev; }); }
    o.n.innerHTML = `${d.pre || ''}${v}<em>${d.suf || ''}</em>`;
    o.root.style.opacity = a; o.root.style.transform = `scale(${lerp(.7, 1, back(x / .45)) * bump})`; o.root.style.filter = `blur(${lerp(12, 0, eo(x / .3))}px)`;
  },
  sweep(o, t) {
    const d = o.d, x = (t - d.t) / (d.d || .5);
    const on = x > -1 && x < 1;
    o.s.style.display = on ? '' : 'none'; o.fl.style.display = on ? '' : 'none'; if (!on) return;
    const dir = d.dir || 1;
    o.s.style.transform = `translateX(${dir * lerp(-1700, 1700, (x + 1) / 2)}px) rotate(${d.rot ?? -8}deg) scaleY(${.6 + .4 * (1 - Math.abs(x))})`;
    o.s.style.opacity = 1 - Math.abs(x) ** 2;
    o.fl.style.opacity = Math.max(0, 1 - Math.abs(x) * 2.2) * (d.flash ?? .9);
  },
  toast(o, t) {
    const d = o.d, a = env(t, d.t0, d.t1, .3, .25);
    o.root.style.display = a > 0 ? '' : 'none'; if (!a) return;
    const x = t - d.t0;
    o.root.style.opacity = a; o.root.style.transform = `translateY(${lerp(-60, 0, eo(x / .4))}px) scale(${lerp(.8, 1, back(x / .45))})`;
  },
  bars(o, t) {
    const d = o.d, a = env(t, d.t0, d.t1, .25, .25);
    o.root.style.display = a > 0 ? '' : 'none'; if (!a) return;
    o.root.style.opacity = a;
    o.rows.forEach((r, k) => {
      const q = t - (d.at ? d.at[k] : d.t0 + .2 + k * .25), p = eio(q / .7);
      r.lab.style.opacity = clamp(q / .2); r.bar.style.opacity = clamp(q / .2);
      r.f.style.transform = `scaleX(${p * r.it.v / 100})`;
      r.v.textContent = Math.round(p * r.it.v) + '%'; r.v.style.opacity = clamp(q / .2);
      r.v.style.left = (100 + 560 - 560 * p * r.it.v / 100 - 110) + 'px';
    });
  },
  outro(o, t) {
    const d = o.d, x = t - d.t0;
    o.root.style.display = x >= 0 ? '' : 'none'; if (x < 0) return;
    const pop = (el, at) => { const q = x - at; el.style.opacity = clamp(q / .2); el.style.transform = `scale(${clamp(lerp(.5, 1, back(q / .5)), 0, 1.3)})`; el.style.filter = `blur(${lerp(14, 0, eo(q / .35))}px)`; };
    pop(o.sg, .15); pop(o.mu, .35); o.sep.style.opacity = clamp((x - .3) / .3); o.sep.style.transform = `scaleY(${eo((x - .3) / .4)})`;
    const q = x - .7; o.cta.style.opacity = clamp(q / .25); o.cta.style.transform = `translateY(${lerp(40, 0, eo(q / .4))}px)`; o.cta.style.filter = `blur(${lerp(10, 0, eo(q / .35))}px)`;
    if (o.pill) { const q2 = x - 1.1; o.pill.style.opacity = clamp(q2 / .25); o.pill.style.transform = `scale(${lerp(.7, 1, back(q2 / .45)) * (1 + .03 * Math.sin(x * 5))})`; }
  },
};

// ===================== frame =====================
window.render = (t) => {
  // captions
  const hide = (SPEC.cap && SPEC.cap.hide || []).some(([a, b]) => t >= a && t <= b) || ELS.some(e => (e.d.type === 'kin' && t >= e.d.t0 + .05 && t <= e.d.t1 - .05) || (e.d.type === 'outro' && t >= e.d.t0));
  CHUNKS.forEach(c => {
    const vis = !hide && t >= c.t0 && t < c.t1;
    c.el.style.display = vis ? 'flex' : 'none';
    if (!vis) return;
    [...c.el.children].forEach(w => {
      const x = t - (w._s - .08), p = eo(x / .22);
      w.style.opacity = clamp(x / .1);
      const hlb = w.classList.contains('hl') ? 1 + .1 * Math.max(0, Math.sin(clamp(x / .35) * Math.PI)) : 1;
      w.style.transform = `translateY(${lerp(26, 0, p)}px) scale(${lerp(.86, 1, p) * hlb})`;
      w.style.filter = p < 1 ? `blur(${lerp(9, 0, p)}px)` : '';
    });
    // whole chunk out: quick fade on last 60ms
    c.el.style.opacity = clamp((c.t1 - t) / .06);
  });
  ELS.forEach(e => UPD[e.d.type](e, t));
  // chrome
  const outro = ELS.find(e => e.d.type === 'outro');
  const inOutro = outro && t >= outro.d.t0;
  document.getElementById('prog').style.width = (clamp(t / SPEECH) * 1080) + 'px';
  document.getElementById('prog').style.opacity = inOutro ? 0 : 1;
  const lg = document.getElementById('logo');
  if (lg) lg.style.opacity = inOutro || ELS.some(e => e.d.type === 'kin' && t > e.d.t0 && t < e.d.t1) ? 0 : .92;
  // background treatment
  BG.style.filter = inOutro ? `blur(${lerp(0, 26, eo((t - outro.d.t0) / .6))}px) brightness(${lerp(1, .42, eo((t - outro.d.t0) / .6))})` : '';
  BG.style.transform = inOutro ? `scale(${1.08 + .02 * (t - outro.d.t0)})` : '';
};
window.setBg = src => new Promise(r => { if (BG.getAttribute('src') === src) return r(); BG.onload = () => r(); BG.onerror = () => r(); BG.src = src; });
</script></body></html>
