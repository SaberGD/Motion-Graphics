<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-SemiBold.ttf);font-weight:600}
:root{--or:#FF6B1A;--or2:#FF8A3D;--teal:#16B8A6;--dark:#15120F;--cream:#FFF7EE;--red:#E8441C}
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo,"Noto Color Emoji",sans-serif;color:#fff}
.abs{position:absolute}
.w{display:inline-block;will-change:transform}
/* captions */
#capwrap{position:absolute;left:150px;width:760px;top:1300px;height:170px;display:flex;align-items:center;justify-content:center}
#cap{display:flex;align-items:center;gap:4px;white-space:nowrap;padding:10px 16px 14px;border-radius:26px;
  background:rgba(14,11,9,.82);box-shadow:0 14px 34px rgba(0,0,0,.30);

#cap .w{position:relative;padding:0 14px 6px;border-radius:16px;color:#fff}
#cap .w .hb{position:absolute;inset:6px 0 4px;border-radius:14px;background:var(--or);z-index:0;transform-origin:center}
#cap .w .tx{position:relative;z-index:1}
#cap .w.hl .tx{color:#FFB27A}
#cap .w.act .tx{color:#fff}
.cw{display:inline-block;background:rgba(14,11,9,.86);border-radius:26px;padding:0 30px 10px;line-height:1.45;box-shadow:0 14px 34px rgba(0,0,0,.30)}
.hl{color:var(--or)}
/* cards */
.dcard{background:rgba(21,18,15,.93);border-radius:30px;box-shadow:0 24px 60px rgba(0,0,0,.40),inset 0 0 0 2px rgba(255,255,255,.06)}
.tilt{line-height:1.35;background:#fff;color:#151210;border:6px solid var(--or);border-radius:20px;font-weight:900;padding:10px 34px 16px;white-space:nowrap;
  box-shadow:0 18px 40px rgba(0,0,0,.35)}
.badge{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--or);color:#fff;font-weight:900;font-size:40px;line-height:54px;text-align:center;
  border:5px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.label{font-family:Cairo;font-weight:800;font-size:30px;line-height:1.3;letter-spacing:3px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:14px}
.label i{display:block;height:3px;width:90px;background:var(--teal);border-radius:2px}
.row{display:flex;align-items:center;gap:20px;height:84px;position:relative;padding:0 18px;border-radius:16px}
.row .bg{position:absolute;inset:0;border-radius:16px;background:linear-gradient(270deg,var(--or),#ff9a52);transform-origin:right center}
.row .ic{position:relative;width:46px;height:46px;flex:none}
.row .ic .dia{position:absolute;inset:4px;background:var(--or);transform:rotate(45deg);border-radius:8px}
.row .ic .num{position:absolute;inset:0;text-align:center;line-height:46px;font-weight:900;font-size:24px;color:#fff}
.row .ic .chk{position:absolute;inset:0;border-radius:50%;border:4px solid var(--teal);}
.row .ic .chk:after{content:"";position:absolute;left:12px;top:6px;width:11px;height:20px;border:solid var(--teal);border-width:0 5px 5px 0;transform:rotate(45deg)}
.row .tx{position:relative;font-weight:900;font-size:50px;white-space:nowrap}
.chip{font-weight:900;font-size:28px;background:var(--or);color:#fff;border-radius:12px;padding:2px 14px 6px;direction:ltr}
.bar{height:34px;border-radius:17px;background:rgba(255,255,255,.12);position:relative;overflow:hidden;flex:1}
.bar .f{position:absolute;right:0;top:0;bottom:0;border-radius:17px}
.num{font-variant-numeric:tabular-nums}
.ai{letter-spacing:4px;unicode-bidi:isolate;direction:ltr;display:inline-block}
</style>

<body>
<div id="stage"></div>
<script>
const S=document.getElementById('stage');
const cl=x=>Math.max(0,Math.min(1,x));
const E={
  back:(x,s=1.9)=>{x=cl(x);return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)},
  expo:x=>{x=cl(x);return x>=1?1:1-Math.pow(2,-10*x)},
  cub:x=>{x=cl(x);return 1-Math.pow(1-x,3)},
  inC:x=>{x=cl(x);return x*x*x},
  io:x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
};
const P=(t,t0,d)=>cl((t-t0)/d);
function mk(parent,cls,html,css){const d=document.createElement('div');if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(css)d.style.cssText=css;parent.appendChild(d);return d}
function show(el,v){el.style.display=v?'':'none'}
// generic enter/exit transform: pop with motion blur
function popStyle(el,t,t0,t1,o={}){
  const din=o.din||.42,dout=o.dout||.28,rot=o.rot||0,dy=o.dy??60,sc0=o.sc0??.6;
  if(t<t0||t>t1+dout){el.style.opacity=0;el.style.visibility='hidden';return false}
  el.style.visibility='visible';
  const pi=P(t,t0,din),po=P(t,t1,dout);
  const s=(sc0+(1-sc0)*E.back(pi))*(1-.25*E.inC(po));
  const y=dy*(1-E.cub(pi))+ (o.outY??-30)*E.inC(po);
  const blur=Math.max(0,(1-E.cub(pi*1.4))*10)+E.inC(po)*10;
  el.style.opacity=cl(pi*2.5)*(1-E.inC(po));
  el.style.transform=`translateY(${y}px) scale(${s}) rotate(${rot*(o.rotIn?E.back(pi):1)}deg)`;
  el.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:'none';
  return true;
}
const comps=[];
const add=f=>comps.push(f);

/* ---------------- captions ---------------- */
const RAW=[
 // [whisper line index, corrected tokens ('' = merge into previous), highlight indices]
 ["الذكاء الاصطناعي فتح لك باب مش هيتفتح تاني غير بعد 20 سنة",[10,11]],
 ["وانت واقف تتفرج",[2]],
 ["من 10 سنين عشان تتعلم أي مهارة من مهارات الفريلانسنج",[1,2]],
 ["سواء الجرافيك المونتاج الموشن جرافيك",[1,2,3,4]],
 ["كنت محتاج تنافس تنانين",[3]],
 ["ناس بقالها حوالي 20 30 40 سنة في المجال وسابقينك بسنين",[3,4,5,6]],
 ["الـAI _ دلوقتي صفّر العداد ده",[0,3,4]],
 ["كلنا بنبدأ من نفس النقطة",[3,4]],
 ["سواء عندك خبرة 10 سنين 20 سنة أو لسه بتبدأ",[]],
 ["كله بيبدأ من نفس المكان",[3,4]],
 ["مفيش حد عنده منهجية واضحة",[3,4]],
 ["كله بيجرب كله بيستكشف من أول الخط",[5,6]],
 ["عشان كده ده أنسب وقت تتعلم وتدمج الـAI _ في مجالك",[3,4,7]],
 ["أيًا كان مجالك مونتاج جرافيكس موشن جرافيكس",[]],
 ["إن شاء الله يكون ترجمة",[4]],
 ["لازم تبدأ تتقن استخدام الـAI _",[2,4]],
 ["لو مركبتش الموجة بتاعة الـAI _ دي دلوقتي هتندم كتير بعد 10 سنين",[2,4,8,9]],
 ["لو مهتم تعرف أكتر عن الـAI _",[5]],
 ["سيبلي كومنت هرد عليك بالتفاصيل",[1]],
];
const CAP_OFF=[[0,3.30],[25.55,26.28],[40.62,99]];
let chunks=[];
function buildChunks(W){
  W.slice(0,RAW.length).forEach((seg,li)=>{
    const toks=RAW[li][0].split(' '),hl=RAW[li][1];
    const ws=seg.words;
    if(toks.length!==ws.length) console.warn('mismatch',li,toks.length,ws.length);
    let words=[];
    toks.forEach((tk,i)=>{const w=ws[Math.min(i,ws.length-1)];
      if(tk==='_'){words[words.length-1].e=w.e;return}
      words.push({w:tk,s:w.s,e:w.e,hl:hl.includes(i)})});
    // chunk: max 3 words, max 1.25s
    let cur=[];
    words.forEach(w=>{
      if(cur.length&&(cur.length>=3||w.e-cur[0].s>1.25)){chunks.push(cur);cur=[]}
      cur.push(w)});
    if(cur.length)chunks.push(cur);
  });
  chunks=chunks.map((c,i)=>({ws:c,s:c[0].s,e:c[c.length-1].e}));
  chunks.forEach((c,i)=>{c.end=i+1<chunks.length?Math.min(chunks[i+1].s,c.e+.6):c.e+.6});
}
const capwrap=mk(S,'',null,'');capwrap.id='capwrap';const cap=mk(capwrap,'',null,'');cap.id='cap';
let capCur=-1,capSpans=[];
add(t=>{
  const off=CAP_OFF.some(([a,b])=>t>=a&&t<b);
  const ci=off?-1:chunks.findIndex(c=>t>=c.s-.04&&t<c.end);
  if(ci!==capCur){cap.innerHTML='';capSpans=[];capCur=ci;
    if(ci>=0)chunks[ci].ws.forEach(w=>{const sp=mk(cap,'w'+(w.hl?' hl':''));const hb=mk(sp,'hb');
      mk(sp,'tx',w.w.replace('AI','<span class="ai">AI</span>'));capSpans.push({sp,hb})});
    cap.style.transform='none';
    if(ci>=0){const wd=cap.getBoundingClientRect().width;cap.dataset.fit=Math.min(1,760/wd)}}
  if(ci<0){cap.style.opacity=0;return}
  const c=chunks[ci];
  const inP=P(t,c.s-.06,.22),outP=P(t,c.end-.08,.08);
  const fit=+cap.dataset.fit;
  cap.style.opacity=cl(inP*3)*(1-outP);
  cap.style.transform=`translateY(${(1-E.cub(inP))*24}px) scale(${fit*(.9+.1*E.back(inP))})`;
  c.ws.forEach((w,i)=>{const {sp,hb}=capSpans[i];
    const act=t>=w.s-.03&&t<(i+1<c.ws.length?c.ws[i+1].s-.03:c.end);
    sp.classList.toggle('act',act);
    const hp=act?E.back(P(t,w.s-.03,.16),1.4):0;
    hb.style.transform=`scale(${hp})`;hb.style.opacity=act?1:0;
    sp.style.opacity=t>=w.s-.03?1:.45;
  });
});

/* ---------------- 0. HOOK (0 - 3.34) ---------------- */
{
  const g=mk(S,'abs',null,'left:150px;width:760px;top:960px;display:flex;flex-direction:column;align-items:center;gap:14px;line-height:1.25');
  const lab=mk(g,'',`<span style="display:inline-flex;align-items:center;gap:14px;background:var(--dark);border-radius:40px;padding:4px 28px 10px;font-weight:800;font-size:40px">
    <span style="width:16px;height:16px;border-radius:50%;background:var(--or);box-shadow:0 0 0 6px rgba(255,107,26,.25)"></span>الذكاء الاصطناعي</span>`,'margin-bottom:6px');
  const l2=mk(g,'','<span class="cw" style="font-size:104px;font-weight:1000">فتحلك باب</span>','');
  const l3=mk(g,'','<span class="cw" style="font-size:62px;font-weight:800">مش هيتفتح تاني</span>','');
  const l4=mk(g,'tilt','غير بعد <span style="color:var(--or)">20 سنة</span>','font-size:76px;position:relative;margin-top:16px;line-height:1.3');
  mk(l4,'badge','+','right:-26px;top:-30px;line-height:50px');
  add(t=>{
    popStyle(lab,t,window.V2?0.02:-0.5,3.22,{dy:40});
    popStyle(l2,t,0.84,3.25,{dy:70});
    popStyle(l3,t,1.66,3.28,{dy:50});
    popStyle(l4,t,2.40,3.30,{rot:-4,rotIn:true,sc0:.3});
  });
}

/* ---------------- checklist panel (reused) ---------------- */
function checklist({t0,t1,top,right=170,width=560,head,headAt,items}){
  const p=mk(S,'abs dcard',null,`top:${top}px;right:${right}px;width:${width}px;padding:26px 26px 22px;transform-origin:right top`);
  const h=mk(p,'label',`<span>${head}</span><i></i>`,'margin:0 6px 12px');
  const rows=items.map((it,i)=>{
    const r=mk(p,'row');const bg=mk(r,'bg');
    const ic=mk(r,'ic');const dia=mk(ic,'dia');const num=mk(ic,'num',String(i+1));const chk=mk(ic,'chk');
    const tx=mk(r,'tx',it.text);
    let tag=null; if(it.tag){tag=mk(r,'chip',it.tag,'margin-right:auto')}
    return {r,bg,dia,num,chk,tx,tag,at:it.at};
  });
  add(t=>{
    if(!popStyle(p,t,t0,t1,{dy:0,sc0:.85,outY:0}))return;
    const hp=P(t,headAt,.35);h.style.opacity=hp;h.style.transform=`translateX(${(1-E.cub(hp))*-40}px)`;
    rows.forEach((o,i)=>{
      const a=P(t,o.at,.35);const next=i+1<rows.length?rows[i+1].at:1e9;
      const done=t>=next;const active=t>=o.at&&!done;
      o.r.style.opacity=t<o.at-.02?0:cl(a*2.5);
      o.r.style.transform=`translateX(${(1-E.expo(a))*-70}px)`;
      o.bg.style.transform=`scaleX(${active?E.expo(P(t,o.at,.3)):0})`;
      o.bg.style.opacity=active?1:0;
      const dp=P(t,next,.25);
      o.dia.style.opacity=done?1-dp:1;o.num.style.opacity=done?1-dp:1;
      o.dia.style.background=active?'#fff':'var(--or)';o.num.style.color=active?'var(--or)':'#fff';
      o.chk.style.opacity=done?dp:0;o.chk.style.transform=`scale(${done?.5+.5*E.back(dp):.5})`;
      o.tx.style.color=done?'rgba(255,255,255,.88)':'#fff';
      if(o.tag){const tp=P(t,o.at+.12,.3);o.tag.style.opacity=tp;o.tag.style.transform=`scale(${.4+.6*E.back(tp)})`}
    });
  });
}

checklist({t0:5.62,t1:9.10,top:800,head:'مهارات الفريلانسنج · من 10 سنين',headAt:5.75,width:600,

/* ---------------- tilted pill helper ---------------- */
function pill({t0,t1,html,top,left=null,right=null,rot=-4,size=64,badge='+',bcol='var(--or)',style=''}){
  const w=mk(S,'abs',null,`top:${top}px;${left!=null?'left:'+left+'px;':''}${right!=null?'right:'+right+'px;':''}`);
  const c=mk(w,'tilt',html,`font-size:${size}px;position:relative;${style}`);
  if(badge){const b=mk(c,'badge',badge,`right:-26px;top:-30px;background:${bcol}`)}
  add(t=>popStyle(c,t,t0,t1,{rot,rotIn:true,sc0:.3,dy:40}));
  return c;
}

{
  const c=mk(S,'abs dcard',null,'top:770px;left:160px;width:760px;height:440px;padding:0;overflow:hidden');
  const head=mk(c,'abs label','<span>كلنا بنبدأ من نفس النقطة</span><i></i>','top:26px;right:36px');
  const lineX=140; // from right
  const line=mk(c,'abs',null,`top:90px;bottom:30px;right:${lineX}px;width:6px;background:repeating-linear-gradient(180deg,var(--or) 0 16px,transparent 16px 28px);transform-origin:top`);
  const st=mk(c,'abs','<span class="chip" style="font-size:22px">START</span>',`top:84px;right:${lineX-34}px`);
  const lanes=[['10 سنين خبرة',18.14],['20 سنة خبرة',18.64],['لسه بتبدأ',19.30]].map(([txt,at],i)=>{
    const y=130+i*96;
    const tr=mk(c,'abs',null,`top:${y+36}px;right:${lineX+3}px;left:36px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;transform-origin:right`);
    const tx=mk(c,'abs',`<span style="font-weight:900;font-size:40px">${txt}</span>`,`top:${y}px;left:40px`);
    const dot=mk(c,'abs',null,`top:${y+20}px;right:${lineX-14}px;width:36px;height:36px;border-radius:50%;background:#fff;border:7px solid var(--or);box-sizing:border-box`);
    return {tr,tx,dot,at};
  });
  add(t=>{
    if(!popStyle(c,t,16.40,21.12,{dy:50,sc0:.8}))return;
    const hp=P(t,16.55,.35);head.style.opacity=hp;
    const lp=P(t,16.98,.45);line.style.transform=`scaleY(${E.expo(lp)})`;st.style.opacity=lp;
    lanes.forEach(o=>{const a=P(t,o.at,.4);o.tr.style.transform=`scaleX(${E.expo(a)})`;o.tx.style.opacity=cl(a*2);
      o.tx.style.transform=`translateX(${(1-E.expo(a))*-40}px)`;
      const pulse=t>19.92?Math.abs(Math.sin((t-19.92)*Math.PI*1.6))*.18:0;
      o.dot.style.transform=`scale(${E.back(P(t,o.at,.3))+pulse})`;});
  });
}

/* ---------------- 10. CTA comment (37.4 - 40.7) ---------------- */
{
  const c=mk(S,'abs',null,'top:910px;left:170px;width:740px;background:#fff;color:#151210;border-radius:30px;padding:26px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.4);box-sizing:border-box');

     <div style="width:64px;height:64px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center">

     <div style="font-weight:900;font-size:48px">مهتم تعرف أكتر عن الـ<span class="ai">AI</span>؟</div></div>`);
  const field=mk(c,'',null,'margin-top:22px;display:flex;align-items:center;gap:16px;background:#F3EEE8;border-radius:22px;padding:10px 12px 10px 22px;height:84px;box-sizing:border-box');
  const txt=mk(field,'',null,'flex:1;font-weight:800;font-size:40px;white-space:nowrap;overflow:hidden');
  const send=mk(field,'',`<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M3 11.5 21 3l-6.5 18-3-7.5z"/></svg>`,'width:64px;height:64px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center;transform:scaleX(-1)');
  const rep=mk(c,'',`<span style="display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border-radius:18px;padding:6px 22px 12px;font-weight:900;font-size:38px">✓ هرد عليك بالتفاصيل</span>`,'margin-top:18px');
  const full='سيبلي كومنت: "AI" 🔥';
  const chars=[...full];
  add(t=>{
    if(!popStyle(c,t,37.85,40.55,{dy:60,sc0:.7}))return;
    const tp=P(t,39.20,.55);const n=Math.round(chars.length*tp);
    txt.innerHTML=(n?chars.slice(0,n).join(''):'<span style="color:#9a918a">اكتب تعليق…</span>')+(t<39.95&&Math.floor(t*4)%2===0?'<span style="color:var(--or)">|</span>':'');
    const sp=P(t,39.96,.3);send.style.transform=`scaleX(-1) scale(${1+.3*Math.sin(sp*Math.PI)})`;
    const rp=P(t,40.18,.3);rep.style.opacity=rp;rep.style.transform=`translateY(${(1-E.cub(rp))*20}px)`;
  });
}

let CUTAWAYS=[[10.47,16.10],[22.95,25.067],[35.00,37.75]];
function mgAmt(t){let a=0;CUTAWAYS.forEach(([s0,s1])=>{a=Math.max(a,cl((t-(s0-.12))/.18)*(1-cl((t-(s1-.06))/.18)))});return a}
// tn = time on the output timeline (differs from t for re-ordered variants)
window.render=(t,tn)=>{comps.forEach(f=>f(t));S.style.opacity=1-mgAmt(tn??t)};
window.setVariant=(cuts)=>{window.V2=true;CUTAWAYS=cuts};
window.setCuts=(cuts)=>{CUTAWAYS=cuts};
window.init=W=>{buildChunks(W);return chunks.length};
